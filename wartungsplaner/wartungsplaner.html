<script>
/* Wartungsplaner · früh: Hell/Dunkel und Dichte vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
   Stil ist immer Glas (data-stil="glas" in index.html). Gemerkte Wahl Tag/Nacht gilt (Schlüssel wie in app.js) und
   wird zu data-theme="hell" bzw. "dunkel", sonst folgt es dem System. Dichte „dicht“ nur mit Maus ab 1100 px (Regel
   von stil-glas), sonst „komfort“; sie folgt der Fenstergröße. Dazu die Seitenbereiche (data-links, data-rechts). */
(function () {
  'use strict';
  const html = document.documentElement;
  let stil = null;
  try { stil = localStorage.getItem('wartungsplaner.stil'); } catch (e) { /* Speicher gesperrt */ }
  if (stil !== 'tag' && stil !== 'nacht') stil = matchMedia('(prefers-color-scheme: dark)').matches ? 'nacht' : 'tag';
  html.dataset.theme = stil === 'nacht' ? 'dunkel' : 'hell';
  // Seitenbereiche: Navigation links fest oder bei Bedarf, Details rechts offen oder zu (Schlüssel wie in app.js)
  let l = null;
  try { l = JSON.parse(localStorage.getItem('wartungsplaner.leisten') || 'null'); } catch (e) { /* gesperrt oder kaputt */ }
  html.dataset.links = l && l.links === 'bedarf' ? 'bedarf' : 'fest';
  html.dataset.rechts = l && l.rechts === 'offen' ? 'offen' : 'zu';
  const dicht = matchMedia('(pointer: fine) and (min-width: 1100px)');
  const dichteSetzen = () => { html.dataset.dichte = dicht.matches ? 'dicht' : 'komfort'; };
  dichteSetzen();
  dicht.addEventListener('change', dichteSetzen);
})();
</script>

/* Werkzeugkasten · design-grundlagen · Tokens (Haus-Fundament, Gestaltungsvertrag 1.0)

   Drei Ebenen (GESTALTUNG.md im Werkzeugkasten):
     1. Fundament (diese Datei): feste Namen nach Aufgabe, Hell/Dunkel-Mechanik, Grundwerte.
     2. Stil (Baustein stil-…): setzt die Werte unter [data-stil="…"], je Farbe hell (-h) und dunkel (-d).
     3. Marke der App: überschreibt einzelne Werte, z. B. :root[data-stil] { --wk-akzent-h: #…; --wk-akzent-d: #…; }

   Benutzen: immer die Namen ohne Endung (var(--wk-text)). Die Endungen -h/-d setzen nur Stile und Marken.

   Hell/Dunkel: data-theme="hell" | "dunkel" auf <html> oder einem Bereich; ohne Angabe folgt es dem System.
   "light" | "dark" gelten genauso (so schalten klmmbrtt, rudel und der Artifact-Viewer).
   Ein Bereich mit eigenem data-stil oder data-theme rechnet seine Werte selbst (Musterseite: Stile nebeneinander).
   Technik: Schalter --wk-wenn-hell/--wk-wenn-dunkel („leer“ = an, initial = aus) wählen je Name -h oder -d.

   Gestaltungsvertrag: Welche Namen es gibt (Rollen, Skalen, Grenzen, Dichten), steht in vertrag.json (VERTRAG.md).
   Neue Namen kommen nur über den Vertrag dazu; app-eigene Rollen tragen das Kürzel der App (--kb-*).

   Regel für alle Apps: gestrichelt und flach = Vorschlag, durchgezogen mit Schatten = entschieden.
   Grundwerte unten = Stil „Rand“ (randnotiz), damit die Bausteine auch ohne Stil gut aussehen. */

:root { --wk-wenn-hell: ; --wk-wenn-dunkel: initial; color-scheme: light; }

}
[data-theme="dunkel"], [data-theme="dark"] { --wk-wenn-hell: initial; --wk-wenn-dunkel: ; color-scheme: dark; }

   --wk-toast-links: bei mittig freier Rand links, z. B. die Breite einer Seitenleiste
   --wk-toast-oben: statt unten oben zeigen, dazu --wk-toast-unten: auto (etwa solange ein Overlay unten offen ist) */
.wk-toasts { position: fixed; right: 18px; bottom: var(--wk-toast-unten, 18px); top: var(--wk-toast-oben, auto); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 60; pointer-events: none; }
.wk-toasts[data-lage="mittig"] { left: var(--wk-toast-links, 0px); right: 0; align-items: center; padding: 0 16px; }
.wk-toasts[data-lage="mittig"] .wk-toast { box-sizing: border-box; max-width: min(560px, 100%); text-align: center; overflow-wrap: anywhere; }
.wk-toasts[data-lage="mittig"] .wk-toast.erfolg { justify-content: center; }
.wk-toast { background: var(--wk-haupt); color: var(--wk-auf-haupt); padding: 9px 16px; border-radius: var(--wk-radius-m); box-shadow: var(--wk-schatten-3); font: 500 calc(var(--wk-groesse-text) - .5px) var(--wk-schrift); animation: wk-rein var(--wk-dauer-mittel) ease-out; }
@keyframes wk-rein { from { transform: translateY(8px); opacity: 0; } }
/* Erfolg (WK.ui.toast(text, { art: 'erfolg' })): gut-Farben, Haken plus Wort, kleiner Hüpfer (nicht bei reduzierter Bewegung) */
.wk-toast.erfolg { display: flex; align-items: center; gap: 8px; background: var(--wk-gut-flaeche); color: var(--wk-gut-text); box-shadow: var(--wk-schatten-3), inset 0 0 0 var(--wk-strich-aktiv) var(--wk-gut); animation: wk-rein var(--wk-dauer-mittel) ease-out, wk-huepfer calc(var(--wk-dauer-mittel) * 2) ease-out var(--wk-dauer-mittel); }
.wk-toast.erfolg svg { width: 14px; height: 14px; flex: none; color: var(--wk-gut); }
@keyframes wk-huepfer { 40% { transform: translateY(-4px) scale(1.03); } 70% { transform: translateY(1px); } }
/* Toast mit Knopf (WK.ui.toast(text, { aktion })): nur dieser Toast nimmt Zeiger an, Knopf als unterstrichenes Wort
   in Textfarbe, Tippfläche 44 px hoch (reicht bis an den Rand des Toasts), Fokusrahmen in Textfarbe (auf jedem Toast-Grund sichtbar) */
.wk-toast.mit-aktion { pointer-events: auto; display: flex; align-items: center; gap: 16px; }
.wk-toast-aktion { min-height: 44px; margin: -9px -8px -9px 0; padding: 0 8px; background: none; border: 0; border-radius: var(--wk-radius-s);
  color: inherit; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.wk-toast-aktion:hover { text-decoration-thickness: 2px; }
.wk-toast-aktion:focus-visible { outline: var(--wk-strich-aktiv) solid currentColor; outline-offset: -4px; }
/* Füllen beim Feiern (Fortschritt, Wochenziel): ein Feld ploppt von links mit Überschwingen auf.
   animation: wk-fuellen var(--wk-dauer-feiern) var(--wk-kurve-feiern) both; transform-origin: left center.
   Bei reduzierter Bewegung blendet es nur ein (Regel unten schaltet Animationen in .wk ohnehin ab). */
@keyframes wk-fuellen { from { transform: scaleX(0); opacity: .4; } 60% { transform: scale(1.04, 1.8); } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { @keyframes wk-fuellen { from { opacity: .4; } to { opacity: 1; } } }
/* Rückfrage (WK.ui.frage): Dialog als Karte über dem Schleier */
.wk-frage { gap: 14px; }
.wk-frage:focus { outline: none; }   /* Container fängt nur den Fokus nach einem Tipp auf die Karte */
.wk-frage-text { margin: 0; color: var(--wk-text-2); }
.wk-frage-feld { display: flex; flex-direction: column; gap: 4px; font: 500 var(--wk-groesse-klein) var(--wk-schrift); color: var(--wk-text-2); }
.wk-frage-knoepfe { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.wk-btn.gefahr { background: var(--wk-fehler); border-color: var(--wk-fehler); color: var(--wk-flaeche); }
@media (prefers-reduced-motion: reduce) { .wk *, .wk-toast { animation: none !important; transition: none !important; } }

/* Zoom aus (WK.ui.zoom({ erlaubt: false }) setzt die Klasse an <html>): kein Doppeltipp-Zoom, kein Tipp-Verzug.
   :where() ohne Gewicht, damit eigene touch-action (z. B. pan-y am Stufen-Regler) gewinnt. */
:where(html.wk-ohne-zoom, html.wk-ohne-zoom *) { touch-action: manipulation; }

/* =====================================================================================================
   Gestaltungsvertrag 1.0: Bausteinkatalog (vertrag.json, VERTRAG.md)
   Klasse .wk-‹baustein›, Variante als data-variante, Zustand über ARIA oder data-zustand. data-vorschau
   (hover, fokus, gedrueckt) zeigt Zustände ohne Zeiger, nur auf Beispielseiten. Die Klassen oben (wk-btn,
   wk-pill, wk-seg, wk-toast, wk-liste, wk-kopf) bleiben als Bestand; neue Arbeit nimmt die Bausteine hier.
   Stile formen Bausteine unter [data-stil="…"] um; Apps ordnen sie nur an (Regel N5).
   ===================================================================================================== */

/* Symbole (SVG 16 × 16 mit Strich in currentColor, aria-hidden neben dem Wort) */
:where(.wk-knopf, .wk-typ, .wk-leer, .wk-leiste-eintrag, .wk-gruppenkopf, .wk-menue-eintrag, .wk-zeile-griff, .wk-etikett) svg {
  width: var(--wk-symbol-m); height: var(--wk-symbol-m); flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; }

/* Fokus und Sperre für alle bedienbaren Bausteine */
:is(.wk-knopf, .wk-schalter, .wk-haken, .wk-segment-wahl, .wk-reiter-wahl, .wk-regler, .wk-wahlfeld, .wk-chip, .wk-zeile, .wk-karte,
    .wk-gruppenkopf, .wk-menue-eintrag, .wk-leiste-eintrag):is(:focus-visible, [data-vorschau="fokus"]) {
  outline: var(--wk-strich-aktiv) solid var(--wk-fokus); outline-offset: 2px; }
:is(.wk-zeile, .wk-menue-eintrag):is(:focus-visible, [data-vorschau="fokus"]) { outline-offset: calc(var(--wk-strich-aktiv) * -1); }
:is(.wk-knopf, .wk-schalter, .wk-haken, .wk-segment-wahl, .wk-reiter-wahl, .wk-regler, .wk-wahlfeld):is(:disabled, [aria-disabled="true"]) {
  opacity: var(--wk-deaktiviert); cursor: not-allowed; box-shadow: none; filter: none; }

/* --- Knopf -------------------------------------------------------------------------------------- */
.wk-knopf { display: inline-flex; align-items: center; justify-content: center; gap: var(--wk-abstand-2); box-sizing: border-box;
  min-height: var(--wk-knopf); padding: var(--wk-abstand-1) var(--wk-abstand-4); border: var(--wk-strich) solid var(--wk-linie-stark);
  border-radius: var(--wk-radius-m); background: var(--wk-feld); color: var(--wk-text); vertical-align: middle;
  font: var(--wk-gewicht-stark) var(--wk-groesse-text)/1.25 var(--wk-schrift); white-space: nowrap; text-decoration: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: background var(--wk-dauer-kurz) var(--wk-kurve), filter var(--wk-dauer-kurz) var(--wk-kurve); }
.wk-knopf[data-variante="haupt"] { background: var(--wk-haupt); border-color: var(--wk-haupt); color: var(--wk-auf-haupt); box-shadow: var(--wk-schatten-1); }
.wk-knopf[data-variante="leise"] { background: transparent; border-color: transparent; color: var(--wk-text-2); min-height: var(--wk-knopf-leise);
  padding-inline: var(--wk-abstand-2); }
.wk-knopf[data-variante="symbol"] { background: transparent; border-color: transparent; color: var(--wk-text-2); padding: 0; min-width: var(--wk-knopf); }
.wk-knopf[data-variante="gefahr"] { background: var(--wk-fehler); border-color: var(--wk-fehler); color: var(--wk-auf-fehler); }
.wk-knopf[data-variante="fertig"] { background: var(--wk-gut-flaeche); border-color: var(--wk-gut-rand); color: var(--wk-gut-text); }
.wk-knopf[data-variante="schliessen"] { background: transparent; border-color: transparent; color: var(--wk-text-2); padding: 0; min-width: var(--wk-knopf);
  border-radius: var(--wk-radius-rund); }
.wk-knopf[data-variante="plus"] svg { color: var(--wk-haupt); }
.wk-knopf[data-variante="aktion"] { min-width: calc(var(--wk-knopf) + var(--wk-abstand-3)); min-height: calc(var(--wk-knopf) + var(--wk-abstand-3)); padding: 0;
  border-radius: var(--wk-radius-rund); background: var(--wk-haupt); border-color: var(--wk-haupt); color: var(--wk-auf-haupt); box-shadow: var(--wk-schatten-2); }
.wk-knopf[data-variante="aktion"] svg { width: var(--wk-symbol-l); height: var(--wk-symbol-l); }
/* Hover und Drücken: gefüllte Varianten werden heller bzw. dunkler, die übrigen bekommen eine Fläche */
.wk-knopf:is(:hover, [data-vorschau="hover"]):not([data-variante="haupt"], [data-variante="gefahr"], [data-variante="aktion"], [data-variante="fertig"]) {
  background: var(--wk-feld-hover); }
.wk-knopf:is(:active, [data-vorschau="gedrueckt"], [aria-pressed="true"]):not([data-variante="haupt"], [data-variante="gefahr"], [data-variante="aktion"], [data-variante="fertig"]) {
  background: var(--wk-gedrueckt); color: var(--wk-text); }
.wk-knopf:is([data-variante="haupt"], [data-variante="gefahr"], [data-variante="aktion"], [data-variante="fertig"]):is(:hover, [data-vorschau="hover"]) { filter: brightness(1.08); }
.wk-knopf:is([data-variante="haupt"], [data-variante="gefahr"], [data-variante="aktion"], [data-variante="fertig"]):is(:active, [data-vorschau="gedrueckt"]) { filter: brightness(.9); }
/* Lädt: Kreis vor dem Wort, Knopf bleibt so breit und ist nicht bedienbar (aria-busy) */
.wk-knopf[data-zustand="laedt"] { cursor: progress; pointer-events: none; }
.wk-knopf[data-zustand="laedt"] svg { display: none; }
.wk-knopf[data-zustand="laedt"]::before { content: ""; box-sizing: border-box; width: var(--wk-symbol-m); height: var(--wk-symbol-m); flex: none;
  border: var(--wk-strich-aktiv) solid currentColor; border-right-color: transparent; border-radius: var(--wk-radius-rund);
  animation: wk-drehen 800ms linear infinite; }
@keyframes wk-drehen { to { transform: rotate(1turn); } }

/* --- Feld --------------------------------------------------------------------------------------- */
.wk-feld-gruppe { display: flex; flex-direction: column; gap: var(--wk-abstand-1); min-width: 0; }
.wk-feld-name { font: var(--wk-gewicht-stark) var(--wk-groesse-klein)/1.4 var(--wk-schrift); color: var(--wk-text-2); }
.wk-feld-hinweis { font: var(--wk-gewicht-normal) var(--wk-groesse-klein)/1.4 var(--wk-schrift); color: var(--wk-text-leise); }
.wk-feld { background: var(--wk-feld); font-size: var(--wk-groesse-feld); min-height: var(--wk-knopf); }
.wk-feld:hover { background: var(--wk-feld-hover); }
.wk-feld:is(:focus, :focus-within, [data-vorschau="fokus"]) { outline: var(--wk-strich-aktiv) solid var(--wk-fokus); outline-offset: 1px; border-color: var(--wk-fokus);
  background: var(--wk-feld); }
.wk-feld[aria-invalid="true"] { border-color: var(--wk-fehler); box-shadow: inset 0 0 0 var(--wk-strich) var(--wk-fehler); }
.wk-feld-gruppe:has([aria-invalid="true"]) .wk-feld-hinweis { color: var(--wk-fehler-text); }
.wk-feld:is([readonly], [aria-readonly="true"]) { background: transparent; border-color: var(--wk-linie); color: var(--wk-text-2); }
.wk-feld[data-variante="mehrzeilig"] { min-height: calc(var(--wk-abstand-7) + var(--wk-abstand-4)); line-height: var(--wk-zeilenhoehe); resize: vertical; }
.wk-feld:is([data-variante="zahl"], [data-variante="datum"], [data-variante="zeit"]) { font-variant-numeric: tabular-nums; }
.wk-feld[data-variante="zahl"] { text-align: end; }
.wk-feld[data-variante="datum"] { min-width: 10em; }
.wk-feld[data-variante="zeit"] { min-width: 6em; }
.wk-feld[data-variante="suche"] { border-radius: var(--wk-radius-rund); padding-inline: var(--wk-abstand-4); }
.wk-feld[data-variante="passwort"] { letter-spacing: .08em; }
.wk-feld[data-variante="code"] { font-family: var(--wk-schrift-mono); letter-spacing: .2em; font-variant-numeric: tabular-nums; }
.wk-feld[data-variante="etiketten"] { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wk-abstand-1); }
.wk-feld[data-variante="etiketten"] input { flex: 1; min-width: 8ch; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; outline: none; }

/* --- Wahl ---------------------------------------------------------------------------------------- */
.wk-wahl-zeile { display: inline-flex; align-items: center; gap: var(--wk-abstand-2); min-height: var(--wk-ziel); cursor: pointer; }
.wk-schalter[aria-checked="false"] { background: var(--wk-linie-stark); }
.wk-haken { -webkit-appearance: none; appearance: none; display: inline-grid; place-items: center; box-sizing: border-box; flex: none; margin: 0;
  width: var(--wk-symbol-l); height: var(--wk-symbol-l); border: var(--wk-strich) solid var(--wk-linie-stark); border-radius: var(--wk-radius-s);
  background: var(--wk-feld); cursor: pointer; transition: background var(--wk-dauer-kurz) var(--wk-kurve); }
.wk-haken::after { content: ""; width: 5px; height: 10px; margin-top: -2px; border: solid var(--wk-auf-aktiv); border-width: 0 var(--wk-strich-aktiv) var(--wk-strich-aktiv) 0;
  transform: rotate(45deg) scale(0); transition: transform var(--wk-dauer-kurz) var(--wk-kurve); }
.wk-haken:is(:checked, :indeterminate, [aria-checked="mixed"]) { background: var(--wk-aktiv); border-color: var(--wk-aktiv); }
.wk-haken:checked::after { transform: rotate(45deg) scale(1); }
.wk-haken:is(:indeterminate, [aria-checked="mixed"])::after { width: 10px; height: 0; margin: 0; border-width: 0 0 var(--wk-strich-aktiv); transform: none; }
.wk-segment { display: inline-flex; gap: var(--wk-abstand-1); padding: var(--wk-abstand-1); border-radius: var(--wk-radius-m); background: var(--wk-flaeche-2); }
.wk-segment-wahl { box-sizing: border-box; min-height: var(--wk-knopf-klein); padding: 0 var(--wk-abstand-3); border: 0; border-radius: var(--wk-radius-s);
  background: transparent; color: var(--wk-text-2); font: var(--wk-gewicht-normal) var(--wk-groesse-text)/1.25 var(--wk-schrift); white-space: nowrap; cursor: pointer; }
.wk-segment-wahl[aria-pressed="true"] { background: var(--wk-flaeche); color: var(--wk-text); font-weight: var(--wk-gewicht-stark); box-shadow: var(--wk-schatten-1); }
.wk-reiter { display: flex; gap: var(--wk-abstand-1); border-bottom: var(--wk-strich) solid var(--wk-linie); overflow-x: auto; }
.wk-reiter-wahl { box-sizing: border-box; min-height: var(--wk-knopf); padding: 0 var(--wk-abstand-3); border: 0; background: transparent; color: var(--wk-text-2);
  font: var(--wk-gewicht-normal) var(--wk-groesse-text)/1.25 var(--wk-schrift); white-space: nowrap; cursor: pointer; }
.wk-reiter-wahl[aria-selected="true"] { color: var(--wk-text); font-weight: var(--wk-gewicht-stark); box-shadow: inset 0 calc(var(--wk-strich-aktiv) * -1) 0 var(--wk-aktiv); }
.wk-regler { -webkit-appearance: none; appearance: none; width: 100%; height: var(--wk-ziel); margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
.wk-regler::-webkit-slider-runnable-track { height: 6px; border-radius: var(--wk-radius-rund); background: var(--wk-linie-stark); }
.wk-regler::-moz-range-track { height: 6px; border-radius: var(--wk-radius-rund); background: var(--wk-linie-stark); }
.wk-regler::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: border-box; width: var(--wk-symbol-l); height: var(--wk-symbol-l); margin-top: -7px;
  border: 3px solid var(--wk-flaeche); border-radius: var(--wk-radius-rund); background: var(--wk-haupt); box-shadow: var(--wk-schatten-1); }
.wk-regler::-moz-range-thumb { box-sizing: border-box; width: var(--wk-symbol-l); height: var(--wk-symbol-l); border: 3px solid var(--wk-flaeche);
  border-radius: var(--wk-radius-rund); background: var(--wk-haupt); box-shadow: var(--wk-schatten-1); }
.wk-wahlfeld { display: inline-flex; align-items: center; justify-content: space-between; gap: var(--wk-abstand-3); box-sizing: border-box; min-height: var(--wk-knopf);
  padding: 0 var(--wk-abstand-3); border: var(--wk-strich) solid var(--wk-linie-stark); border-radius: var(--wk-radius-m); background: var(--wk-feld);
  color: var(--wk-text); font: var(--wk-text-font); font-size: var(--wk-groesse-feld); text-align: start; cursor: pointer; }
.wk-wahlfeld::after { content: ""; width: 6px; height: 6px; margin-top: -3px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
  transition: transform var(--wk-dauer-kurz) var(--wk-kurve); }
.wk-wahlfeld[aria-expanded="false"]:hover { background: var(--wk-feld-hover); }
.wk-wahlfeld[aria-expanded="true"] { border-color: var(--wk-fokus); background: var(--wk-feld); }
.wk-wahlfeld[aria-expanded="true"]::after { margin-top: 3px; transform: rotate(-135deg); }
.wk-wahlfeld[data-variante="blatt"] { width: 100%; }

/* --- Anzeige ------------------------------------------------------------------------------------- */
button.wk-chip { min-height: var(--wk-ziel); cursor: pointer; }
.wk-chip[aria-pressed="true"] { background: var(--wk-aktiv); color: var(--wk-auf-aktiv); }
.wk-etikett { display: inline-flex; align-items: center; gap: var(--wk-abstand-1); padding: 2px var(--wk-abstand-2); border-radius: var(--wk-radius-rund);
  background: var(--wk-flaeche-2); color: var(--wk-text-2); font: var(--wk-gewicht-stark) var(--wk-groesse-klein)/1.4 var(--wk-schrift); white-space: nowrap; }
.wk-etikett svg { width: var(--wk-symbol-s); height: var(--wk-symbol-s); fill: currentColor; stroke: none; }
.wk-etikett[data-variante="vorschlag"] { background: transparent; outline: 1.5px dashed var(--wk-linie-stark); outline-offset: -1.5px; }
.wk-etikett[data-variante="entschieden"] { background: var(--wk-gut-flaeche); color: var(--wk-gut-text); box-shadow: inset 0 0 0 var(--wk-strich) var(--wk-gut-rand); }
.wk-etikett[data-variante="gut"] { background: var(--wk-gut-flaeche); color: var(--wk-gut-text); }
.wk-etikett[data-variante="achtung"] { background: var(--wk-achtung-flaeche); color: var(--wk-achtung-text); }
.wk-etikett[data-variante="fehler"] { background: var(--wk-fehler-flaeche); color: var(--wk-fehler-text); }
.wk-etikett[data-variante="info"] { background: var(--wk-info-flaeche); color: var(--wk-info-text); }
.wk-marke { font-size: var(--wk-groesse-marke); }
.wk-zaehler { display: inline-grid; place-items: center; box-sizing: border-box; min-width: calc(var(--wk-abstand-4) + var(--wk-abstand-1));
  height: calc(var(--wk-abstand-4) + var(--wk-abstand-1)); padding: 0 var(--wk-abstand-1); border-radius: var(--wk-radius-rund); background: var(--wk-flaeche-2);
  color: var(--wk-text-2); font: var(--wk-gewicht-stark) var(--wk-groesse-klein)/1 var(--wk-schrift); font-variant-numeric: tabular-nums; }
.wk-zaehler[data-variante="signal"] { background: var(--wk-fehler); color: var(--wk-auf-fehler); }
.wk-statuspunkt { display: inline-flex; align-items: center; gap: var(--wk-abstand-2); color: var(--wk-text-2); font: var(--wk-text-font); }
.wk-statuspunkt::before { content: ""; width: var(--wk-abstand-2); height: var(--wk-abstand-2); flex: none; border-radius: var(--wk-radius-rund);
  background: var(--wk-linie-stark); }
.wk-statuspunkt[data-variante="gut"]::before { background: var(--wk-gut); }
.wk-statuspunkt[data-variante="achtung"]::before { background: var(--wk-achtung); }
.wk-statuspunkt[data-variante="fehler"]::before { background: var(--wk-fehler); }
.wk-statuspunkt[data-variante="info"]::before { background: var(--wk-info); }
.wk-avatar { display: inline-grid; place-items: center; flex: none; width: var(--wk-abstand-6); height: var(--wk-abstand-6); overflow: hidden;
  border-radius: var(--wk-radius-rund); background: var(--wk-auswahl); color: var(--wk-text); font: var(--wk-gewicht-stark) var(--wk-groesse-klein)/1 var(--wk-schrift); }
img.wk-avatar { object-fit: cover; }
.wk-fortschritt { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 6px; border: 0; border-radius: var(--wk-radius-rund);
  overflow: hidden; background: var(--wk-flaeche-2); color: var(--wk-haupt); }
.wk-fortschritt::-webkit-progress-bar { background: var(--wk-flaeche-2); }
.wk-fortschritt::-webkit-progress-value { background: var(--wk-haupt); border-radius: var(--wk-radius-rund); }
.wk-fortschritt::-moz-progress-bar { background: var(--wk-haupt); border-radius: var(--wk-radius-rund); }
.wk-typ { display: inline-grid; place-items: center; flex: none; width: var(--wk-symbol-l); height: var(--wk-symbol-l); color: var(--wk-text-2); }

/* --- Zeile und Karte ----------------------------------------------------------------------------- */
.wk-zeilen { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.wk-zeile { position: relative; display: flex; align-items: center; gap: var(--wk-abstand-3); box-sizing: border-box; min-height: var(--wk-knopf);
  padding: var(--wk-abstand-2) var(--wk-abstand-3); border-bottom: var(--wk-strich) solid var(--wk-linie); color: var(--wk-text);
  transition: background var(--wk-dauer-kurz) var(--wk-kurve); }
