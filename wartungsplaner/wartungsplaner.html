            v.weg = [...new Set([...(v.weg || []), id])];
            if (v.geaendert) delete v.geaendert[id];
          }
        });
        document.querySelector('#inhalt [data-aktion="schritt-hinzufuegen"]')?.focus();
        ui.toast('Schritt entfernt');
      },
      'schritt-zurueckholen'(el, ctx) {
        ctx.aendern(d => { const v = finden(d, ctx.s.teil); v.weg = (v.weg || []).filter(w => w !== el.dataset.wert); });
        document.querySelector('#inhalt [data-aktion="schritt-hinzufuegen"]')?.focus();
        ui.toast('Schritt zurückgeholt');
      },
      'schritt-zuruecksetzen'(el, ctx) {
        const id = el.dataset.wert;
        ctx.aendern(d => { delete finden(d, ctx.s.teil).geaendert[id]; });
        document.getElementById(F.feldId(`schritt.${id}.titel`))?.focus();
        ui.toast('Auf Vorlage zurückgesetzt');
      },
      async 'variante-zuruecksetzen'(el, ctx) {
        const v = finden(ctx.daten(), ctx.s.teil);
        if (!await ui.frage({ titel: 'Alles auf Vorlage zurücksetzen?', ja: 'Alles auf Vorlage zurücksetzen', gefahr: true,
          text: `${F.mehrzahl(abweichungen(v), 'Abweichung geht', 'Abweichungen gehen')} verloren. Danach gleicht „${v.name}“ der Vorlage.` })) return;
        ctx.aendern(d => Object.assign(finden(d, ctx.s.teil), { hinzu: [], weg: [], geaendert: {} }));
        document.getElementById('wp-bearbeiten')?.focus();
        ui.toast('Auf Vorlage zurückgesetzt');
      },
      async 'variante-ableiten'(el, ctx) {
        const quelle = finden(ctx.daten(), ctx.s.teil);
        const w = await ui.frage({ titel: 'Variante ableiten', ja: 'Variante ableiten',
          text: `Die Variante übernimmt die Schritte von „${quelle.name}“. Abweichungen legst Du danach fest.`,
          felder: [{ name: 'name', label: 'Name der Variante', wert: `${quelle.name} (Variante)`, pflicht: true }] });
        if (!w) return;
        let id;
        ctx.aendern(d => {
          id = F.neueId(w.name, d.vorlagen.concat(d.varianten).map(v => v.id));
          d.varianten.push({ id, name: w.name.trim(), vorlage: quelle.id, hinzu: [], weg: [], geaendert: {} });
        });
        ctx.gehe('/vorlagen/' + encodeURIComponent(id));
        ui.toast('Variante abgeleitet', { art: 'erfolg' });
      },
      async 'vorlage-loeschen'(el, ctx) {
        const d = ctx.daten(), v = finden(d, ctx.s.teil), wort = istVariante(v) ? 'Variante' : 'Vorlage';
        const kind = d.varianten.find(x => x.vorlage === v.id), serie = d.serien.find(x => x.vorlage === v.id);
        if (kind || serie) {
          ui.toast(`„${v.name}“ wird noch von ${kind ? `der Variante „${kind.name}“` : `der Serie „${serie.name}“`} genutzt. Erst dort ändern oder löschen.`, { dauer: 6000 });
          return;
        }
        if (!await ui.frage({ titel: `„${v.name}“ löschen?`, text: 'Erzeugte Läufe behalten ihren Stand.', ja: `${wort} löschen`, gefahr: true })) return;
        ctx.aendern(dd => { dd.vorlagen = dd.vorlagen.filter(x => x.id !== v.id); dd.varianten = dd.varianten.filter(x => x.id !== v.id); });
        ctx.gehe('/vorlagen');
        ui.toast(`${wort} gelöscht`);
      },
    },
  };
})();
</script>
<script>
/* Wartungsplaner · Ansicht Releases: feste Termine wie LTS-Versionen, zentral für alle Kunden. Je Release Name, Datum,
   Notiz und für welche Projekte es gilt (ohne Zuordnung für alle). Wartungen und Serien können ihren Anker an ein
   Release knüpfen (Datum plus Abstand in Arbeitstagen). Ein neues Datum rechnet diese Wartungen neu; vorher sagt die
   App, wie viele sich mitbewegen. Braucht WP.form und WP.kern. */
(function () {
  'use strict';
  const { ui } = WK, esc = ui.esc, F = WP.form, K = WP.kern;

  const releaseVon = (d, id) => (d.releases || []).find(r => r.id === id) || null;
  const abhaengig = (d, id) => d.laeufe.filter(l => l.release && l.release.id === id);
  const serienAm = (d, r) => d.serien.filter(x => x.regel && x.regel.art === 'release'
    && (Array.isArray(x.regel.releases) && x.regel.releases.length ? x.regel.releases.includes(r.id) : K.releaseGilt(r, x.kunde, x.projekt)));

  /** Für wen gilt es: „Alle“ oder die zugeordneten Kunden · Projekte. */
  function geltung(d, r) {
    const z = r.projekte || [];
    if (!z.length) return 'Alle Kunden und Projekte';
    return z.map(s => {
      const [kid, pid] = s.split('/'), k = d.kunden.find(x => x.id === kid), p = k && (k.projekte || []).find(x => x.id === pid);
      return k ? (pid ? `${k.name} · ${p ? p.name : pid}` : `${k.name} (alle Projekte)`) : s;
    }).join(', ');
  }

  function liste(d, s) {
    const heute = F.heute();
    const zeilen = (d.releases || []).slice().sort((a, b) => String(a.datum || '9').localeCompare(String(b.datum || '9'))).map(r => {
      const n = abhaengig(d, r.id).length;
      return `<tr><td>${F.verweis('#/releases/' + encodeURIComponent(r.id), r.name || 'Ohne Namen', r.id === s.teil)}</td>`
        + `<td>${esc(r.datum ? F.tag(r.datum) : '–')}</td>`
        + `<td>${r.datum ? (r.datum < heute ? ui.pill('erfolg', 'Erschienen') : ui.pill('entschieden', 'Geplant')) : ui.pill('offen', 'Ohne Datum')}</td>`
        + `<td class="wp-umbruch">${esc(geltung(d, r))}</td><td>${esc(String(n))}</td></tr>`;
    }).join('');
    return F.tabelle('Releases', ['Release', 'Datum', 'Status', 'Gilt für', 'Wartungen am Release'], zeilen,
      'Noch keine Releases. Ein Release ist ein fester Termin, etwa eine LTS-Version. Wartungen können ihren Anker daran knüpfen.');
  }

  function editor(d, r) {
    const z = new Set(r.projekte || []), n = abhaengig(d, r.id).length, serien = serienAm(d, r);
    const wahl = (wert, text) => `<label class="wp-haken"><input type="checkbox" data-pfad="lokal.zuordnung" data-typ="lokal" data-wert="${esc(wert)}"${z.has(wert) ? ' checked' : ''}><span>${esc(text)}</span></label>`;
    const kunden = d.kunden.map(k => `<li><fieldset class="wp-zuordnung"><legend class="wp-mit-zeichen">${F.kundeZeichen(k, 'klein')}<span>${esc(k.name || 'Ohne Namen')}</span></legend>`
      + wahl(`${k.id}/`, 'Alle Projekte') + (k.projekte || []).map(p => wahl(`${k.id}/${p.id}`, p.name || 'Ohne Namen')).join('') + '</fieldset></li>').join('');
    return `<section class="wp-abschnitt wp-editor" aria-labelledby="wp-bearbeiten">`
      + F.editorKopf(r.name || 'Ohne Namen', F.knopf('Release löschen', 'release-loeschen', null, '', 'papierkorb'))
      + `<div class="wp-felder">${F.feld({ label: 'Name', pfad: 'name', wert: r.name, typ: 'pflicht', klasse: 'breit', hinweis: 'Etwa „LTS 2027.1“' })}`
      + F.feld({ label: 'Datum', pfad: 'datum', wert: r.datum, art: 'date', hinweis: n ? `Ein neues Datum rechnet ${F.mehrzahl(n, 'Wartung', 'Wartungen')} neu.` : '' })
      + `</div><div class="wp-felder">${F.notiz({ label: 'Notiz', pfad: 'notiz', wert: r.notiz, klasse: 'voll' })}</div>`
      + `<h3 class="wk-h3">Gilt für</h3>`
      + `<p class="wk-klein wp-leise">Ohne Haken gilt das Release für alle Kunden und Projekte. Eine Serie „je Release“ nimmt nur Releases, die für ihr Projekt gelten.</p>`
      + (kunden ? `<ul class="wp-zuordnungen">${kunden}</ul>` : '<p class="wk-klein wp-leise">Noch keine Kunden.</p>')
      + `<h3 class="wk-h3">Was daran hängt</h3>`
      + `<p>${esc(F.mehrzahl(n, 'Wartung', 'Wartungen'))} mit Anker an diesem Release${serien.length ? `, ${esc(F.mehrzahl(serien.length, 'Serie', 'Serien'))} je Release (${esc(serien.map(x => x.name).join(', '))})` : ''}.</p>`
      + '</section>';
  }

  async function anlegen(ctx) {
    const w = await ui.frage({ titel: 'Release anlegen', ja: 'Release anlegen', felder: [
      { name: 'name', label: 'Name', pflicht: true, platzhalter: 'LTS 2027.1' }, { name: 'datum', label: 'Datum', typ: 'date', pflicht: true }] });
    if (!w) return;
    let id;
    ctx.aendern(d => {
      d.releases = d.releases || [];
      id = F.neueId(w.name, d.releases.map(r => r.id));
      d.releases.push({ id, name: w.name.trim(), datum: w.datum });
    });
    ctx.gehe('/releases/' + encodeURIComponent(id));
    ui.toast('Release angelegt', { art: 'erfolg' });
  }

  /** Neues Datum: abhängige Wartungen rechnen neu; bewegen sich welche, vorher fragen. */
  async function datumAendern(el, ctx) {
    const d = ctx.daten(), r = releaseVon(d, ctx.s.teil), neu = el.value;
    if (!/^\d{4}-\d\d-\d\d$/.test(neu) || !r || neu === r.datum) { ctx.neu(); return; }
    const f = K.releaseFolgen(d, r.id, neu);
    if (f.betroffen.length) {
      const ok = await ui.frage({ titel: `${F.mehrzahl(f.betroffen.length, 'Wartung verschiebt', 'Wartungen verschieben')} sich mit`, ja: 'Datum ändern',
        text: `Ihr Anker hängt an „${r.name}“. Sie rechnen zum ${F.tag(neu)} neu und weichen Sperrzeiten aus. Erledigte Schritte bleiben.` });
      if (!ok) { ui.toast('Datum nicht geändert'); ctx.neu(); return; }
    }
    ctx.aendern(dd => { dd.laeufe = f.laeufe; releaseVon(dd, r.id).datum = neu; });
    ui.toast(f.betroffen.length ? `Datum geändert, ${F.mehrzahl(f.betroffen.length, 'Wartung', 'Wartungen')} neu gerechnet` : 'Datum geändert', { art: 'erfolg' });
  }

  WP.ansichten.releases = {
    inhalt(s, ctx) {
      const d = ctx.daten(), r = s.teil && releaseVon(d, s.teil);
      return liste(d, s) + (r ? editor(d, r) : ((d.releases || []).length ? '<p class="wk-klein wp-leise">Ein Release in der Liste wählen, um es zu bearbeiten.</p>' : ''));
    },
    haupt: (s, ctx) => anlegen(ctx),
    objekt: (d, s) => releaseVon(d, s.teil),
    feld(el, ctx) {
      if (el.dataset.pfad !== 'datum') return false;
      datumAendern(el, ctx);
      return true;
    },
    lokal(el, ctx) {
      if (el.dataset.pfad !== 'lokal.zuordnung') return;
      const w = el.dataset.wert, an = el.checked;
      ctx.aendern(d => {
        const r = releaseVon(d, ctx.s.teil), z = new Set(r.projekte || []);
        if (an) z.add(w); else z.delete(w);
        if (z.size) r.projekte = [...z]; else delete r.projekte;
      });
    },
    klick: {
      async 'release-loeschen'(el, ctx) {
        const d = ctx.daten(), r = releaseVon(d, ctx.s.teil), n = abhaengig(d, r.id).length;
        if (!await ui.frage({ titel: `„${r.name}“ löschen?`, ja: 'Release löschen', gefahr: true,
          text: n ? `${F.mehrzahl(n, 'Wartung behält', 'Wartungen behalten')} ihr Datum, hängen aber nicht mehr am Release.` : 'Es hängt keine Wartung daran.' })) return;
        ctx.aendern(dd => {
          dd.releases = (dd.releases || []).filter(x => x.id !== r.id);
          dd.laeufe.forEach(l => { if (l.release && l.release.id === r.id) delete l.release; });
        });
        ctx.gehe('/releases');
        ui.toast('Release gelöscht');
      },
    },
  };
})();
</script>
<script>
/* Wartungsplaner · Ansicht Serien: Liste, Serie mit Kunde, Projekt, Vorlage, Regel und Zeitraum, Vorschau der Anker
   (Vorschlag gestrichelt, erzeugter Lauf durchgezogen) und „Läufe erzeugen“ als Hauptaktion. Braucht WP.form und WP.kern. */
(function () {
  'use strict';
  const { ui } = WK, esc = ui.esc, F = WP.form, K = WP.kern;

  const REGELN = [['quartal', 'Jedes Quartal'], ['jahr', 'Mehrmals im Jahr'], ['monat', 'Jeden Monat am n-ten Wochentag'], ['liste', 'Feste Termine'], ['release', 'Je Release (LTS)']];
  const STANDARD = {
    quartal: () => ({ art: 'quartal', monat: 1, tag: 15 }),
    jahr: () => ({ art: 'jahr', anzahl: 2, monat: 1, tag: 15 }),
    monat: () => ({ art: 'monat', nter: 1, wochentag: 2 }),
    liste: () => ({ art: 'liste', anker: [] }),
    release: () => ({ art: 'release', abstand: 0 }),
  };
  const AUSWEICHEN = [['frueher', 'Auf den Arbeitstag davor'], ['spaeter', 'Auf den Arbeitstag danach'], ['nein', 'Nicht ausweichen']];
  const TAGE = [...Array.from({ length: 31 }, (_, i) => [i + 1, `${i + 1}.`]), ['letzter', 'Letzter Tag']];
  const NTER = [[1, 'ersten'], [2, 'zweiten'], [3, 'dritten'], [4, 'vierten'], [5, 'fünften'], [-1, 'letzten']];

  const serieVon = (d, id) => d.serien.find(x => x.id === id) || null;
  const vorlageVon = (d, id) => d.vorlagen.find(v => v.id === id) || d.varianten.find(v => v.id === id) || null;
  const kundeVon = (d, id) => d.kunden.find(k => k.id === id) || null;

  function regelText(r) {
    if (!r) return '–';
    const tag = r.tag === 'letzter' ? 'am letzten Tag' : `am ${r.tag || 1}.`;
    if (r.art === 'quartal') return `Quartal, ${r.monat || 1}. Monat ${tag}`;
    if (r.art === 'jahr') return `${r.anzahl || 1}× im Jahr ab ${F.MONATE[(r.monat || 1) - 1]}, ${tag}`;
    if (r.art === 'monat') return `Monatlich am ${(NTER.find(n => n[0] === (r.nter || 1)) || NTER[0])[1]} ${F.WOCHENTAGE_LANG[r.wochentag || 1]}`;
    if (r.art === 'liste') return F.mehrzahl((r.anker || []).length, 'fester Termin', 'feste Termine');
    if (r.art === 'release') return `Je Release${r.abstand ? `, ${r.abstand > 0 ? '+' : ''}${r.abstand} AT` : ''}`;
    return r.art;
  }

  /** Anker der Regel mit dem Tag nach dem Ausweichen; Fehler als Text. */
  function anker(d, serie) {
    if (!serie.von || !serie.bis) return { fehler: 'Zeitraum fehlt. Bitte Von und Bis eintragen.' };
    if (serie.bis < serie.von) return { fehler: 'Bis liegt vor Von. Bitte den Zeitraum korrigieren.' };
    try { return { liste: K.serieAnker(d, serie, serie.von, serie.bis) }; } catch (e) { return { fehler: e.message }; }
  }

  function liste(d, s, mitKnopf) {
    const zeilen = d.serien.map(x => {
      const k = kundeVon(d, x.kunde), p = k && (k.projekte || []).find(p => p.id === x.projekt), v = vorlageVon(d, x.vorlage);
      return `<tr><td>${F.verweis('#/serien/' + encodeURIComponent(x.id), x.name || 'Ohne Namen', x.id === s.teil)}</td>`
        + `<td>${esc(k ? k.name + (p ? ' · ' + p.name : '') : '–')}</td><td>${esc(v ? v.name : '–')}</td><td>${esc(regelText(x.regel))}</td>`
        + `<td>${esc(x.von ? `${F.tag(x.von)} – ${F.tag(x.bis)}` : '–')}</td><td>${d.laeufe.filter(l => l.serie === x.id).length}</td></tr>`;
    }).join('');
    return F.tabelle('Serien', ['Serie', 'Kunde · Projekt', 'Vorlage', 'Regel', 'Zeitraum', 'Läufe'], zeilen,
      'Noch keine Serien. Eine Serie legt über eine Regel die Anker fest, etwa jedes Quartal am 15.',
      mitKnopf ? F.knopf('Serie anlegen', 'serie-anlegen') : '');
  }

  function regelFelder(r) {
    const tag = () => F.wahl({ label: 'Tag', pfad: 'regel.tag', wert: r.tag ?? 1, optionen: TAGE, typ: 'zahlwahl' });
    if (r.art === 'quartal') {
      return F.wahl({ label: 'Monat im Quartal', pfad: 'regel.monat', wert: r.monat ?? 1, typ: 'zahlwahl', optionen: [[1, '1. Monat'], [2, '2. Monat'], [3, '3. Monat']] }) + tag();
    }
    if (r.art === 'jahr') {
      return F.wahl({ label: 'Wie oft im Jahr', pfad: 'regel.anzahl', wert: r.anzahl ?? 1, typ: 'zahlwahl', optionen: [1, 2, 3, 4, 6, 12].map(n => [n, `${n}×`]) })
        + F.wahl({ label: 'Ab Monat', pfad: 'regel.monat', wert: r.monat ?? 1, typ: 'zahlwahl', optionen: F.MONATE.map((m, i) => [i + 1, m]) }) + tag();
    }
    if (r.art === 'monat') {
      return F.wahl({ label: 'Am', pfad: 'regel.nter', wert: r.nter ?? 1, typ: 'zahlwahl', optionen: NTER })
        + F.wahl({ label: 'Wochentag', pfad: 'regel.wochentag', wert: r.wochentag ?? 1, typ: 'zahlwahl', optionen: F.WOCHENTAGE_LANG.slice(1).map((t, i) => [i + 1, t]) });
    }
    if (r.art === 'release') {
      return F.feld({ label: 'Abstand zum Release (AT)', pfad: 'regel.abstand', wert: r.abstand ?? 0, typ: 'zahl', art: 'number', klasse: 'schmal',
        extra: ' inputmode="numeric" step="1"', hinweis: 'Negativ = davor' });
    }
    return '';
  }

  function editor(d, x) {
    const r = x.regel || STANDARD.quartal(), k = kundeVon(d, x.kunde);
    const vorlagen = { gruppe: 'Vorlagen', optionen: d.vorlagen.map(v => [v.id, v.name]) };
    const varianten = { gruppe: 'Varianten', optionen: d.varianten.map(v => [v.id, v.name]) };
    const a = anker(d, x), laeufe = new Map(d.laeufe.filter(l => l.serie === x.id).map(l => [l.serienAnker, l]));
    let vorschau;
    if (a.fehler) vorschau = `<p class="wp-meldung">${ui.pill('fehler', 'Fehler')}<span>${esc(a.fehler)}</span></p>`;
    else if (!a.liste.length) vorschau = `<p class="wp-meldung">${ui.pill('offen', 'Keine Anker')}<span>Im Zeitraum liegt kein Anker. Bitte Regel oder Zeitraum ändern.</span></p>`;
    else {
      const imZeitraum = new Set(a.liste.map(e => e.serienAnker));
      const entfallen = [...laeufe.values()].filter(l => !imZeitraum.has(l.serienAnker) && l.serienAnker >= x.von && l.serienAnker <= x.bis && !l.angepasst);
      vorschau = `<ul class="wp-anker">` + a.liste.map(e => {
        const l = laeufe.get(e.serienAnker);
        const status = l ? (l.angepasst ? ui.pill('entschieden', 'Lauf angepasst') : ui.pill('entschieden', 'Lauf erzeugt')) : ui.pill('vorschlag', 'Vorschlag');
        const rel = e.release && K.releaseVon(d, e.release.id);
        const verschoben = rel ? `<small>${esc(rel.name)} · ${esc(F.tag(rel.datum))}</small>` : e.tag !== e.serienAnker ? `<small>Regel: ${esc(F.tag(e.serienAnker))}</small>` : '';
        const konflikte = l && l.konflikte.length ? `<small>${ui.pill('fehler', F.mehrzahl(l.konflikte.length, 'Konflikt', 'Konflikte'))}</small>` : '';
        return `<li class="wp-anker-tag ${l ? 'entschieden' : 'vorschlag'}">${status}<b>${esc(F.tag(e.tag))}</b>${verschoben}${konflikte}</li>`;
      }).join('') + entfallen.map(l => `<li class="wp-anker-tag vorschlag">${ui.pill('offen', 'Entfällt')}<b>${esc(F.tag(l.anker))}</b><small>nicht mehr in der Regel</small></li>`).join('')
        + '</ul>';
    }
    const laufZeilen = [...laeufe.values()].sort((p, q) => (p.anker < q.anker ? -1 : 1)).map(l => {
      const t = l.termine, von = t.length ? t.reduce((m, y) => (y.start < m ? y.start : m), t[0].start) : null;
      const bis = t.length ? t.reduce((m, y) => (y.ende > m ? y.ende : m), t[0].ende) : null;
      return `<tr><td>${esc(F.tag(l.anker))}</td><td>${esc(l.vorlage.name)}</td><td>${t.length}</td><td>${esc(von ? `${F.tag(von)} – ${F.tag(bis)}` : '–')}</td>`
        + `<td>${l.konflikte.length ? ui.pill('fehler', F.mehrzahl(l.konflikte.length, 'Konflikt', 'Konflikte')) : ui.pill('erfolg', 'Ohne Konflikt')}</td></tr>`;
    }).join('');
    return `<section class="wp-abschnitt wp-editor" aria-labelledby="wp-bearbeiten">`
      + F.editorKopf(x.name || 'Ohne Namen', F.knopf('Serie löschen', 'serie-loeschen'))
      + `<div class="wp-felder">${F.feld({ label: 'Name', pfad: 'name', wert: x.name, typ: 'pflicht', klasse: 'breit' })}`
      + F.wahl({ label: 'Kunde', pfad: 'kunde', wert: x.kunde, optionen: [['', 'Ohne Kunde'], ...d.kunden.map(y => [y.id, y.name])] })
      + F.wahl({ label: 'Projekt', pfad: 'projekt', wert: x.projekt, optionen: [['', 'Ohne Projekt'], ...((k && k.projekte) || []).map(p => [p.id, p.name])] })
      + F.wahl({ label: 'Vorlage', pfad: 'vorlage', wert: x.vorlage, optionen: [['', 'Bitte wählen'], vorlagen, varianten] }) + '</div>'
      + `<h3 class="wk-h3">Regel</h3><div class="wp-felder">`
      + F.wahl({ label: 'Rhythmus', pfad: 'regel.art', wert: r.art, optionen: REGELN }) + regelFelder(r)
      + (r.art === 'release' ? '' : F.wahl({ label: 'Fällt der Anker auf einen freien Tag', pfad: 'regel.ausweichen', wert: r.ausweichen || 'frueher', optionen: AUSWEICHEN, klasse: 'breit' }))
      + '</div>'
      + (r.art === 'release' ? `<p class="wk-klein wp-leise">${(d.releases || []).length ? 'Je Release, das für dieses Projekt gilt und im Zeitraum liegt, entsteht ein Lauf. Verschiebt sich ein Release, rechnet sein Lauf neu.'
        : 'Noch keine Releases. Bitte zuerst unter „Releases“ welche anlegen.'}</p>` : '')
      + (r.art === 'liste' ? F.reihen({ pfad: 'regel.anker', eintraege: (r.anker || []).map(t => ({ tag: t })), hinzu: 'Termin hinzufügen',
        leer: 'Noch keine Termine.', felder: [{ feld: 'tag', label: 'Termin', art: 'date' }] }) : '')
      + `<h3 class="wk-h3">Zeitraum</h3><div class="wp-felder">`
      + F.feld({ label: 'Von', pfad: 'von', wert: x.von, art: 'date' }) + F.feld({ label: 'Bis', pfad: 'bis', wert: x.bis, art: 'date' }) + '</div>'
      + `<h3 class="wk-h3">Vorschau der Anker</h3>`
      + '<p class="wk-klein wp-leise">Gestrichelt: Vorschlag aus der Regel. Durchgezogen: Lauf erzeugt. „Läufe erzeugen“ rechnet nicht angepasste Läufe neu.</p>'
      + vorschau
      + (laufZeilen ? `<h3 class="wk-h3">Läufe</h3><div class="wp-tabelle-rahmen" role="region" aria-label="Läufe" tabindex="0" data-scroll="laeufe">`
        + `<table class="wp-tabelle"><thead><tr><th scope="col">Anker</th><th scope="col">Vorlage</th><th scope="col">Schritte</th><th scope="col">Zeitraum</th><th scope="col">Status</th></tr></thead>`
        + `<tbody>${laufZeilen}</tbody></table></div>` : '')
      + '</section>';
  }

  async function anlegen(ctx) {
    const w = await ui.frage({ titel: 'Serie anlegen', ja: 'Serie anlegen', felder: [{ name: 'name', label: 'Name', pflicht: true }] });
    if (!w) return;
    let id;
    ctx.aendern(d => {
      id = F.neueId(w.name, d.serien.map(x => x.id));
      const k = d.kunden[0], v = d.vorlagen[0] || d.varianten[0], j = +F.heute().slice(0, 4) + 1;
      d.serien.push({ id, name: w.name.trim(), kunde: k ? k.id : '', projekt: k && k.projekte && k.projekte[0] ? k.projekte[0].id : '',
        vorlage: v ? v.id : '', regel: STANDARD.quartal(), von: `${j}-01-01`, bis: `${j}-12-31` });
    });
    ctx.gehe('/serien/' + encodeURIComponent(id));
    ui.toast('Serie angelegt', { art: 'erfolg' });
  }

  function erzeugen(ctx) {
    const d = ctx.daten(), x = serieVon(d, ctx.s.teil);
    if (!vorlageVon(d, x.vorlage)) { ui.toast('Keine Vorlage gewählt. Bitte eine Vorlage wählen.', { dauer: 5000 }); return; }
    const a = anker(d, x);
    if (a.fehler || !a.liste.length) { ui.toast(a.fehler || 'Im Zeitraum liegt kein Anker. Bitte Regel oder Zeitraum ändern.', { dauer: 5000 }); return; }
    let r;
    try { r = K.serieErzeugen(d, x); } catch (e) { ui.toast(`Läufe nicht erzeugt. ${e.message}.`, { dauer: 6000 }); return; }
    ctx.aendern(dd => { dd.laeufe = r.laeufe; });
    const teile = [['neu', r.neu], ['neu gerechnet', r.erneuert], ['angepasst behalten', r.behalten], ['entfallen', r.entfallen]]
      .filter(([, l]) => l.length).map(([w, l]) => `${l.length} ${w}`);
    ui.toast(`Läufe erzeugt: ${teile.join(', ')}`, { art: 'erfolg', dauer: 5000 });
  }

  WP.ansichten.serien = {
    inhalt(s, ctx) {
      const d = ctx.daten(), x = s.teil && serieVon(d, s.teil);
      return liste(d, s, !!x) + (x ? editor(d, x) : (d.serien.length ? '<p class="wk-klein wp-leise">Eine Serie in der Liste wählen, um sie zu bearbeiten.</p>' : ''));
    },
    aktion: (s, ctx) => (s.teil && serieVon(ctx.daten(), s.teil) ? 'Läufe erzeugen' : 'Serie anlegen'),
    haupt: (s, ctx) => (s.teil && serieVon(ctx.daten(), s.teil) ? erzeugen(ctx) : anlegen(ctx)),
    objekt: (d, s) => serieVon(d, s.teil),
    neu: { 'regel.anker': () => '' },
    feld(el, ctx) {
      const pfad = el.dataset.pfad;
      if (pfad === 'regel.art') {
        ctx.aendern(d => { const x = serieVon(d, ctx.s.teil); x.regel = { ...STANDARD[el.value](), ...(x.regel && x.regel.ausweichen ? { ausweichen: x.regel.ausweichen } : {}) }; });
        return true;
      }
      if (pfad === 'kunde') {
        // Neuer Kunde: sein erstes Projekt
        ctx.aendern(d => { const x = serieVon(d, ctx.s.teil), k = kundeVon(d, el.value); x.kunde = el.value; x.projekt = k && k.projekte && k.projekte[0] ? k.projekte[0].id : ''; });
        return true;
      }
      const m = /^regel\.anker\.(\d+)\.tag$/.exec(pfad);
      if (m) {
        ctx.aendern(d => { const x = serieVon(d, ctx.s.teil); x.regel.anker[+m[1]] = el.value; });
        return true;
      }
      if (pfad === 'regel.ausweichen' && el.value === 'frueher') {
        ctx.aendern(d => { delete serieVon(d, ctx.s.teil).regel.ausweichen; });
        return true;
      }
      return false;
    },
    klick: {
      'serie-anlegen': (el, ctx) => anlegen(ctx),
      async 'serie-loeschen'(el, ctx) {
        const d = ctx.daten(), x = serieVon(d, ctx.s.teil), n = d.laeufe.filter(l => l.serie === x.id).length;
        if (!await ui.frage({ titel: `„${x.name}“ löschen?`, ja: 'Serie löschen', gefahr: true,
          text: n ? `${F.mehrzahl(n, 'Lauf geht', 'Läufe gehen')} mit verloren.` : 'Es gibt noch keine Läufe.' })) return;
        ctx.aendern(dd => { dd.serien = dd.serien.filter(y => y.id !== x.id); dd.laeufe = dd.laeufe.filter(l => l.serie !== x.id); });
        ctx.gehe('/serien');
        ui.toast('Serie gelöscht');
      },
    },
  };
})();
</script>
<script>
/* Wartungsplaner · Einstellungen: eigene Abwesenheiten (daten.verfuegbarkeit.abwesenheiten). Braucht WP.form.
   app.js hängt abschnitt() an die Einstellungen; Felder beziehen sich auf daten.verfuegbarkeit. */
(function () {
  'use strict';
  const F = WP.form;
  WP.ansichten.einstellungen = {
    abschnitt(s, ctx) {
      const v = ctx.daten().verfuegbarkeit;
      return `<section class="wp-abschnitt"><h2 class="wk-h2">Abwesenheiten</h2>`
        + '<p class="wk-klein wp-leise">Eigene Abwesenheiten, etwa Urlaub. Sie gelten für alle Kunden. Schritte liegen nicht darin, außer sie dürfen es.</p>'
        + F.reihen({ pfad: 'abwesenheiten', eintraege: v.abwesenheiten, hinzu: 'Abwesenheit hinzufügen', leer: 'Keine Abwesenheiten.',
          pruefen: F.zeitraumPill, felder: [{ feld: 'von', label: 'Von', art: 'date' }, { feld: 'bis', label: 'Bis', art: 'date' },
            { feld: 'grund', label: 'Grund', klasse: 'breit' }] })
        + '</section>';
    },
    objekt: d => d.verfuegbarkeit,
    neu: { abwesenheiten: () => ({ von: '', bis: '', grund: '' }) },
  };
})();
</script>
<script>
/* Wartungsplaner · Blatt: Seitenblatt am rechten Rand (am Telefon von unten) mit eigenen Feldern (WP.blatt).
   Wie WK.ui.frage, aber mit beliebigem Inhalt: Felder tragen name, Pflichtfelder required.
     const w = await WP.blatt({ titel, text, inhalt: html, ja: 'Termin ändern', mehr: [{ wert, text }] });
     w = null (abgebrochen) oder { wahl: 'ja' | wert aus mehr, werte: { name: wert } }
   Esc oder Tipp neben das Blatt bricht ab, Enter bestätigt. Der Rest der Seite ist solange inert.
   Ist der Bereich „Details“ rechts ausgeklappt (data-rechts="offen", ab 1100 px), steht das Blatt fest darin: ohne
   Schleier, der Rest der Seite bleibt bedienbar. Ein neues Blatt, ein Wechsel der Ansicht oder Einklappen bricht ein
   offenes ab (festSchliessen). Ohne Blatt zeigt der Bereich, was blatt.leer() liefert (die App: „Als Nächstes“). */
(function () {
  'use strict';
  const esc = WK.ui.esc;
  let zaehler = 0, festOffen = null, leerHtml = null;
  const breit = matchMedia('(min-width: 1100px)');
  const imBereich = () => document.documentElement.dataset.rechts === 'offen' && breit.matches && !!document.getElementById('wp-rechts-inhalt');
  const LEER = '<p class="wk-klein wp-leise wp-rechts-leer">Einen Termin, Anker oder „Wartung planen“ wählen. Die Details erscheinen hier.</p>';
  const leer = () => (blatt.leer && blatt.leer()) || LEER;

  /** Offenes Blatt im Bereich rechts abbrechen (Ergebnis null). */
  function festSchliessen() { if (festOffen) festOffen(null); }
  addEventListener('hashchange', festSchliessen);
  breit.addEventListener('change', festSchliessen);

  function blatt({ titel, text = '', inhalt = '', ja = 'OK', nein = 'Abbrechen', mehr = [] }) {
    festSchliessen();
    return new Promise(fertig => {
      const id = `wp-blatt-${++zaehler}`, vorher = document.activeElement, fest = imBereich();
      const schleier = document.createElement('div');
      schleier.className = 'wk-schleier wp-blatt-schleier';
      schleier.innerHTML = `<form class="wk-dialog wk-karte wp-blatt" ${fest ? 'role="region"' : 'role="dialog" aria-modal="true"'} aria-labelledby="${id}-t" tabindex="-1" novalidate>`
        + `<h2 class="wk-h3" id="${id}-t">${esc(titel)}</h2>${text ? `<p class="wp-blatt-text">${esc(text)}</p>` : ''}`
        + `<div class="wp-blatt-inhalt">${inhalt}</div>`
        + `<div class="wk-frage-knoepfe">${nein ? `<button type="button" class="wk-btn" data-wahl="nein">${esc(nein)}</button>` : ''}`
        + mehr.map((m, i) => `<button type="button" class="wk-btn${m.gefahr ? ' gefahr' : ''}" data-wahl="mehr" data-mehr="${i}">${esc(m.text)}</button>`).join('')
        + `<button type="submit" class="wk-btn haupt" data-wahl="ja">${esc(ja)}</button></div></form>`;
      const form = schleier.firstChild;
      const bereich = fest && document.getElementById('wp-rechts-inhalt');
      const stumm = fest ? [] : [...document.body.children].filter(e => !e.inert && !e.classList.contains('wk-toasts'));
      stumm.forEach(e => { e.inert = true; });
      if (fest) { form.classList.add('wp-blatt-fest'); bereich.replaceChildren(form); leerHtml = null; } else document.body.appendChild(schleier);

      const werte = () => Object.fromEntries([...form.elements].filter(el => el.name)
        .map(el => [el.name, el.type === 'checkbox' ? el.checked : el.value]));
      let zu = false;
      const schliessen = wert => {
        if (zu) return;
        zu = true;
        document.removeEventListener('keydown', taste, true);
        if (fest) { if (festOffen === schliessen) festOffen = null; if (form.isConnected) bereich.innerHTML = leerHtml = leer(); } else schleier.remove();
        stumm.forEach(e => { e.inert = false; });
        const fokusDrin = fest && form.contains(document.activeElement);
        if ((!fest || fokusDrin || document.activeElement === document.body) && vorher && vorher.isConnected && vorher.focus) vorher.focus();
        fertig(wert);
      };
      if (fest) festOffen = schliessen;
      form.addEventListener('submit', e => {
        e.preventDefault();
        const leer = [...form.elements].find(el => el.required && !String(el.value).trim());
        if (leer) { leer.setAttribute('aria-invalid', 'true'); leer.focus(); return; }
        schliessen({ wahl: 'ja', werte: werte() });
      });
      form.addEventListener('input', e => e.target.removeAttribute('aria-invalid'));
      form.querySelector('[data-wahl="nein"]')?.addEventListener('click', () => schliessen(null));
      form.querySelectorAll('[data-wahl="mehr"]').forEach(k => k.addEventListener('click', () => schliessen({ wahl: mehr[k.dataset.mehr].wert, werte: werte() })));
      const taste = e => {
        if (fest ? !form.contains(e.target) || document.querySelector('.wk-schleier') : schleier !== [...document.querySelectorAll('.wk-schleier')].pop()) return;
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); schliessen(null); }
      };
      document.addEventListener('keydown', taste, true);
      let unten = null;
      schleier.addEventListener('pointerdown', e => { unten = e.target; });
      schleier.addEventListener('click', e => { if (e.target === schleier && unten === schleier) schliessen(null); });

      const start = form.querySelector('.wk-feld') || form.querySelector('[data-wahl="ja"]');
      start.focus();
    });
  }

  blatt.festSchliessen = festSchliessen;
  /** Bereich rechts ohne offenes Blatt neu füllen (nach jeder Änderung der Daten). */
  blatt.leerZeigen = () => {
    const bereich = document.getElementById('wp-rechts-inhalt');
    if (!bereich || festOffen) return;
    const html = leer();
    if (html !== leerHtml) bereich.innerHTML = leerHtml = html;   // gleich: Fokus bleibt
  };
  (window.WP = window.WP || {}).blatt = blatt;
})();
</script>
<script>
/* Wartungsplaner · Läufe planen und ändern (WP.plan), gemeinsam für Übersicht, Planung und Kalender.
   Braucht WP.form, WP.kern, WP.blatt und WK.ui.

   Filter (nur in dieser Sitzung): Kunde, Projekt, Lauf. Felder mit data-typ="lokal" und data-pfad="filter.<name>".
   Jede Änderung an Terminen läuft über änderLauf(): vorher fragt die App nach, wenn sich weitere Schritte mitbewegen
   („3 Schritte verschieben sich mit“). Am Termin bleibt `verschoben` { von, tage } gespeichert (WP.kern). */
(function () {
  'use strict';
  const { ui } = WK, esc = ui.esc, F = WP.form, K = WP.kern;

  const filter = { kunde: '', projekt: '', lauf: '' };
  const kundeVon = (d, id) => d.kunden.find(k => k.id === id) || null;
  const laufVon = (d, id) => d.laeufe.find(l => l.id === id) || null;
  const kurz = t => (t ? `${+t.slice(8, 10)}.${+t.slice(5, 7)}.` : '–');

  /** Name eines Laufs: Vorlage und Anker, dazu Kunde · Projekt. */
  function laufName(d, l) { return `${l.vorlage.name} ${F.tag(l.anker)}`; }
  /** Zeichen (Logo oder Initialen) des Kunden eines Laufs. */
  const kundeZeichen = (d, l, klasse = '') => F.kundeZeichen(kundeVon(d, l.kunde), klasse);
  /** Lauf mit Zeichen des Kunden, für Tabellen (HTML). */
  const laufZelle = (d, l) => `<span class="wp-mit-zeichen">${kundeZeichen(d, l, 'klein')}<span>${esc(laufName(d, l))}</span></span>`;
  function kundeText(d, l) {
    const k = kundeVon(d, l.kunde), p = k && (k.projekte || []).find(x => x.id === l.projekt);
    return k ? k.name + (p ? ' · ' + p.name : '') : 'Ohne Kunde';
  }

  /** Läufe nach Filter (Lauf-Filter nur, wo mitLauf). Ungültige Filterwerte (gelöscht) zählen nicht. */
  function laeufe(d, mitLauf = true) {
    if (filter.kunde && !kundeVon(d, filter.kunde)) Object.assign(filter, { kunde: '', projekt: '' });
    if (filter.lauf && !laufVon(d, filter.lauf)) filter.lauf = '';
    return d.laeufe.filter(l => (!filter.kunde || l.kunde === filter.kunde) && (!filter.projekt || l.projekt === filter.projekt)
      && (!mitLauf || !filter.lauf || l.id === filter.lauf)).sort((a, b) => (a.anker < b.anker ? -1 : a.anker > b.anker ? 1 : 0));
  }

  function filterLeiste(d, mitLauf = true) {
    const k = kundeVon(d, filter.kunde);
    const passend = d.laeufe.filter(l => (!filter.kunde || l.kunde === filter.kunde) && (!filter.projekt || l.projekt === filter.projekt))
      .sort((a, b) => (a.anker < b.anker ? -1 : 1));
    return `<div class="wp-felder wp-filter" role="group" aria-label="Filter">`
      + F.wahl({ label: 'Kunde', pfad: 'filter.kunde', wert: filter.kunde, typ: 'lokal', optionen: [['', 'Alle Kunden'], ...d.kunden.map(x => [x.id, x.name])] })
      + F.wahl({ label: 'Projekt', pfad: 'filter.projekt', wert: filter.projekt, typ: 'lokal',
        optionen: [['', 'Alle Projekte'], ...((k && k.projekte) || []).map(p => [p.id, p.name])] })
      + (mitLauf ? F.wahl({ label: 'Lauf', pfad: 'filter.lauf', wert: filter.lauf, typ: 'lokal', klasse: 'breit',
        optionen: [['', 'Alle Läufe'], ...passend.map(l => [l.id, laufName(d, l)])] }) : '')
      + '</div>';
  }

  /** Filterfeld geändert (data-typ="lokal"). Gibt true zurück, wenn es ein Filter war. */
  function lokal(el, ctx) {
    const m = /^filter\.(kunde|projekt|lauf)$/.exec(el.dataset.pfad || '');
    if (!m) return false;
    filter[m[1]] = el.value;
    if (m[1] === 'kunde') { filter.projekt = ''; filter.lauf = ''; }
    if (m[1] === 'projekt') filter.lauf = '';
    ctx.neu();
    return true;
  }

  // --- Blätter ---------------------------------------------------------------------------------------------
  const feld = (name, label, w, art = 'date', extra = ' required') =>
    `<label class="wp-feld" for="wp-blatt-${name}"><span>${esc(label)}</span><input class="wk-feld" id="wp-blatt-${name}" name="${name}" type="${art}" value="${esc(w ?? '')}"${extra}></label>`;
  const wahl = (name, label, w, optionen) => `<label class="wp-feld" for="wp-blatt-${name}"><span>${esc(label)}</span>`
    + `<select class="wk-feld" id="wp-blatt-${name}" name="${name}">${optionen.map(o => (Array.isArray(o)
      ? `<option value="${esc(o[0])}"${o[0] === w ? ' selected' : ''}>${esc(o[1])}</option>`
      : (o.optionen.length ? `<optgroup label="${esc(o.gruppe)}">${o.optionen.map(x => `<option value="${esc(x[0])}"${x[0] === w ? ' selected' : ''}>${esc(x[1])}</option>`).join('')}</optgroup>` : ''))).join('')}</select></label>`;
  const angaben = zeilen => `<dl class="wp-angaben">${zeilen.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;

  /** Neuen Lauf planen: Kunde · Projekt, Vorlage, Anker (Vorschlag: in 4 Wochen). */
  async function planen(ctx) {
    const d = ctx.daten();
    if (!d.vorlagen.length && !d.varianten.length) {
      ui.toast('Noch keine Vorlage. Bitte zuerst unter „Vorlagen“ eine anlegen.', { dauer: 5000 });
      return;
    }
    const ziele = [['|', 'Ohne Kunde']];
    d.kunden.forEach(k => { ziele.push([`${k.id}|`, k.name]); (k.projekte || []).forEach(p => ziele.push([`${k.id}|${p.id}`, `${k.name} · ${p.name}`])); });
    const k0 = filter.kunde ? kundeVon(d, filter.kunde) : d.kunden[0];
    const p0 = k0 ? (filter.kunde && filter.projekt) || ((k0.projekte || [])[0] || {}).id || '' : '';
    const w = await WP.blatt({ titel: 'Wartung planen', ja: 'Wartung planen',
      text: 'Der Lauf rechnet die Schritte vom Anker aus und weicht Sperrzeiten aus.',
      inhalt: wahl('ziel', 'Kunde · Projekt', k0 ? `${k0.id}|${p0}` : '|', ziele)
        + wahl('vorlage', 'Vorlage', (d.vorlagen[0] || d.varianten[0]).id,
          [{ gruppe: 'Vorlagen', optionen: d.vorlagen.map(v => [v.id, v.name]) }, { gruppe: 'Varianten', optionen: d.varianten.map(v => [v.id, v.name]) }])
        + (d.releases.length ? wahl('release', 'Anker am Release', '', [['', 'Kein Release, Datum unten'],
          ...d.releases.slice().sort((a, b) => String(a.datum).localeCompare(String(b.datum))).map(r => [r.id, `${r.name} · ${F.tag(r.datum)}`])])
          + feld('abstand', 'Abstand zum Release (AT)', 0, 'number', ' step="1" inputmode="numeric"')
          + '<p class="wk-klein wp-leise">Mit Release zählt der Anker vom Datum des Releases. Verschiebt sich das Release, rechnet die Wartung neu.</p>' : '')
        + feld('anker', 'Anker', K.plus(F.heute(), 28)) });
    if (!w) return;
    const [kunde, projekt] = w.werte.ziel.split('|');
    const r = w.werte.release && K.releaseVon(d, w.werte.release);
    if (r && !r.datum) { ui.toast(`„${r.name}“ hat kein Datum. Bitte unter Releases eins eintragen.`, { dauer: 6000 }); return; }
    const abstand = Math.trunc(Number(w.werte.abstand) || 0);
    const anker = r ? K.releaseAnker(d, kunde || null, r, abstand) : w.werte.anker;
    let lauf;
    try {
      const name = (d.vorlagen.find(v => v.id === w.werte.vorlage) || d.varianten.find(v => v.id === w.werte.vorlage)).name;
      lauf = K.laufErzeugen(d, { vorlage: w.werte.vorlage, anker, kunde: kunde || null, projekt: projekt || null,
        id: F.neueId(`${name} ${anker}`, d.laeufe.map(l => l.id)), release: r ? { id: r.id, abstand } : null });
    } catch (e) { ui.toast(`Nicht geplant. ${e.message}.`, { dauer: 6000 }); return; }
    Object.assign(filter, { kunde: kunde || '', projekt: projekt || '', lauf: lauf.id });
    ctx.aendern(dd => { dd.laeufe.push(lauf); });
    if (ctx.s.route !== 'planung') ctx.gehe('/planung');
    const n = lauf.konflikte.length;
    ui.toast(n ? `Wartung geplant. ${F.mehrzahl(n, 'Konflikt', 'Konflikte')}.` : 'Wartung geplant', { art: n ? '' : 'erfolg', dauer: 5000 });
  }

  /** Blatt eines Schritts: Angaben, Konflikte, Datumsfeld Start; „Erledigt“ bzw. „Wieder offen“. */
  async function schrittBlatt(ctx, laufId, schrittId) {
    const d = ctx.daten(), l = laufVon(d, laufId), t = l && l.termine.find(x => x.schritt === schrittId);
    if (!t) return;
    const status = t.erledigt ? ui.pill('erfolg', 'Erledigt') : t.konflikte.length ? ui.pill('fehler', 'Konflikt') : ui.pill('entschieden', 'Geplant');
    const w = await WP.blatt({ titel: t.titel, text: `${laufName(d, l)} · ${kundeText(d, l)}`, ja: 'Termin ändern',
      mehr: [{ wert: 'erledigt', text: t.erledigt ? 'Wieder offen' : 'Erledigt' }],
      inhalt: angaben([
        ['Status', status],
        ['Termin', esc(`${F.tag(t.start)} – ${F.tag(t.ende)}`) + (t.uhrzeit ? esc(`, ${t.uhrzeit.von}–${t.uhrzeit.bis}`) : '')],
        ['Dauer', esc(F.mehrzahl(t.dauer, 'Arbeitstag', 'Arbeitstage')) + (t.wartungsfenster ? ' im Wartungsfenster' : '')],
        t.rolle && ['Rolle', esc(t.rolle)],
        t.verschoben && ['Verschoben', esc(`von ${F.tag(t.verschoben.von)} um ${F.mehrzahl(Math.abs(t.verschoben.tage), 'Tag', 'Tage')} ${t.verschoben.tage < 0 ? 'früher' : 'später'}`)],
        t.konflikte.length && ['Konflikt', t.konflikte.map(esc).join('<br>')],
        t.notiz && ['Notiz', esc(t.notiz)],
        (l.tickets || []).some(x => x.schritt === schrittId && (x.schluessel || x.titel)) && ['Jira', (l.tickets || [])
          .filter(x => x.schritt === schrittId && (x.schluessel || x.titel))
          .map(x => (x.url && /^https?:\/\/\S+$/i.test(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.schluessel || x.titel)}</a>` : esc(x.schluessel || ''))
            + (x.titel && x.schluessel ? ` ${esc(x.titel)}` : '')).join('<br>')],
      ]) + feld('start', 'Neuer Start', t.start) + feld('ende', 'Neues Ende', t.ende)
        + `<p class="wk-klein wp-leise">Ein anderes Ende ändert die Dauer dieses Termins${t.wartungsfenster ? ' (in Tagen im Wartungsfenster)' : ' (in Arbeitstagen)'}.</p>` });
    if (!w) return;
    if (w.wahl === 'erledigt') { erledigt(ctx, laufId, schrittId); return; }
    await verschieben(ctx, laufId, schrittId, w.werte.start, w.werte.ende !== t.ende ? w.werte.ende : null);
  }

  /** Blatt des Ankers: Datumsfeld Anker; „Lauf löschen“. */
  async function ankerBlatt(ctx, laufId) {
    const d = ctx.daten(), l = laufVon(d, laufId);
    if (!l) return;
    const rel = l.release && K.releaseVon(d, l.release.id);
    const w = await WP.blatt({ titel: `Anker „${l.stand.anker}“ verschieben`, text: `${laufName(d, l)} · ${kundeText(d, l)}`, ja: 'Anker verschieben',
      mehr: [{ wert: 'loeschen', text: 'Lauf löschen', gefahr: true }],
      inhalt: angaben([['Anker', esc(F.tag(l.anker))], l.serie && ['Serie', esc(((d.serien.find(x => x.id === l.serie) || {}).name) || l.serie)],
        rel && ['Release', esc(`${rel.name} · ${F.tag(rel.datum)}${l.release.abstand ? ` · ${l.release.abstand > 0 ? '+' : ''}${l.release.abstand} AT` : ''}`)],
        ['Schritte', String(l.termine.length)]])
        + '<p class="wk-klein wp-leise">Der Lauf rechnet zum neuen Anker neu und weicht Sperrzeiten aus. Erledigte Schritte bleiben.'
        + (rel ? ` Ein eigener Anker löst die Wartung vom Release „${esc(rel.name)}“.` : '') + '</p>'
        + feld('anker', 'Neuer Anker', l.anker) });
    if (!w) return;
    if (w.wahl === 'loeschen') {
      if (!await ui.frage({ titel: `„${laufName(d, l)}“ löschen?`, ja: 'Lauf löschen', gefahr: true, text: 'Alle Termine des Laufs gehen verloren.' })) return;
      ctx.aendern(dd => { dd.laeufe = dd.laeufe.filter(x => x.id !== laufId); });
      ui.toast('Lauf gelöscht');
      return;
    }
    if (await ankerVerschieben(ctx, laufId, w.werte.anker) && rel && w.werte.anker !== l.anker) {
      ctx.aendern(dd => { const x = laufVon(dd, laufId); if (x) delete x.release; });
      ui.toast(`Eigener Anker: Die Wartung hängt nicht mehr an „${rel.name}“.`, { dauer: 6000 });
    }
  }

  // --- Ändern ----------------------------------------------------------------------------------------------
  /** Neuen Stand übernehmen; bewegen sich weitere Schritte mit, vorher nachfragen. */
  async function aendernMitFrage(ctx, alt, neu, ausloeser, text) {
    const mit = K.aenderungen(alt, neu).filter(a => a.schritt !== ausloeser);
    if (mit.length) {
      const ok = await ui.frage({ titel: `${F.mehrzahl(mit.length, 'Schritt verschiebt', 'Schritte verschieben')} sich mit`, ja: 'Verschieben',
        text: (text ? text + ' ' : '') + mit.map(a => `${a.titel}: ${kurz(a.von)} → ${kurz(a.nach)}`).join(' · ') });
      if (!ok) { ui.toast('Nicht verschoben'); return false; }
    }
    ctx.aendern(dd => { const i = dd.laeufe.findIndex(x => x.id === alt.id); if (i >= 0) dd.laeufe[i] = neu; });
    const n = neu.konflikte.length;
    ui.toast(n ? `Verschoben. ${F.mehrzahl(n, 'Konflikt', 'Konflikte')}.` : 'Verschoben', { art: n ? '' : 'erfolg', dauer: 5000 });
    return true;
  }

  /** Termin verschieben; mit `ende` ändert sich auch die Dauer (nur dieses Termins). */
  async function verschieben(ctx, laufId, schrittId, start, ende = null) {
    const d = ctx.daten(), l = laufVon(d, laufId), t = l && l.termine.find(x => x.schritt === schrittId);
    const datum = x => /^\d{4}-\d\d-\d\d$/.test(x || '');
    if (!t || !datum(start) || (ende && !datum(ende))) return false;
    if (ende && ende < start) { ui.toast('Das Ende liegt vor dem Start. Bitte ein späteres Ende wählen.', { dauer: 5000 }); return false; }
    if (t.start === start && (!ende || ende === t.ende)) { ui.toast('Termin unverändert'); return false; }
    return aendernMitFrage(ctx, l, K.verschieben(d, l, schrittId, start, ende), schrittId);
  }

  async function ankerVerschieben(ctx, laufId, anker) {
    const d = ctx.daten(), l = laufVon(d, laufId);
    if (!l || !/^\d{4}-\d\d-\d\d$/.test(anker || '')) return false;
    if (l.anker === anker) { ui.toast('Anker unverändert'); return false; }
    return aendernMitFrage(ctx, l, K.ankerVerschieben(d, l, anker), null, 'Der Lauf rechnet zum neuen Anker neu.');
  }

  function erledigt(ctx, laufId, schrittId) {
    let an = false, titel = '';
    ctx.aendern(dd => {
      const l = laufVon(dd, laufId), t = l && l.termine.find(x => x.schritt === schrittId);
      if (!t) return;
      an = !t.erledigt; titel = t.titel;
      if (an) t.erledigt = true; else delete t.erledigt;
      const kal = K.kalender(kundeVon(dd, l.kunde), dd.verfuegbarkeit);
      Object.assign(l, K.pruefen(l.termine, l.anker, kal));
    });
    if (titel) ui.toast(an ? `Erledigt: ${titel}` : `Wieder offen: ${titel}`, { art: an ? 'erfolg' : '' });
  }

  /** Alle Termine aller Läufe mit ihrem Lauf: [{ lauf, t }]. */
  const alleTermine = ls => ls.flatMap(l => l.termine.map(t => ({ lauf: l, t })));

  WP.plan = { filter, laeufe, laufVon, laufName, kundeText, filterLeiste, lokal, planen, schrittBlatt, ankerBlatt,
    verschieben, ankerVerschieben, erledigt, alleTermine, kurz, kundeZeichen, laufZelle };
})();
</script>
<script>
/* Wartungsplaner · Ansicht Planung: alle Läufe auf der Gantt-Zeitleiste (Baustein gantt), Filter nach Kunde, Projekt
   und Lauf, Maßstab, Konflikte als Symbol plus Wort. Je Lauf zuerst eine Raute am Anker, darunter die Schritte.
   Balken antippen öffnet das Blatt des Schritts, die Raute das Blatt des Ankers. Ziehen verschiebt um ganze Tage
   (das baut die App selbst, wie im README von gantt beschrieben). Braucht WP.plan, WP.form und WK.gantt. */
(function () {
  'use strict';
  const { ui, gantt } = WK, esc = ui.esc, F = WP.form, P = WP.plan;
  const MASSSTAB_SCHLUESSEL = 'wartungsplaner.massstab';
  const TRENNER = '|';

  let massstab = (() => { try { return localStorage.getItem(MASSSTAB_SCHLUESSEL); } catch (e) { return null; } })();
  if (!gantt.MASSSTAB_NAMEN[massstab]) massstab = 'wochen';
  function massstabSetzen(m) {
    massstab = m;
    try { localStorage.setItem(MASSSTAB_SCHLUESSEL, m); } catch (e) { /* gilt bis zum Schließen */ }
  }

  /** Gantt-Aufgaben der Läufe: Ids „lauf|schritt“, Anker „lauf|“. Dazu Konflikte je Aufgabe. */
  function aufgaben(d, laeufe) {
    const liste = [], konflikte = new Map();
    laeufe.forEach(l => {
      const id = s => l.id + TRENNER + s;
      liste.push({ id: id(''), titel: `${l.vorlage.name} · ${P.kurz(l.anker)}`, start: null, ende: l.anker, erledigt: l.termine.every(t => t.erledigt) });
      l.termine.forEach(t => {
        liste.push({ id: id(t.schritt), titel: t.titel, start: t.start, ende: t.ende, nach: t.nach ? id(t.nach) : null, art: t.art,
          puffer: t.puffer, erledigt: !!t.erledigt, fortschritt: t.erledigt ? 100 : 0 });
        if (t.konflikte.length && !t.erledigt) konflikte.set(id(t.schritt), t.konflikte);
      });
    });
    return { liste, konflikte };
  }

  // Breite des Fensters geändert: Zeitleiste neu zeichnen, damit sie die volle Breite nutzt (fuellen, einpassen)
  let letzterCtx = null, breiteUhr = null, letzteBreite = 0;
  addEventListener('resize', () => {
    clearTimeout(breiteUhr);
    breiteUhr = setTimeout(() => {
      const el = document.getElementById('wp-gantt');
      if (!el || !letzterCtx || el.clientWidth === letzteBreite) return;
      letzteBreite = el.clientWidth;
      letzterCtx.neu();
    }, 200);
  });

  function teilen(id) { const i = id.indexOf(TRENNER); return [id.slice(0, i), id.slice(i + 1)]; }

  /** Alle Termine der gezeigten Läufe mit konkreten Daten, nach Start (wie die Vorschau einer Vorlage). */
  function termineTabelle(d, laeufe) {
    const zeilen = P.alleTermine(laeufe).slice().sort((a, b) => (a.t.start < b.t.start ? -1 : a.t.start > b.t.start ? 1 : 0)).map(({ lauf, t }) => {
      const status = t.erledigt ? ui.pill('erfolg', 'Erledigt') : t.konflikte.length ? ui.pill('fehler', 'Konflikt') : ui.pill('entschieden', 'Geplant');
      return `<tr><td>${status}</td><td><button type="button" class="wp-verweis" data-aktion="termin-oeffnen" data-wert="${esc(lauf.id + TRENNER + t.schritt)}">${esc(t.titel)}</button></td>`
        + `<td>${esc(F.tag(t.start))}</td><td>${esc(F.tag(t.ende))}</td>`
        + `<td>${esc(F.mehrzahl(t.dauer, 'AT', 'AT'))}${t.uhrzeit ? ` · ${esc(t.uhrzeit.von)}–${esc(t.uhrzeit.bis)}` : ''}</td><td>${P.laufZelle(d, lauf)}</td></tr>`;
    }).join('');
    return F.tabelle('Termine', ['Status', 'Schritt', 'Start', 'Ende', 'Dauer', 'Lauf'], zeilen, 'Noch keine Läufe.');
  }

  /* Jira-Tickets: je Lauf eine Liste { schluessel, titel, url, schritt } (schritt leer = ganzer Lauf). Bearbeiten,
     wenn genau ein Lauf gewählt ist; sonst alle Tickets der gezeigten Läufe. Die App lädt nichts aus Jira: Der Link
     öffnet das Ticket im Browser. */
  const LINK = /^https?:\/\/\S+$/i;
  const ticketLink = x => (x.url && LINK.test(x.url)
    ? `<a class="wk-btn klein" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.schluessel || 'Ticket')} öffnen</a>`
    : x.url ? ui.pill('offen', 'Link prüfen') : '');
  function jiraAbschnitt(d, laeufe) {
    const l = P.filter.lauf && P.laufVon(d, P.filter.lauf);
    const kopf = '<section class="wp-abschnitt" aria-labelledby="wp-jira"><h2 class="wk-h2" id="wp-jira">Jira-Tickets</h2>';
    if (l) {
      const schritte = [['', 'Ganzer Lauf'], ...l.termine.map(t => [t.schritt, t.titel])];
      return kopf + `<p class="wk-klein wp-leise">Tickets zu „${esc(P.laufName(d, l))}“. Der Link öffnet das Ticket im Browser, die App selbst lädt nichts aus Jira.</p>`
        + F.reihen({ pfad: 'tickets', eintraege: l.tickets, hinzu: 'Ticket hinzufügen', leer: 'Noch keine Tickets verlinkt.', pruefen: ticketLink,
          felder: [{ feld: 'schluessel', label: 'Schlüssel' }, { feld: 'titel', label: 'Titel', klasse: 'breit' },
            { feld: 'url', label: 'Link', art: 'url', klasse: 'breit' }, { feld: 'schritt', label: 'Gehört zu', art: 'wahl', optionen: schritte }] })
        + '</section>';
    }
    const zeilen = laeufe.flatMap(x => (x.tickets || []).filter(tk => tk.schluessel || tk.titel).map(tk => {
      const t = tk.schritt && x.termine.find(y => y.schritt === tk.schritt);
      return `<tr><td>${esc(tk.schluessel || '–')}</td><td class="wp-umbruch">${esc(tk.titel || '')}</td><td>${esc(P.laufName(d, x))}</td>`
        + `<td>${esc(t ? t.titel : 'Ganzer Lauf')}</td><td>${ticketLink(tk) || '–'}</td></tr>`;
    })).join('');
    return F.tabelle('Jira-Tickets', ['Schlüssel', 'Titel', 'Lauf', 'Gehört zu', 'Link'], zeilen,
      laeufe.length ? 'Keine Tickets. Oben einen Lauf wählen, um Tickets zu verlinken.' : 'Noch keine Läufe.');
  }

  function konfliktTabelle(d, laeufe) {
    const zeilen = P.alleTermine(laeufe).filter(({ t }) => t.konflikte.length && !t.erledigt).map(({ lauf, t }) =>
      `<tr><td>${ui.pill('fehler', 'Konflikt')}</td><td><button type="button" class="wp-verweis" data-aktion="termin-oeffnen" data-wert="${esc(lauf.id + TRENNER + t.schritt)}">${esc(t.titel)}</button></td>`
      + `<td>${esc(F.tag(t.start))}</td><td>${P.laufZelle(d, lauf)}</td><td class="wp-umbruch">${esc(t.konflikte.join('; '))}</td></tr>`).join('');
    return F.tabelle('Konflikte', ['Status', 'Schritt', 'Start', 'Lauf', 'Grund'], zeilen,
      laeufe.length ? 'Keine Konflikte in den gezeigten Läufen.' : 'Noch keine Läufe.');
  }

  WP.ansichten.planung = {
    inhalt(s, ctx) {
      const d = ctx.daten(), laeufe = P.laeufe(d);
      return `<section class="wp-abschnitt">${P.filterLeiste(d)}`
        + `<div class="wp-abschnitt-kopf"><h2 class="wk-h2">Zeitleiste</h2>`
        + `<div class="wk-seg" role="group" aria-label="Maßstab">${['tage', 'wochen', 'monate', 'einpassen'].map(m =>
          `<button type="button" data-aktion="massstab" data-wert="${m}" aria-pressed="${m === massstab}">${esc(gantt.MASSSTAB_NAMEN[m])}</button>`).join('')}</div></div>`
        + (laeufe.length ? '<p class="wk-klein wp-leise">Balken antippen ändert den Termin, Ziehen verschiebt ihn. Die Raute ist der Anker des Laufs.</p>' : '')
        + `<div id="wp-gantt" class="wp-gantt"></div></section>`
        + termineTabelle(d, laeufe)
        + jiraAbschnitt(d, laeufe)
        + konfliktTabelle(d, laeufe);
    },
    aktion: () => 'Wartung planen',
    haupt: (s, ctx) => P.planen(ctx),
    lokal: (el, ctx) => P.lokal(el, ctx),
    // Bearbeitbares Objekt (Jira-Tickets): der gewählte Lauf
    objekt: d => (P.filter.lauf && P.laufVon(d, P.filter.lauf)) || null,
    neu: { tickets: () => ({ schluessel: '', titel: '', url: '' }) },
    klick: {
      massstab(el, ctx) { massstabSetzen(el.dataset.wert); ctx.neu(); },
      'termin-oeffnen'(el, ctx) { const [l, sch] = teilen(el.dataset.wert); P.schrittBlatt(ctx, l, sch); },
    },
    /** Nach dem Zeichnen: Gantt hinein, Konflikte markieren, Ziehen einrichten. */
    nachher(s, ctx) {
      const el = document.getElementById('wp-gantt');
      if (!el) return;
      const d = ctx.daten(), { liste, konflikte } = aufgaben(d, P.laeufe(d));
      const nachId = new Map(liste.map(a => [a.id, a]));
      let gezogen = false;
      const oeffnen = id => {
        if (gezogen) { gezogen = false; return; }
        const [l, sch] = teilen(id);
        if (sch) P.schrittBlatt(ctx, l, sch); else P.ankerBlatt(ctx, l);
      };
      const markieren = () => {
        el.querySelectorAll('.wk-gantt-name').forEach(li => {
          const k = konflikte.get(li.dataset.id);
          if (!k || li.querySelector('.wk-gantt-hinweis')) return;
          li.classList.add('konflikt');
          li.insertAdjacentHTML('beforeend', `<span class="wk-gantt-hinweis" title="${esc(k.join('; '))}">⚠ Konflikt</span>`);
        });
        const f = el.querySelector('.wk-gantt-flaeche');
        if (f && scrollLinks !== null) f.scrollLeft = scrollLinks;
        if (f) f.addEventListener('scroll', () => { scrollLinks = f.scrollLeft; }, { passive: true });
      };
      letzterCtx = ctx;
      gantt.zeichnen(el, liste, { massstab, pfeilform: 'rund', heute: F.heute(), onWahl: oeffnen, fuellen: true,
        onMassstab: m => { massstabSetzen(m); ctx.neu(); },
        leer: 'Noch keine Wartung geplant. Mit „Wartung planen“ erscheint der erste Lauf.' });
      markieren();

      // Ziehen: waagrecht um ganze Tage; ein Klick ohne Bewegung öffnet das Blatt (über onWahl).
      let zug = null;
      el.addEventListener('pointerdown', e => {
        const b = e.target.closest('.wk-gantt-balken, .wk-gantt-punkt');
        const a = b && nachId.get(b.dataset.id);
        if (!a || e.button !== 0 || a.erledigt) return;
        const tb = a.start ? b.offsetWidth / gantt.dauer(a.start, a.ende) : (gantt.MASSSTAB[massstab] || tagesbreite(el, liste));
        zug = { b, a, x: e.clientX, tb, tage: 0, bewegt: false, id: e.pointerId };
      });
      el.addEventListener('pointermove', e => {
        if (!zug || e.pointerId !== zug.id) return;
        const dx = e.clientX - zug.x;
        if (!zug.bewegt && Math.abs(dx) < 5) return;
        if (!zug.bewegt) { zug.bewegt = true; zug.b.setPointerCapture(e.pointerId); zug.b.classList.add('wp-zieht'); }
        zug.tage = Math.round(dx / zug.tb);
        zug.b.style.transform = `translateX(${zug.tage * zug.tb}px)`;
        const start = gantt.tagPlus(zug.a.start || zug.a.ende, zug.tage);
        zug.b.dataset.ziel = `${zug.tage > 0 ? '+' : ''}${zug.tage} · ${P.kurz(start)}`;
      });
      const loslassen = abbruch => e => {
        if (!zug || e.pointerId !== zug.id) return;
        const z = zug; zug = null;
        if (!z.bewegt) return;
        gezogen = true;
        setTimeout(() => { gezogen = false; }, 0);
        z.b.style.transform = ''; z.b.classList.remove('wp-zieht'); delete z.b.dataset.ziel;
        if (abbruch || !z.tage) return;
        const [l, sch] = teilen(z.a.id);
        if (sch) P.verschieben(ctx, l, sch, gantt.tagPlus(z.a.start, z.tage));
        else P.ankerVerschieben(ctx, l, gantt.tagPlus(z.a.ende, z.tage));
      };
      el.addEventListener('pointerup', loslassen(false));
      el.addEventListener('pointercancel', loslassen(true));
    },
  };
  let scrollLinks = null;

  /** Tagesbreite im Maßstab „Einpassen“: aus dem ersten Balken. */
  function tagesbreite(el, liste) {
    const b = el.querySelector('.wk-gantt-balken'), a = b && liste.find(x => x.id === b.dataset.id);
    return a ? b.offsetWidth / gantt.dauer(a.start, a.ende) : 12;
  }
})();
</script>
<script>
/* Wartungsplaner · Ansicht Kalender: Monat und Woche mit allen Schritten aller Läufe (Filter Kunde, Projekt).
   Hinterlegt sind Wochenenden, Feiertage und Freeze der Kunden sowie die eigenen Abwesenheiten. Ein Termin öffnet
   das Blatt des Schritts. Braucht WP.plan, WP.form und WP.kern. */
(function () {
  'use strict';
  const { ui } = WK, esc = ui.esc, F = WP.form, K = WP.kern, P = WP.plan;
  const TRENNER = '|';
  const zustand = { art: 'monat', tag: null };

  const montag = d => K.plus(d, 1 - K.wochentag(d));
  const kw = d => WK.gantt.kalenderwoche(d);

  /** Tage der Ansicht: Monat in ganzen Wochen (Mo–So), Woche Mo–So. */
  function tage(art, tag) {
    if (art === 'woche') { const m = montag(tag); return Array.from({ length: 7 }, (_, i) => K.plus(m, i)); }
    const erster = tag.slice(0, 8) + '01', letzter = tag.slice(0, 8) + String(K.tageImMonat(+tag.slice(0, 4), +tag.slice(5, 7))).padStart(2, '0');
    const liste = [];
    for (let d = montag(erster); d <= K.plus(montag(letzter), 6); d = K.plus(d, 1)) liste.push(d);
    return liste;
  }

  function titel(art, tag) {
    if (art === 'woche') { const t = tage('woche', tag); return `KW ${kw(t[0])} · ${P.kurz(t[0])} – ${F.tag(t[6]).slice(3)}`; }
    return `${F.MONATE[+tag.slice(5, 7) - 1]} ${tag.slice(0, 4)}`;
  }

  /** Sperren je Tag: [{ art: 'feiertag'|'freeze'|'abwesend', text }] für die gezeigten Kunden. */
  function sperren(d, kunden, tag) {
    const aus = [], gesehen = new Set(), mehrere = kunden.length > 1;
    const neu = (art, text) => { if (!gesehen.has(text)) { gesehen.add(text); aus.push({ art, text }); } };
    kunden.forEach(k => {
      const kal = K.kalender(k, d.verfuegbarkeit), f = kal.feiertag(tag), fr = kal.freeze(tag);
      if (f) neu('feiertag', f);
      if (fr) neu('freeze', `Freeze ${fr.name || ''}${mehrere ? ` (${k.name})` : ''}`.replace('  ', ' '));
    });
    d.verfuegbarkeit.abwesenheiten.filter(a => a.von && a.bis && tag >= a.von && tag <= a.bis).forEach(a => neu('abwesend', `Abwesend: ${a.grund || 'ohne Grund'}`));
    return aus;
  }

  function inhaltTermin(d, lauf, t, woche) {
    const status = t.erledigt ? '<span class="wp-kal-status erfolg">✓ Erledigt</span>'
      : t.konflikte.length ? '<span class="wp-kal-status fehler">⚠ Konflikt</span>' : '';
    const zeit = woche && t.uhrzeit ? `<small>${esc(t.uhrzeit.von)}–${esc(t.uhrzeit.bis)}</small>` : '';
    const lauftext = woche ? `<small>${esc(P.laufName(d, lauf))}</small>` : '';
    return `${status}<span class="wp-mit-zeichen">${P.kundeZeichen(d, lauf, 'mini')}<span>${esc(t.titel)}</span></span>${zeit}${lauftext}`;
  }
  const terminKlassen = t => `wp-kal-termin${t.erledigt ? ' erledigt' : ''}${t.konflikte.length && !t.erledigt ? ' konflikt' : ''}`;
  const terminDaten = (d, lauf, t) => `data-aktion="termin-oeffnen" data-wert="${esc(lauf.id + TRENNER + t.schritt)}" `
    + `title="${esc(`${t.titel} · ${P.laufName(d, lauf)} · ${P.kurz(t.start)}${t.ende !== t.start ? ` – ${P.kurz(t.ende)}` : ''}`)}"`;

  /** Releases an einem Tag, die zum Filter passen (ohne Filter alle). */
  const releases = (d, x) => (d.releases || []).filter(r => r.datum === x && (!P.filter.kunde || K.releaseGilt(r, P.filter.kunde, P.filter.projekt || '')
    || (!P.filter.projekt && (r.projekte || []).some(z => z.startsWith(P.filter.kunde + '/')))));

  /** Gemeinsame Angaben je Tag: Sperren, Anker, Releases, Klassen, Datumszeile. */
  function tagInfo(d, kunden, anker, x, art, monat, heute, hatTermin) {
    const woche = art === 'woche', sp = sperren(d, kunden, x), we = K.wochentag(x) > 5;
    const klassen = [we && 'we', sp.some(s => s.art !== 'abwesend') && 'gesperrt', sp.some(s => s.art === 'abwesend') && 'abwesend',
      !woche && x.slice(0, 7) !== monat && 'fremd', x === heute && 'heute', !hatTermin && !sp.length && !anker.has(x) && !releases(d, x).length && 'leer'].filter(Boolean);
    const datum = `${F.WOCHENTAGE_LANG[K.wochentag(x)].slice(0, 2)} ${+x.slice(8, 10)}.${woche || x.slice(0, 7) !== monat ? `${+x.slice(5, 7)}.` : ''}`;
    const kopf = `<div class="wp-kal-datum">${esc(datum)}${x === heute ? ' <b>Heute</b>' : ''}</div>`
      + sp.map(s => `<div class="wp-kal-sperre ${s.art}">${esc(s.text)}</div>`).join('')
      + ((anker.get(x) || []).map(l => `<div class="wp-kal-anker">◆ Anker ${esc(l.vorlage.name)}</div>`).join(''))
      + releases(d, x).map(r => `<div class="wp-kal-release"><svg class="wp-sym" aria-hidden="true"><use href="#i-termin"/></svg><span>Release ${esc(r.name)}</span></div>`).join('');
    return { klassen, kopf };
  }

  /* Raster: je Woche ein Gitter mit 7 Spalten. Die Tage liegen als Hintergrund über alle Zeilen (Sperren, Anker in der
     ersten Zeile), die Termine als Balken darüber: von Start bis Ende, je Woche geteilt, in Bahnen übereinander.
     Am Telefon zeigt eine Liste je Tag dieselben Termine (Balken über 7 Spalten wären dort nicht lesbar). */
  function raster(d, art, tag) {
    const liste = tage(art, tag), heute = F.heute(), monat = tag.slice(0, 7), woche = art === 'woche';
    const laeufe = P.laeufe(d, false);
    const kunden = d.kunden.filter(k => !P.filter.kunde || k.id === P.filter.kunde);
    const von = liste[0], bis = liste[liste.length - 1];
    const termine = [];
    laeufe.forEach(l => l.termine.forEach(t => { if (!(t.ende < von || t.start > bis)) termine.push({ l, t }); }));
    termine.sort((a, b) => (a.t.start < b.t.start ? -1 : a.t.start > b.t.start ? 1 : b.t.ende.localeCompare(a.t.ende)));
    const anker = new Map();
    laeufe.forEach(l => { if (l.anker >= von && l.anker <= bis) (anker.get(l.anker) || anker.set(l.anker, []).get(l.anker)).push(l); });
    // Liste je Tag (Telefon): Tage, an denen der Termin arbeitet (Raster des Schritts)
    const jeTag = new Map(liste.map(x => [x, []]));
    termine.forEach(({ l, t }) => K.termintage(d, l, t).forEach(x => { if (jeTag.has(x)) jeTag.get(x).push({ l, t }); }));

    const kopf = woche ? '' : `<div class="wp-kal-kopfzeile" aria-hidden="true">${F.WOCHENTAGE_LANG.slice(1).map(w => `<div class="wp-kal-kopf">${w.slice(0, 2)}</div>`).join('')}</div>`;
    const wochen = [];
    for (let i = 0; i < liste.length; i += 7) {
      const tageW = liste.slice(i, i + 7), w0 = tageW[0], w6 = tageW[6];
      // Balken dieser Woche in Bahnen: belegt[bahn] = letzte belegte Spalte
      const belegt = [], balken = [];
      termine.forEach(({ l, t }) => {
        if (t.ende < w0 || t.start > w6) return;
        const a = t.start < w0 ? 0 : tageW.indexOf(t.start), e = t.ende > w6 ? 6 : tageW.indexOf(t.ende);
        let bahn = belegt.findIndex(letzte => letzte < a);
        if (bahn < 0) { bahn = belegt.length; belegt.push(-1); }
        belegt[bahn] = e;
        const rand = `${t.start < w0 ? ' vorher' : ''}${t.ende > w6 ? ' nachher' : ''}`;
        balken.push(`<button type="button" class="${terminKlassen(t)} wp-kal-balken${rand}" ${terminDaten(d, l, t)} `
          + `style="grid-column:${a + 1} / ${e + 2};grid-row:${bahn + 2}">${inhaltTermin(d, l, t, woche)}</button>`);
      });
      const zellen = tageW.map((x, j) => {
        const { klassen, kopf: k } = tagInfo(d, kunden, anker, x, art, monat, heute, termine.some(({ t }) => t.start <= x && t.ende >= x));
        return `<div class="wp-kal-tag ${klassen.join(' ')}"${x === heute ? ' aria-current="date"' : ''} style="grid-column:${j + 1};grid-row:1 / -1"></div>`
          + `<div class="wp-kal-tagkopf" style="grid-column:${j + 1};grid-row:1">${k}</div>`;
      }).join('');
      wochen.push(`<div class="wp-kal-woche" style="grid-template-rows:auto repeat(${Math.max(belegt.length, 1)}, auto) 1fr">${zellen}${balken.join('')}</div>`);
    }
    const tagesliste = liste.map(x => {
      const e = jeTag.get(x), { klassen, kopf: k } = tagInfo(d, kunden, anker, x, art, monat, heute, e.length);
      return `<li class="wp-kal-ltag ${klassen.join(' ')}">${k}`
        + (e.length ? `<ul class="wp-kal-termine">${e.map(({ l, t }) => `<li><button type="button" class="${terminKlassen(t)}" ${terminDaten(d, l, t)}>${inhaltTermin(d, l, t, true)}</button></li>`).join('')}</ul>` : '')
        + '</li>';
    }).join('');
    return `<div class="wp-kal ${woche ? 'woche' : 'monat'}">${kopf}${wochen.join('')}</div>`
      + `<ul class="wp-kal-liste" aria-label="Termine je Tag">${tagesliste}</ul>`;
  }

  /* Blättern als Pfeil ohne Wort: links und rechts sind eindeutige Symbole (Glas B3), Name und Kurzhilfe sagen „Monat zurück“ usw. */
  const pfeil = (name, wert, symbol) => `<button type="button" class="wk-btn klein wp-pfeil" data-aktion="kal-blaettern" data-wert="${wert}" `
    + `aria-label="${esc(name)}" title="${esc(name)}" data-tip="${esc(name)}"><svg class="wp-sym" aria-hidden="true"><use href="#i-${symbol}"/></svg></button>`;

  WP.ansichten.kalender = {
    inhalt(s, ctx) {
      const d = ctx.daten();
      if (!zustand.tag) zustand.tag = F.heute();
      const { art, tag } = zustand;
      return `<section class="wp-abschnitt">${P.filterLeiste(d, false)}`
        + `<div class="wp-abschnitt-kopf"><h2 class="wk-h2" id="wp-kal-titel">${esc(titel(art, tag))}</h2>`
        + `<div class="wp-knoepfe"><div class="wk-seg" role="group" aria-label="Ansicht">`
        + [['monat', 'Monat'], ['woche', 'Woche']].map(([w, t]) => `<button type="button" data-aktion="kal-art" data-wert="${w}" aria-pressed="${w === art}">${t}</button>`).join('')
        + '</div>'
        + pfeil(art === 'woche' ? 'Woche zurück' : 'Monat zurück', '-1', 'links')
        + F.knopf('Heute', 'kal-blaettern', '0', '', 'sonne')
        + pfeil(art === 'woche' ? 'Woche vor' : 'Monat vor', '1', 'rechts') + '</div></div>'
        + '<p class="wk-klein wp-leise">Grau hinterlegt: Wochenende, Feiertag und Freeze. Gestreift: eigene Abwesenheit. ◆ Anker eines Laufs. Mit Kalenderblatt: Release.</p>'
        + raster(d, art, tag) + '</section>';
    },
    aktion: () => 'Wartung planen',
    haupt: (s, ctx) => P.planen(ctx),
    lokal: (el, ctx) => P.lokal(el, ctx),
    klick: {
      'kal-art'(el, ctx) { zustand.art = el.dataset.wert; ctx.neu(); },
      'kal-blaettern'(el, ctx) {
        const r = Number(el.dataset.wert), t = zustand.tag || F.heute();
        if (!r) zustand.tag = F.heute();
        else if (zustand.art === 'woche') zustand.tag = K.plus(t, 7 * r);
        else {
          const j = +t.slice(0, 4), m = +t.slice(5, 7) - 1 + r;
          zustand.tag = `${j + Math.floor(m / 12)}-${String(((m % 12) + 12) % 12 + 1).padStart(2, '0')}-01`;
        }
        ctx.neu();
      },
      'termin-oeffnen'(el, ctx) { const w = el.dataset.wert, i = w.indexOf(TRENNER); P.schrittBlatt(ctx, w.slice(0, i), w.slice(i + 1)); },
    },
  };
})();
</script>
<script>
/* Wartungsplaner · Ansicht Übersicht: oben „Als Nächstes“ (die nächsten offenen Termine als Karten), darunter die
   nächsten 4 Wochen, Konflikte zuerst, dazu überfällige Schritte. „Erledigt“ setzt einen Schritt erledigt (noch einmal:
   wieder offen). naechste(d, n) liefert dieselben Termine als Liste für den Bereich „Details“, solange dort nichts offen
   ist. Braucht WP.plan, WP.form und WP.kern. */
(function () {
  'use strict';
  const { ui } = WK, esc = ui.esc, F = WP.form, K = WP.kern, P = WP.plan;
  const TRENNER = '|';
  const TAGE = 28;

  function status(t, heute) {
    if (t.erledigt) return ui.pill('erfolg', 'Erledigt');
    if ((t.konflikte || []).length) return ui.pill('fehler', 'Konflikt');
    if (t.ende < heute) return ui.pill('fehler', 'Überfällig');
    if (t.start <= heute) return ui.pill('offen', 'Läuft');
    return ui.pill('entschieden', 'Geplant');
  }

  function zeilen(d, liste, heute) {
    return liste.map(({ lauf, t }) => {
      const wert = esc(lauf.id + TRENNER + t.schritt);
      return `<tr><td>${status(t, heute)}</td><td>${esc(F.tag(t.start))}${t.ende !== t.start ? ` – ${esc(F.tag(t.ende))}` : ''}</td>`
        + `<td><button type="button" class="wp-verweis" data-aktion="termin-oeffnen" data-wert="${wert}">${esc(t.titel)}</button></td>`
        + `<td>${P.laufZelle(d, lauf)}<br><small class="wp-leise">${esc(P.kundeText(d, lauf))}</small></td>`
        + `<td><button type="button" class="wk-btn klein" data-aktion="termin-erledigt" data-wert="${wert}" aria-pressed="${!!t.erledigt}">${t.erledigt ? 'Wieder offen' : 'Erledigt'}</button></td>`
        + `<td class="wp-umbruch">${esc(t.konflikte.join('; ') || (t.verschoben ? `verschoben von ${F.tag(t.verschoben.von)}` : ''))}</td></tr>`;
    }).join('');
  }

  const SPALTEN = ['Status', 'Termin', 'Schritt', 'Lauf', 'Aktion', 'Hinweis'];
  const sym = n => `<svg class="wp-sym" aria-hidden="true"><use href="#i-${n}"/></svg>`;

  /** Offene Termine, die heute laufen oder noch kommen, nach Beginn (laufende zuerst). */
  function kommende(d, n) {
    const heute = F.heute();
    return P.alleTermine(d.laeufe).filter(({ t }) => !t.erledigt && t.ende >= heute)
      .sort((a, b) => (a.t.start < b.t.start ? -1 : a.t.start > b.t.start ? 1 : 0)).slice(0, n);
  }

  /** Ein Termin als Karte: Datum als Kachel, Schritt, Lauf und Kunde, Status mit Symbol und Wort. */
  function karte(d, { lauf, t }, heute) {
    const tag = t.start < heute ? heute : t.start, wt = F.WOCHENTAGE_LANG[K.wochentag(tag)].slice(0, 2);
    const bis = t.ende !== t.start ? ` – ${P.kurz(t.ende)}` : '';
    return `<li><button type="button" class="wp-termin-karte${(t.konflikte || []).length ? ' konflikt' : ''}" data-aktion="termin-oeffnen" data-wert="${esc(lauf.id + TRENNER + t.schritt)}">`
      + `<span class="wp-datum-kachel" aria-hidden="true"><small>${esc(wt)}</small><b>${+tag.slice(8, 10)}</b><small>${esc(F.MONATE[+tag.slice(5, 7) - 1].slice(0, 3))}</small></span>`
      + `<span class="wp-termin-text"><span class="wp-termin-titel">${esc(t.titel)}</span>`
      + `<span class="wk-klein wp-leise">${esc(P.kurz(t.start))}${esc(bis)} · ${esc(P.laufName(d, lauf))}</span>`
      + `<span class="wk-klein wp-leise wp-mit-zeichen">${P.kundeZeichen(d, lauf, 'klein')}<span>${esc(P.kundeText(d, lauf))}</span></span>${status(t, heute)}</span></button></li>`;
  }

  /** Liste für den Bereich „Details“ (und die Karten der Übersicht). */
  function naechste(d, n = 5) {
    const liste = kommende(d, n), heute = F.heute();
    return `<section class="wp-naechste" aria-labelledby="wp-naechste-titel"><h3 class="wk-h3" id="wp-naechste-titel">${sym('termin')}<span>Als Nächstes</span></h3>`
      + (liste.length ? `<ul class="wp-termin-karten">${liste.map(x => karte(d, x, heute)).join('')}</ul>`
        : `<p class="wk-klein wp-leise">${d.laeufe.length ? 'Keine offenen Termine.' : 'Noch keine Wartungen geplant.'}</p>`)
      + `<p class="wk-klein wp-leise">Einen Termin, Anker oder „Wartung planen“ wählen. Die Details erscheinen hier.</p></section>`;
  }

  WP.ansichten.uebersicht = {
    naechste,
    inhalt(s, ctx) {
      const d = ctx.daten(), heute = F.heute(), bis = K.plus(heute, TAGE - 1);
      const alle = P.alleTermine(d.laeufe);
      const ordnung = (a, b) => (a.t.erledigt - b.t.erledigt) || (!!b.t.konflikte.length - !!a.t.konflikte.length)
        || (a.t.start < b.t.start ? -1 : a.t.start > b.t.start ? 1 : 0);
      const naechste = alle.filter(({ t }) => t.ende >= heute && t.start <= bis).sort(ordnung);
      const ueberfaellig = alle.filter(({ t }) => t.ende < heute && !t.erledigt).sort(ordnung);
      const konflikte = naechste.filter(({ t }) => t.konflikte.length && !t.erledigt).length + ueberfaellig.filter(({ t }) => t.konflikte.length).length;
      const offen = naechste.filter(({ t }) => !t.erledigt).length;
      const zahlen = `<p class="wp-zahlen">${konflikte ? ui.pill('fehler', F.mehrzahl(konflikte, 'Konflikt', 'Konflikte')) : ui.pill('erfolg', 'Ohne Konflikt')}`
        + `${ueberfaellig.length ? ui.pill('fehler', `${ueberfaellig.length} überfällig`) : ''}${ui.pill('offen', `${offen} offen`)}</p>`;
      const leer = d.laeufe.length ? 'In den nächsten 4 Wochen steht nichts an.' : 'Noch keine Wartungen geplant. Mit „Wartung planen“ legst Du den ersten Lauf an.';
      const karten = kommende(d, 4);
      const vorne = karten.length ? `<section class="wp-abschnitt" aria-labelledby="wp-als-naechstes"><h2 class="wk-h2 wp-mit-symbol" id="wp-als-naechstes">${sym('termin')}<span>Als Nächstes</span></h2>`
        + `<ul class="wp-termin-karten breit">${karten.map(x => karte(d, x, heute)).join('')}</ul></section>` : '';
      return `<section class="wp-abschnitt">${zahlen}</section>${vorne}`
        + F.tabelle(`Nächste 4 Wochen (bis ${F.tag(bis)})`, SPALTEN, zeilen(d, naechste, heute), leer)
        + (ueberfaellig.length ? F.tabelle('Überfällig', SPALTEN, zeilen(d, ueberfaellig, heute), '') : '');
    },
    aktion: () => 'Wartung planen',
    haupt: (s, ctx) => { ctx.gehe('/planung'); P.planen(ctx); },
    klick: {
      'termin-oeffnen'(el, ctx) { const w = el.dataset.wert, i = w.indexOf(TRENNER); P.schrittBlatt(ctx, w.slice(0, i), w.slice(i + 1)); },
      'termin-erledigt'(el, ctx) { const w = el.dataset.wert, i = w.indexOf(TRENNER); P.erledigt(ctx, w.slice(0, i), w.slice(i + 1)); },
    },
  };
})();
</script>
<script>
/* Wartungsplaner · Einführung: führt Schritt für Schritt durch die App, mit erfundenen Beispieldaten.
   Braucht ui-bausteine (WK.ui), sitzung (WK.sitzung), WP.beispiel, WP.form, WP.kern. Stellt WP.fuehrung bereit:
     einrichten({ z, gehe })   z = Zustand der Schale (WK.zustand), gehe(pfad) = Router
     angebot(s)                HTML für die Übersicht: Angebot beim ersten Öffnen bzw. „fortsetzen“ nach dem Neuladen
     klick(aktion, el)         Knöpfe mit data-aktion="einfuehrung-…" (true, wenn behandelt)

   Getrennte Daten: Solange die Einführung läuft, setzt sie Übungsdaten in die Sitzung (WK.sitzung.uebung). Alle
   Ansichten lesen und ändern dann nur diese, nichts davon landet in der Datei. Beenden oder Abbrechen löscht sie.
   Jeder Schritt wartet auf die echte Aktion (erfuellt); „Überspringen“ holt sie nach (nachholen) und geht weiter.
   Im localStorage steht nur der Fortschritt { stand, schritt }, keine Daten. Nach dem Neuladen baut die Einführung
   die Übungsdaten aus dem Beispiel und den nachgeholten Schritten neu auf. */
(function () {
  'use strict';
  const { ui, sitzung } = WK, esc = ui.esc, F = WP.form, K = WP.kern;
  const FORTSCHRITT_SCHLUESSEL = 'wartungsplaner.einfuehrung';
  const BASIS = (() => { const b = WP.beispiel(); return { kunden: b.kunden.map(k => k.id), vorlage: b.vorlagen[0] }; })();
  const VORLAGE = BASIS.vorlage.id;

  const neuerKunde = d => d.kunden.find(k => !BASIS.kunden.includes(k.id)) || null;
  const vorlage = d => d.vorlagen.find(v => v.id === VORLAGE) || null;
  const neuerSchritt = d => { const v = vorlage(d); return v ? (v.schritte || []).slice(BASIS.vorlage.schritte.length) : []; };
  // Ziel in der Navigation: oben im Ablauf, sonst (Übersicht, Einstellungen) links in der Leiste
  const nav = n => `.wp-ablauf-schritt[data-ansicht="${n}"] || .wp-nav-liste a[data-ansicht="${n}"]`;
  const HAUPT = '#inhalt .wk-kopf [data-aktion="haupt"]';

  /* Je Schritt: kurz (Schrittleiste), titel, text, ansicht (auch: weitere Ansichten mit derselben Hauptaktion),
     erfuellt(d, s), ziel(d, s) → Selektor des Bedienelements (ohne: die Hauptaktion),
     nachholen(d) für „Überspringen“ (ohne: nur in die Ansicht gehen), pfad(d) Ansicht danach. Ohne erfuellt: Knopf „Weiter“. */
  const SCHRITTE = [
    { id: 'start', kurz: 'Start', titel: 'Willkommen im Wartungsplaner',
      text: () => 'Du übst mit erfundenen Beispieldaten: ein Kunde, eine Vorlage, eine Serie. Deine eigenen Daten bleiben unverändert, '
        + 'nichts davon wird gespeichert. Jeder Schritt wartet, bis Du ihn selbst gemacht hast.' },
    { id: 'kunden', kurz: 'Kunden', titel: 'Kunden öffnen', ansicht: 'kunden',
      text: () => 'Alles beginnt beim Kunden. Öffne oben im Ablauf „Kunden/Projekte“.',
      erfuellt: (d, s) => s.route === 'kunden' },
    { id: 'kunde', kurz: 'Kunde', titel: 'Kunde anlegen', ansicht: 'kunden',
      text: () => 'Wähle „Kunde anlegen“ und gib einen erfundenen Namen ein, etwa „Muster Haustechnik“.',
      erfuellt: d => !!neuerKunde(d),
      nachholen: d => { if (!neuerKunde(d)) d.kunden.push({ id: 'muster', name: 'Muster Haustechnik', projekte: [], kalender: { freeze: [], wartungsfenster: [] } }); },
      pfad: d => '/kunden/' + encodeURIComponent(neuerKunde(d).id) },
    { id: 'projekt', kurz: 'Projekt', titel: 'Projekt anlegen', ansicht: 'kunden',
      text: d => `Gib „${(neuerKunde(d) || {}).name || 'Deinem Kunden'}“ ein Projekt: „Projekt hinzufügen“ wählen und einen Namen eintragen, etwa „Heizungssteuerung“.`,
      erfuellt: d => { const k = neuerKunde(d); return !!k && (k.projekte || []).some(p => p.name); },
      ziel: (d, s) => {
        const k = neuerKunde(d);
        if (!k || s.teil !== k.id) return `#inhalt a[href="#/kunden/${CSS.escape(encodeURIComponent(k ? k.id : ''))}"]`;
        const i = (k.projekte || []).findIndex(p => !p.name);
        return i >= 0 ? `#inhalt [data-pfad="projekte.${i}.name"]` : '#inhalt [data-aktion="reihe-hinzu"][data-wert="projekte"]';
      },
      nachholen: d => {
        const k = neuerKunde(d);
        k.projekte = (k.projekte || []).filter(p => p.name);
        if (!k.projekte.length) k.projekte.push({ id: 'heizung', name: 'Heizungssteuerung' });
      },
      pfad: d => '/kunden/' + encodeURIComponent(neuerKunde(d).id) },
    { id: 'vorlagen', kurz: 'Vorlage', titel: 'Vorlagen öffnen', ansicht: 'vorlagen',
      text: () => 'Eine Vorlage beschreibt die Aufgaben einer Wartung. Öffne „Vorlagen“.',
      erfuellt: (d, s) => s.route === 'vorlagen' },
    { id: 'aufgabe', kurz: 'Aufgabe', titel: 'Aufgabe hinzufügen', ansicht: 'vorlagen',
      text: () => `Öffne die Vorlage „${BASIS.vorlage.name}“, wähle „Schritt hinzufügen“ und gib dem neuen Schritt einen Titel, etwa „Datensicherung prüfen“.`,
      erfuellt: d => neuerSchritt(d).some(x => x.titel && x.titel !== 'Neuer Schritt'),
      ziel: (d, s) => {
        if (s.teil !== VORLAGE) return `#inhalt a[href="#/vorlagen/${VORLAGE}"]`;
        const i = (vorlage(d).schritte || []).findIndex((x, j) => j >= BASIS.vorlage.schritte.length);
        return i >= 0 ? `#inhalt [data-pfad="schritte.${i}.titel"]` : '#inhalt [data-aktion="schritt-hinzufuegen"]';
      },
      nachholen: d => {
        const v = vorlage(d), neu = neuerSchritt(d)[0];
        if (neu) neu.titel = 'Datensicherung prüfen';
        else v.schritte.push({ id: F.neueId('datensicherung', v.schritte.map(x => x.id)), titel: 'Datensicherung prüfen', dauer: 1 });
      },
      pfad: () => '/vorlagen/' + VORLAGE },
    { id: 'planen', kurz: 'Planen', titel: 'Wartung planen', ansicht: 'planung',
