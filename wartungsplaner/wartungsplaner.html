      text: d => `Öffne „Planung“ und wähle „Wartung planen“. Nimm „${(neuerKunde(d) || {}).name || 'Deinen Kunden'}“ und die Vorlage „${BASIS.vorlage.name}“.`,
      erfuellt: d => d.laeufe.length > 0, auch: ['kalender', 'uebersicht'],
      nachholen: d => {
        if (d.laeufe.length) return;
        const k = neuerKunde(d), p = k && (k.projekte || [])[0], anker = K.plus(F.heute(), 28);
        d.laeufe.push(K.laufErzeugen(d, { vorlage: VORLAGE, anker, kunde: k ? k.id : null, projekt: p ? p.id : null,
          id: F.neueId(`${BASIS.vorlage.name} ${anker}`, []) }));
      },
      pfad: () => '/planung' },
    { id: 'zeitplan', kurz: 'Zeitplan', titel: 'Zeitplan ansehen', ansicht: 'kalender',
      text: () => 'Der Lauf steht mit allen Schritten auf der Zeitleiste. Sieh Dir die Termine im „Kalender“ an.',
      erfuellt: (d, s) => s.route === 'kalender' },
    { id: 'ende', kurz: 'Fertig', titel: 'Geschafft',
      text: () => 'Kunde, Projekt, Vorlage, Wartung, Kalender: So entsteht ein Zeitplan. Deine eigenen Daten waren die ganze Zeit '
        + 'unverändert. „Beispieldaten löschen“ beendet die Einführung.' },
  ];

  /* ------------------------------------------------------------ Fortschritt (nur Stand und Schritt) */

  function gemerkt() {
    let g = null;
    try { g = JSON.parse(localStorage.getItem(FORTSCHRITT_SCHLUESSEL) || 'null'); } catch (e) { /* gesperrt oder kaputt */ }
    if (!g || !['angeboten', 'laeuft', 'abgebrochen', 'fertig'].includes(g.stand)) return null;
    return { stand: g.stand, schritt: Math.min(SCHRITTE.length - 1, Math.max(0, Number(g.schritt) || 0)) };
  }
  function merken(stand, schritt) {
    try { localStorage.setItem(FORTSCHRITT_SCHLUESSEL, JSON.stringify({ stand, schritt })); } catch (e) { /* gilt bis zum Schließen nicht */ }
  }

  /* ------------------------------------------------------------ Ablauf */

  let z = null, gehe = () => {};
  let aktiv = false, schritt = 0, pausiert = false, karte = null, gezeigt = null;

  /** Übungsdaten bis vor Schritt bis: das Beispiel plus alles, was die Schritte davor ergeben. */
  function aufbauen(bis) {
    const d = F.vollstaendig(WP.beispiel());
    SCHRITTE.slice(0, bis).forEach(x => { if (x.nachholen) x.nachholen(d); });
    return d;
  }

  function starten(ab = 0) {
    if (!sitzung.info().offen) return;
    schritt = ab; aktiv = true; pausiert = false; gezeigt = null;
    merken('laeuft', schritt);
    sitzung.uebung(aufbauen(schritt));
    document.body.setAttribute('data-fuehrung', '');
    gehe(ab ? '/' + (SCHRITTE[ab - 1].ansicht || 'uebersicht') : '/uebersicht');
    pruefen();
    karte.querySelector('h2').focus();
  }

  function beenden(stand) {
    aktiv = false; pausiert = false;
    merken(stand, schritt);
    zielMarkieren(null);
    karte.hidden = true;
    document.body.removeAttribute('data-fuehrung');
    sitzung.uebung(null);
    gehe('/uebersicht');
    if (stand === 'fertig') ui.toast('Beispieldaten gelöscht', { art: 'erfolg' });
    else ui.toast('Einführung abgebrochen. Über „Hilfe“ geht es später weiter.', { dauer: 5000 });
  }

  async function abbrechen() {
    const ok = await ui.frage({ titel: 'Einführung abbrechen?', ja: 'Einführung abbrechen', nein: 'Weiter üben',
      text: 'Die Beispieldaten werden gelöscht. Deine eigenen Daten bleiben unverändert. Über „Hilfe“ geht es später an dieser Stelle weiter.' });
    if (ok && aktiv) beenden('abgebrochen');
  }

  function weiter() {
    if (schritt < SCHRITTE.length - 1) schritt++;
    merken('laeuft', schritt);
  }

  function ueberspringen() {
    const x = SCHRITTE[schritt], vorher = schritt;
    if (x.nachholen) sitzung.aendern(d => { x.nachholen(F.vollstaendig(d)); });
    const pfad = x.pfad ? x.pfad(F.vollstaendig(sitzung.daten())) : x.ansicht && '/' + x.ansicht;
    if (pfad) gehe(pfad);
    if (schritt === vorher) { weiter(); pruefen(); }
  }

  /** Nach jeder Änderung von Zustand oder Daten: erledigte Schritte abhaken, Karte und Hervorhebung nachziehen. */
  function pruefen() {
    if (!aktiv) return;
    const offen = sitzung.info().offen;
    if (!offen) {            // Sperren verwirft die Übungsdaten; nach dem Entsperren geht es an derselben Stelle weiter
      pausiert = true; karte.hidden = true; zielMarkieren(null); return;
    }
    if (pausiert || !sitzung.info().uebung) { pausiert = false; sitzung.uebung(aufbauen(schritt)); return; }
    const s = z.get(), d = F.vollstaendig(sitzung.daten());
    while (SCHRITTE[schritt].erfuellt && SCHRITTE[schritt].erfuellt(d, s)) weiter();
    zeigen(d, s);
  }

  /* ------------------------------------------------------------ Karte und Hervorhebung */

  function karteBauen() {
    karte = document.createElement('aside');
    karte.className = 'wk-karte wp-fuehrung';
    karte.hidden = true;
    karte.setAttribute('aria-labelledby', 'wp-fuehrung-titel');
    karte.innerHTML = '<div aria-live="polite" aria-atomic="true"><p class="wk-klein wp-fuehrung-stand"></p>'
      + '<h2 class="wk-h3" id="wp-fuehrung-titel" tabindex="-1"></h2><p class="wp-fuehrung-text"></p></div>'
      + '<div class="wp-fuehrung-schritte" inert></div><div class="wp-knoepfe wp-fuehrung-knoepfe"></div>';
    document.body.appendChild(karte);
    new ResizeObserver(() => { document.body.style.setProperty('--wp-fuehrung-hoehe', karte.offsetHeight + 'px'); }).observe(karte);
  }

  function zeigen(d, s) {
    const x = SCHRITTE[schritt], n = SCHRITTE.length;
    karte.hidden = false;
    const setzen = (sel, text) => { const el = karte.querySelector(sel); if (el.textContent !== text) el.textContent = text; };
    setzen('.wp-fuehrung-stand', `Einführung · Schritt ${schritt + 1} von ${n} · Beispieldaten`);
    setzen('h2', x.titel);
    setzen('.wp-fuehrung-text', x.text(d, s));
    const leiste = ui.schritte(SCHRITTE.map((y, i) => ({ text: y.kurz, erledigt: i < schritt, aktuell: i === schritt })), 'Schritte der Einführung');
    const knoepfe = x.id === 'ende'
      ? '<button type="button" class="wk-btn klein" data-aktion="einfuehrung-loeschen">Beispieldaten löschen</button>'
      : (x.erfuellt
        ? '<button type="button" class="wk-btn klein" data-aktion="einfuehrung-zeigen">Zeigen</button>'
          + '<button type="button" class="wk-btn klein" data-aktion="einfuehrung-ueberspringen">Überspringen</button>'
        : '<button type="button" class="wk-btn klein" data-aktion="einfuehrung-weiter">Weiter</button>')
        + '<button type="button" class="wk-btn klein" data-aktion="einfuehrung-abbrechen">Abbrechen</button>';
    const l = karte.querySelector('.wp-fuehrung-schritte'), k = karte.querySelector('.wp-fuehrung-knoepfe');
    if (l.innerHTML !== leiste) l.innerHTML = leiste;
    if (k.dataset.schritt !== x.id) { k.innerHTML = knoepfe; k.dataset.schritt = x.id; }
    zielMarkieren(x.erfuellt ? zielVon(x, d, s) : null);
  }

  /** Außerhalb der Ansicht des Schritts zeigt die Führung auf die Navigation, sonst auf das Bedienelement (sonst die Hauptaktion). */
  function zielVon(x, d, s) {
    if (s.route !== x.ansicht && !(x.auch || []).includes(s.route)) return nav(x.ansicht);
    return x.ziel ? x.ziel(d, s) : HAUPT;
  }

  /** Hebt das Bedienelement hervor. Beim Wechsel des Ziels rollt es ins Bild (nicht bei jedem Neuzeichnen).
      sel: Selektor oder Alternativen „a || b“, das erste sichtbare gilt. */
  function zielMarkieren(sel) {
    const el = sel && (sel.split(' || ').map(x => document.querySelector(x)).find(e => e && e.getClientRects().length)
      || document.querySelector(sel.split(' || ')[0]));
    document.querySelectorAll('.wp-fuehrung-ziel').forEach(e => { if (e !== el) e.classList.remove('wp-fuehrung-ziel'); });
    if (!el) { gezeigt = sel; return; }
    el.classList.add('wp-fuehrung-ziel');
    if (gezeigt !== sel) {
      gezeigt = sel;
      el.scrollIntoView({ block: el.closest('.wp-nav') ? 'nearest' : 'center', inline: 'center',
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
  }

  function zeigenKnopf() {
    const el = document.querySelector('.wp-fuehrung-ziel');
    if (!el) return;
    el.scrollIntoView({ block: 'center', inline: 'center' });
    el.focus();
  }

  /* ------------------------------------------------------------ Angebot und Hilfe-Menü */

  /** Auf der Übersicht: beim ersten Öffnen das Angebot, nach dem Neuladen mitten in der Einführung „fortsetzen“. */
  function angebot() {
    if (aktiv || sitzung.info().uebung) return '';
    const g = gemerkt();
    if (g && g.stand !== 'laeuft') return '';
    const fortsetzen = g && g.schritt > 0;
    return `<section class="wp-seitenblock wp-angebot" aria-labelledby="wp-angebot-titel">`
      + `<h2 class="wk-h3" id="wp-angebot-titel">${fortsetzen ? 'Einführung fortsetzen?' : 'Neu hier?'}</h2>`
      + `<p>${esc(fortsetzen
        ? `Die Einführung ist bei Schritt ${g.schritt + 1} von ${SCHRITTE.length} stehen geblieben. Die Beispieldaten baut sie neu auf.`
        : 'Die Einführung zeigt in wenigen Schritten, wie aus Kunde, Vorlage und Planung ein Zeitplan wird. Sie übt mit Beispieldaten, Deine Daten bleiben unverändert.')}</p>`
      + `<div class="wp-knoepfe"><button type="button" class="wk-btn" data-aktion="${fortsetzen ? 'einfuehrung-fortsetzen' : 'einfuehrung-starten'}">`
      + `${fortsetzen ? 'Einführung fortsetzen' : 'Einführung starten'}</button>`
      + `<button type="button" class="wk-btn" data-aktion="einfuehrung-spaeter">Später</button></div></section>`;
  }

  function menue() {
    const g = gemerkt();
    const fortsetzen = g && (g.stand === 'laeuft' || g.stand === 'abgebrochen') && g.schritt > 0;
    const k = (aktion, text) => `<li><button type="button" class="wk-btn klein" data-aktion="${aktion}">${text}</button></li>`;
    return (aktiv ? k('einfuehrung-abbrechen', 'Einführung abbrechen')
      : fortsetzen ? k('einfuehrung-fortsetzen', `Einführung fortsetzen (Schritt ${g.schritt + 1} von ${SCHRITTE.length})`) + k('einfuehrung-starten', 'Einführung von vorn')
        : k('einfuehrung-starten', 'Einführung starten')) + k('app-fenster', 'Als App-Fenster öffnen') + k('update-suchen', 'Nach Updates suchen');
  }

  function menueSchliessen() {
    const m = document.querySelector('.wp-hilfemenue');
    if (m && m.open) m.open = false;
  }

  function klick(aktion) {
    if (!aktion.startsWith('einfuehrung-')) return false;
    menueSchliessen();
    const was = aktion.slice(12);
    if (was === 'starten') starten(0);
    else if (was === 'fortsetzen') { const g = gemerkt(); starten(g ? g.schritt : 0); }
    else if (was === 'spaeter') {
      const g = gemerkt();
      if (g && g.stand === 'laeuft') merken('abgebrochen', g.schritt); else merken('angeboten', 0);
      z.set({}); ui.toast('Die Einführung findest Du unter „Hilfe“.', { dauer: 5000 });
    }
    else if (!aktiv) return true;
    else if (was === 'weiter') { weiter(); pruefen(); }
    else if (was === 'ueberspringen') ueberspringen();
    else if (was === 'zeigen') zeigenKnopf();
    else if (was === 'abbrechen') abbrechen();
    else if (was === 'loeschen') beenden('fertig');
    return true;
  }

  function einrichten(o) {
    z = o.z; gehe = o.gehe;
    karteBauen();
    z.abonnieren(pruefen);
    // Fenstergröße geändert: dasselbe Ziel neu wählen (am Telefon rollt der Ablauf, das Ziel liegt woanders)
    addEventListener('resize', () => { if (gezeigt) zielMarkieren(gezeigt); });
    const m = document.querySelector('.wp-hilfemenue');
    m.addEventListener('toggle', () => { if (m.open) m.querySelector('ul').innerHTML = menue(); });
    document.addEventListener('click', e => { if (m.open && !m.contains(e.target)) m.open = false; });
    m.addEventListener('keydown', e => { if (e.key === 'Escape' && m.open) { m.open = false; m.querySelector('summary').focus(); } });
  }

<script>
/* selbst-update · Eine lokale HTML-App (file://) holt ihre neue Fassung selbst, prüft sie und legt sie an ihren Ort.
   Im Browser: WK.selbstUpdate(konfig). In Node: require('./selbst-update.js') (für Tests und Werkzeuge).

   Ablauf, nur auf Knopfdruck (kein Netz im Hintergrund):
     1. pruefen(): manifest.json von der Ablage (z. B. GitHub Pages) lesen. Neuer als die eigene Version?
     2. laden(manifest): Datei laden, SHA-256 und Ed25519-Signatur des Manifests prüfen. Der öffentliche Schlüssel steht
        fest in der App; ohne passende Signatur, mit anderer App oder älterer Version wird nichts übernommen.
     3. schreiben(text): die neue Datei an den Ort der alten schreiben (File System Access, Griff gemerkt in IndexedDB).
        Ohne diese Schnittstelle: Download, die alte Datei ersetzt man dann von Hand.
   Danach lädt die App sich neu (location.reload()) und läuft in der neuen Fassung.

   Manifest: { format: 1, app, version, datei, sha256 (hex), groesse, notiz, signatur (base64) }.
   Signiert ist der Text NACHRICHT(manifest) = "selbst-update/1\n<app>\n<version>\n<datei>\n<sha256>" (UTF-8).
   CSP der App: connect-src nur die Adresse der Ablage, sonst nichts.

   konfig: { app: 'name', version: '1.2.0', quelle: 'https://…/name/' (endet auf /), schluessel: base64 (32 Byte Ed25519),
             dateiname: 'name.html' (Vorschlag beim ersten Speichern), fetch?: Ersatz für Tests }
   Fehler tragen e.art: 'netz' | 'format' | 'fremd' | 'alt' | 'pruefsumme' | 'signatur' | 'abbruch'. */
(function (wurzel, fabrik) {
  const api = fabrik();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (wurzel.WK = wurzel.WK || {}).selbstUpdate = api.erstellen;
})(typeof window !== 'undefined' ? window : globalThis, function () {
  'use strict';
  const FORMAT = 1;
  const fehler = (art, text) => Object.assign(new Error(text), { art });
  const kryptos = () => globalThis.crypto && globalThis.crypto.subtle;

  /** Versionen vergleichen (1.10.0 > 1.9.2). Ergebnis < 0, 0, > 0. Vorabkennungen (-beta) zählen als älter. */
  function vergleichen(a, b) {
    const teile = v => String(v || '0').split('-')[0].split('.').map(n => parseInt(n, 10) || 0);
    const x = teile(a), y = teile(b);
    for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0);
    return (String(a).includes('-') ? -1 : 0) - (String(b).includes('-') ? -1 : 0);
  }

  const NACHRICHT = m => `selbst-update/${FORMAT}\n${m.app}\n${m.version}\n${m.datei}\n${m.sha256}`;
  const base64zuBytes = s => Uint8Array.from(atob(String(s).trim()), c => c.charCodeAt(0));
  const hex = puffer => [...new Uint8Array(puffer)].map(b => b.toString(16).padStart(2, '0')).join('');

  async function sha256(text) { return hex(await kryptos().digest('SHA-256', new TextEncoder().encode(text))); }

  async function signaturGilt(manifest, schluessel) {
    let k;
    try { k = await kryptos().importKey('raw', base64zuBytes(schluessel), { name: 'Ed25519' }, false, ['verify']); }
    catch (e) { throw fehler('signatur', 'Der Prüfschlüssel der App ist ungültig oder dieser Browser kennt Ed25519 nicht.'); }
    try { return await kryptos().verify({ name: 'Ed25519' }, k, base64zuBytes(manifest.signatur), new TextEncoder().encode(NACHRICHT(manifest))); }
    catch (e) { return false; }
  }

  /** Manifest auf Form prüfen (vor jeder weiteren Verwendung). */
  function formPruefen(m, app) {
    const ok = m && m.format === FORMAT && typeof m.app === 'string' && /^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/.test(m.version || '')
      && /^[A-Za-z0-9._-]+\.html$/.test(m.datei || '') && /^[0-9a-f]{64}$/.test(m.sha256 || '') && typeof m.signatur === 'string';
    if (!ok) throw fehler('format', 'Die Ablage liefert kein gültiges Manifest.');
    if (m.app !== app) throw fehler('fremd', `Das Manifest gehört zu „${m.app}“, nicht zu dieser App.`);
    return m;
  }

  /* ------------------------------------------------------------ Griff auf die eigene Datei (IndexedDB) */
  const DB = 'selbst-update', ABLAGE = 'griffe';
  function db() {
    return new Promise((ja, nein) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(ABLAGE);
      r.onsuccess = () => ja(r.result); r.onerror = () => nein(r.error);
    });
  }
  async function griff(app, neu) {
    const d = await db();
    return new Promise((ja, nein) => {
      const t = d.transaction(ABLAGE, neu === undefined ? 'readonly' : 'readwrite'), s = t.objectStore(ABLAGE);
      const r = neu === undefined ? s.get(app) : s.put(neu, app);
      r.onsuccess = () => ja(neu === undefined ? r.result || null : neu); r.onerror = () => nein(r.error);
    });
  }

  function erstellen(konfig) {
    const { app, version, quelle, schluessel } = konfig;
    const holen = konfig.fetch || ((...a) => globalThis.fetch(...a));
    const adresse = name => new URL(name, quelle).href;

    async function text(url) {
      let r;
      try { r = await holen(url, { cache: 'no-store', credentials: 'omit', redirect: 'error', referrerPolicy: 'no-referrer' }); }
      catch (e) { throw fehler('netz', 'Die Ablage ist nicht erreichbar. Bitte die Verbindung prüfen.'); }
      if (!r.ok) throw fehler('netz', `Die Ablage antwortet mit ${r.status}.`);
      return r.text();
    }

    /** Gibt es eine neuere Fassung? → { neu, version, notiz, manifest } */
    async function pruefen() {
      let m;
      try { m = JSON.parse(await text(adresse('manifest.json'))); } catch (e) { if (e.art) throw e; throw fehler('format', 'Die Ablage liefert kein gültiges Manifest.'); }
      formPruefen(m, app);
      return { neu: vergleichen(m.version, version) > 0, version: m.version, notiz: String(m.notiz || ''), manifest: m };
    }

    /** Neue Fassung laden und prüfen (Version, Prüfsumme, Signatur). → { text, version } */
    async function laden(manifest) {
      const m = formPruefen(manifest, app);
      if (vergleichen(m.version, version) <= 0) throw fehler('alt', `Fassung ${m.version} ist nicht neuer als ${version}.`);
      if (!await signaturGilt(m, schluessel)) throw fehler('signatur', 'Die Signatur passt nicht. Die neue Fassung wird nicht übernommen.');
      const t = await text(adresse(m.datei));
      if (await sha256(t) !== m.sha256) throw fehler('pruefsumme', 'Die geladene Datei passt nicht zum Manifest. Sie wird nicht übernommen.');
      return { text: t, version: m.version };
    }

    /** Neue Fassung an den Ort der alten schreiben. → 'geschrieben' | 'download' */
    async function schreiben(t) {
      const name = konfig.dateiname || `${app}.html`;
      if (typeof globalThis.showSaveFilePicker !== 'function') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], { type: 'text/html' }));
        a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        return 'download';
      }
      let g = null;
      try { g = await griff(app); } catch (e) { g = null; }
      if (g && (await g.queryPermission({ mode: 'readwrite' }) === 'granted' || await g.requestPermission({ mode: 'readwrite' }) === 'granted')) {
        // gemerkte Datei
      } else {
        try { g = await globalThis.showSaveFilePicker({ suggestedName: name, types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] }); }
        catch (e) { throw fehler('abbruch', 'Kein Ort gewählt. Die neue Fassung ist nicht gespeichert.'); }
        try { await griff(app, g); } catch (e) { /* nur nicht gemerkt */ }
      }
      const w = await g.createWritable();
      await w.write(t); await w.close();
      return 'geschrieben';
    }

    return { pruefen, laden, schreiben };
  }

  return { erstellen, vergleichen, NACHRICHT, sha256, signaturGilt, formPruefen, FORMAT };
});
</script>
<script>
/* Wartungsplaner · Schale: Router, Ansichten, Stilwahl.
   Braucht zustand-router (WK.zustand, WK.router, WK.zeichnen), ui-bausteine (WK.ui), gantt (WK.gantt),
   sitzung (WK.sitzung), die Einführung (WP.fuehrung) und die Ansichten (WP.ansichten, WP.form aus src/stamm/ und src/planung/). Läuft über file:// ohne Netz: keine Anfragen, keine Fremdressourcen. Die Daten liegen nur
   verschlüsselt in der Datendatei; solange sie gesperrt ist, zeigt die App den Sperrbildschirm der Sitzung. */
(function () {
  'use strict';
  const { ui, sitzung } = WK;
  const esc = ui.esc;
  const STIL_SCHLUESSEL = 'wartungsplaner.stil';   // wie in frueh.js
  const LEISTEN_SCHLUESSEL = 'wartungsplaner.leisten';   // wie in frueh.js: { links: 'fest'|'bedarf', rechts: 'offen'|'zu' }

    schluessel: 'aRfR2cDvbAgy/QltTvnOxEO9LJ+2gBnaHkEaSF55ggY=', dateiname: 'wartungsplaner.html' };
  const VERSION = document.querySelector('meta[name="version"]').content;

  /* Je Ansicht ein H1 als Tätigkeit und eine Hauptaktion. Mit `ziel` führt die Hauptaktion in eine andere Ansicht,

  const ANSICHTEN = {

      unter: 'Was in den nächsten 4 Wochen ansteht, Konflikte zuerst, und was überfällig ist.' },
    kunden: { titel: 'Kunden/Projekte', h1: 'Kunden und Projekte pflegen', aktion: 'Kunde anlegen',

      unter: 'Läufe auf der Zeitleiste, mit Abhängigkeiten und Konflikten. Termine und Anker lassen sich verschieben.' },
    kalender: { titel: 'Kalender', h1: 'Termine im Kalender sehen', aktion: 'Wartung planen',
      unter: 'Alle Schritte aller Läufe nach Monat und Woche, mit Sperrzeiten und Abwesenheiten.' },
    releases: { titel: 'Releases', h1: 'Feste Termine pflegen', aktion: 'Release anlegen',

    serien: { titel: 'Serien', h1: 'Wiederkehrende Wartungen festlegen', aktion: 'Serie anlegen',

    einstellungen: { titel: 'Einstellungen', h1: 'Einstellungen anpassen', aktion: 'Sicherung erstellen',

  const sym = (name, klasse = 'wp-sym') => `<svg class="${klasse}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

    { route: 'vorlagen', name: 'Vorlagen', sym: 'checkliste', noetig: true,
      stand: d => { const n = d.vorlagen.length + d.varianten.length; return n ? ['gut', 'kreis-haken', WP.form.mehrzahl(n, 'Vorlage', 'Vorlagen')] : null; } },
    { route: 'releases', name: 'Releases', sym: 'termin',
      stand: d => ((d.releases || []).length ? ['gut', 'kreis-haken', WP.form.mehrzahl(d.releases.length, 'Release', 'Releases')] : ['leise', 'kreis-strich', 'Optional']) },
    { route: 'serien', name: 'Serien', sym: 'wiederholen',
      stand: d => (d.serien.length ? ['gut', 'kreis-haken', WP.form.mehrzahl(d.serien.length, 'Serie', 'Serien')] : ['leise', 'kreis-strich', 'Optional']) },
    { route: 'planung', name: 'Planung', sym: 'gantt', noetig: true,
      stand: (d, t) => {
        const k = t.filter(({ t: x }) => (x.konflikte || []).length && !x.erledigt).length;
        if (k) return ['fehler', 'warnung', WP.form.mehrzahl(k, 'Konflikt', 'Konflikte')];

    { route: 'kalender', name: 'Kalender', sym: 'kalender',
      stand: (d, t) => {

      } },
    { route: 'export', name: 'Export', sym: 'herunterladen',

  ];

  /* Ablauf oben und „Als Nächstes“ rechts nach jedem Zeichnen. Ein Fehler darin darf die Ansicht nicht aufhalten. */
  function nebenbei() {

  let ablaufHtml = null;
  function ablaufZeichnen() {

    if (!d) { liste.innerHTML = ''; ablaufHtml = ''; return; }

    const html = ABLAUF.map((a, i) => {
      let st = a.stand(d, termine), art = '';
      if (!st) st = ['leise', 'kreis', 'Noch keine'];
      if (!st[0].match(/gut|fehler/) && a.noetig && !naechstes) { naechstes = true; st = ['naechstes', 'rechts', 'Als Nächstes']; }
      if (st[0] === 'gut' || st[0] === 'fehler' || st[0] === 'naechstes') art = ' ' + st[0];
      // Ruhig: Nummer (erledigt: Haken, Konflikt: Warnung); das Wort steht sichtbar nur, wenn es etwas zu tun gibt.
      // Zwischen den Schritten ein leiser Pfeil: die Richtung des Ablaufs.
      const zeichen = st[0] === 'gut' ? sym('haken') : st[0] === 'fehler' ? sym('warnung') : String(i + 1);

      return `<li>${i ? sym('rechts', 'wp-sym wp-ablauf-pfeil') : ''}<a class="wp-ablauf-schritt${art}" href="#/${a.route}" data-ansicht="${a.route}" title="${esc(`${i + 1}. ${a.name}: ${st[2]}`)}">`
        + `<span class="wp-ablauf-nr" aria-hidden="true">${zeichen}</span>`
        + `<span class="wp-ablauf-name">${esc(a.name)}</span>`
        + `<span class="wp-ablauf-stand ${st[0]}${laut ? '' : ' still'}">${sym(st[1])}<span>${esc(st[2])}</span></span></a></li>`;
    }).join('');

    return `<section class="wp-abschnitt"><div class="wk-karte vorschlag wp-leerkarte"><h2 class="wk-h3">${esc(titel)}</h2>`

    einstellungen: s => `<section class="wp-abschnitt"><h2 class="wk-h2">Darstellung</h2>`

      + ['tag', 'nacht'].map(w => `<button type="button" data-aktion="stil" data-wert="${w}" aria-pressed="${s.stil === w}">${w === 'tag' ? 'Tag' : 'Nacht'}</button>`).join('')

  ['uebersicht', 'kunden', 'vorlagen', 'releases', 'planung', 'kalender', 'serien'].forEach(n => { INHALT[n] = s => WP.ansichten[n].inhalt(s, ctx); });

  function exportAnsicht() {

    const sicherung = `<section class="wp-abschnitt"><h2 class="wk-h2">Gesamtsicherung</h2>`

      + `<div class="wp-knoepfe"><button type="button" class="wk-btn" data-aktion="export-sicherung">Sicherung herunterladen</button></div></section>`;
    if (!laeufe.length) return leer('Noch nichts zu exportieren', 'Sobald Termine geplant sind, lassen sie sich hier als Datei speichern.') + sicherung;

      + `<div class="wp-knoepfe"><button type="button" class="wk-btn haupt" data-aktion="export-ics"${anzahl ? '' : ' disabled'}>Termine für Outlook (ICS)</button>`
      + `<button type="button" class="wk-btn" data-aktion="export-csv"${anzahl ? '' : ' disabled'}>Aufgaben für Jira (CSV)</button></div></section>`
      + `<section class="wp-abschnitt"><h2 class="wk-h2">Übersichtsplan</h2>`
      + `<p class="wk-klein">Eine Seite zum Ansehen, Weitergeben und Drucken: je Kunde mit Logo, je Wartung die Schritte mit Status. `
      + `Es gilt die Auswahl oben (Kunde, Zeitraum). Das Hausdesign ist vorbereitet und wird noch festgelegt.</p>`
      + `<div class="wp-knoepfe"><button type="button" class="wk-btn" data-aktion="export-plan"${anzahl ? '' : ' disabled'}><svg class="wp-sym" aria-hidden="true"><use href="#i-drucken"/></svg><span>Übersichtsplan (HTML)</span></button></div></section>`
      + sicherung;
  }

  function exportieren(art) {
    const d = sitzung.daten();
    if (art === 'plan') {
      const r = WP.export.plan(d, exAuswahl(), WP.form.heute()), name = `wartungsplan-${WK.datei.zeitstempel()}.html`;
      sitzung.dateiExport(r.text, name, 'text/html;charset=utf-8');
      ui.toast(`Übersichtsplan mit ${r.anzahl} Terminen als „${name}“ im Download-Ordner.`, { art: 'erfolg', dauer: 6000 });
      return;
    }
    const name = `wartungsplaner-${art === 'ics' ? 'termine' : 'aufgaben'}-${WK.datei.zeitstempel()}.${art}`;
    if (art === 'ics') {
      const r = WP.export.ics(d, exAuswahl(), exOptionen(), d.exportstand || {});
      sitzung.aendern(x => { x.exportstand = r.stand; });
      sitzung.dateiExport(r.text, name, 'text/calendar;charset=utf-8');
      ui.toast(`${r.anzahl} Termine als „${name}“ im Download-Ordner.`, { art: 'erfolg', dauer: 6000 });
    } else {
      const r = WP.export.csv(d, exAuswahl(), exOptionen());
      sitzung.dateiExport(r.text, name, 'text/csv;charset=utf-8');
      ui.toast(`${r.anzahl} Aufgaben als „${name}“ im Download-Ordner.`, { art: 'erfolg', dauer: 6000 });
    }
  }

  function updateAbschnitt() {
    return `<section class="wp-abschnitt"><h2 class="wk-h2">Version und Updates</h2><p>Wartungsplaner ${esc(VERSION)}</p>`
      + `<p class="wk-klein">„Nach Updates suchen“ fragt einmal bei der Ablage auf GitHub nach. Sonst spricht die App mit niemandem. `
      + `Neue Fassungen sind signiert, ohne passende Signatur übernimmt die App nichts. Deine Daten bleiben in ihrer Datei.</p>`
      + `<div class="wp-knoepfe"><button type="button" class="wk-btn" data-aktion="update-suchen">${sym('herunterladen')}<span>Nach Updates suchen</span></button></div></section>`;
  }

  /* Nach Updates suchen: Manifest lesen; ist eine neuere Fassung da, nach Rückfrage laden, prüfen, an den Ort der alten
     Datei schreiben und neu laden. Vorher muss alles gespeichert sein (sonst hielte Chrome das Neuladen an). */
  let updateLaeuft = false;
  async function updateSuchen() {
    const m = document.querySelector('.wp-hilfemenue');
    if (m) m.open = false;
    if (updateLaeuft) return;
    updateLaeuft = true;
    try {
      const u = WK.selbstUpdate({ ...UPDATE, version: VERSION });
      let p;
      try { p = await u.pruefen(); } catch (e) { ui.toast(`Nicht gesucht. ${e.message}`, { dauer: 7000 }); return; }
      if (!p.neu) { ui.toast(`Du hast die neueste Fassung (${VERSION}).`, { art: 'erfolg' }); return; }
      const i = sitzung.info();
      if (i.offen && (i.ungespeichert || i.speichert)) { ui.toast(`Version ${p.version} ist da. Bitte erst „Speichern“, dann noch einmal „Nach Updates suchen“.`, { dauer: 8000 }); return; }
      const ok = await ui.frage({ titel: `Version ${p.version} ist da`, ja: 'Update installieren',
        text: `${p.notiz ? p.notiz + ' ' : ''}Beim ersten Mal fragt Chrome, wo die App liegt: die Datei ${UPDATE.dateiname} wählen und ersetzen. `
          + 'Danach lädt die App neu. Deine Daten bleiben in ihrer Datei.' });
      if (!ok) return;
      try {
        const neu = await u.laden(p.manifest);
        if (await u.schreiben(neu.text) === 'download') {
          ui.toast(`Version ${neu.version} liegt im Download-Ordner. Bitte die alte Datei damit ersetzen und neu öffnen.`, { dauer: 10000 });
          return;
        }
        ui.toast(`Version ${neu.version} installiert. Die App lädt neu.`, { art: 'erfolg' });
        setTimeout(() => location.reload(), 1500);
      } catch (e) { ui.toast(`Update nicht installiert. ${e.message}`, { dauer: 9000 }); }
    } finally { updateLaeuft = false; }
  }

  function dateiAbschnitt() {
    const i = sitzung.info();
    const wo = i.weg === 'ordner'
      ? `Die letzten ${WK.datei.BEHALTEN} Stände liegen im selben Ordner unter „sicherung“. „Sicherung erstellen“ legt dort eine weitere ab.`
      : 'Dieser Browser speichert nicht direkt in einen Ordner. „Speichern“ lädt jedes Mal eine neue Datei mit Zeitstempel herunter.';
    return `<section class="wp-abschnitt"><h2 class="wk-h2">Datei</h2>`
      + `<p>${esc(i.ort)}</p><p class="wk-klein">${esc(wo)}</p>`
      + `<p class="wk-klein">Die Daten liegen nur verschlüsselt in dieser Datei auf diesem Rechner. Die App lädt nichts aus dem Netz und sendet nichts.</p>`
      + `<div class="wp-knoepfe"><button type="button" class="wk-btn" data-aktion="passwort-aendern">Passwort ändern</button>`
      + `<button type="button" class="wk-btn" data-aktion="sperren">Jetzt sperren</button></div></section>`;
  }

  function sperreAbschnitt() {
    const e = sitzung.einstellungen(), pin = sitzung.info().pin;
    return `<section class="wp-abschnitt"><h2 class="wk-h2">Sperre</h2>`
      + `<p class="wk-klein">Gesperrt vergisst die App den Schlüssel und alle entschlüsselten Daten. Danach braucht es die PIN, ohne PIN das Passwort. `
      + `Nach dem Schließen der App und nach ${sitzung.PIN_VERSUCHE} falschen PINs braucht es immer das Passwort.</p>`
      + `<label class="wp-zeile" for="wp-sperre-minuten">Nach Leerlauf sperren`
      + `<select class="wk-feld wp-auswahl" id="wp-sperre-minuten" data-aktion="sperre-minuten">`
      + sitzung.MINUTEN.map(m => `<option value="${m}"${m === e.minuten ? ' selected' : ''}>nach ${m} ${m === 1 ? 'Minute' : 'Minuten'}</option>`).join('')
      + `</select></label>`
      + `<label class="wp-zeile"><span>Sperren, wenn das Fenster länger als 1 Minute verborgen ist</span><button type="button" class="wk-schalter" role="switch" `
      + `aria-checked="${e.verborgen}" data-aktion="sperre-verbergen"></button></label>`
      + `<p class="wk-klein">Ein Fenster, das nur kurz verdeckt ist, sperrt nicht. Die verdeckte Zeit zählt als Leerlauf.</p>`
      + `<h3 class="wk-h3">PIN</h3>`
      + `<p class="wp-meldung">${pin ? ui.pill('entschieden', 'Festgelegt') + '<span>Gesperrt reicht die PIN.</span>'
        : ui.pill('offen', 'Keine PIN') + '<span>Gesperrt braucht es das ganze Passwort.</span>'}</p>`
      + `<div class="wp-knoepfe"><button type="button" class="wk-btn" data-aktion="pin-festlegen">${pin ? 'PIN ändern' : 'PIN festlegen'}</button>`
      + (pin ? `<button type="button" class="wk-btn" data-aktion="pin-entfernen">PIN entfernen</button>` : '') + `</div></section>`;
  }

  /* Hinweis, solange Änderungen nicht in der Datei sind: auf Weg 2 bis zum Download, auf Weg 1 nach einem Fehler. */
  function ungespeichertHinweis() {
    const i = sitzung.info();
    if (!i.ungespeichert || (i.weg === 'ordner' && !i.speicherFehler)) return '';
    const text = i.speicherFehler || '„Speichern“ lädt den Stand als Datei herunter. Ohne Speichern gehen die Änderungen beim Schließen verloren.';
    return `<div class="wp-seitenblock wp-ungespeichert" role="status">${ui.pill('offen', 'Ungespeicherte Änderungen')}`
      + `<p>${esc(text)}</p><button type="button" class="wk-btn" data-aktion="speichern">Speichern</button></div>`;
  }

  /* Während der Einführung: Hinweis, dass hier nur Beispieldaten stehen. */
  function uebungHinweis() {
    if (!sitzung.info().uebung) return '';
    return `<div class="wp-seitenblock wp-uebung" role="note">${ui.pill('vorschlag', 'Beispieldaten')}`
      + `<p>Die Einführung läuft. Was Du hier siehst und änderst, ist erfunden und wird nicht gespeichert. Deine Daten bleiben unverändert.</p></div>`;
  }

  function ansicht(s) {
    const a = ANSICHTEN[s.route], A = WP.ansichten[s.route];
    const aktion = A && A.aktion ? A.aktion(s, ctx) : a.aktion;
    return ui.kopf({ titel: a.h1, unter: a.unter,
      aktionen: `<button type="button" class="wk-btn haupt" data-aktion="haupt">${sym(AKTION_SYMBOL[s.route] || 'plus')}<span>${esc(aktion)}</span></button>` })
      + ungespeichertHinweis() + uebungHinweis() + (s.route === 'uebersicht' ? WP.fuehrung.angebot() : '')
      + `<div class="wp-koerper">${INHALT[s.route](s)}</div>`;
  }

  /* ------------------------------------------------------------ Stil (Tag/Nacht) */

  function gemerkterStil() {
    try { return localStorage.getItem(STIL_SCHLUESSEL); } catch (e) { return null; }
  }

  // Stil ist Glas; Tag/Nacht wählt dessen Hell/Dunkel (data-theme, siehe frueh.js)
  function stilSetzen(stil, merken) {
    document.documentElement.dataset.theme = stil === 'nacht' ? 'dunkel' : 'hell';
    if (merken) try { localStorage.setItem(STIL_SCHLUESSEL, stil); } catch (e) { /* Speicher gesperrt: gilt bis zum Schließen */ }
    document.querySelector('[data-aktion="stil-wechseln"]').setAttribute('aria-checked', String(stil === 'nacht'));
    z.set({ stil });
  }

  /* ------------------------------------------------------------ Seitenbereiche (links fest/bei Bedarf, rechts offen/zu) */

  function leisten() {
    const h = document.documentElement.dataset;
    return { links: h.links === 'bedarf' ? 'bedarf' : 'fest', rechts: h.rechts === 'offen' ? 'offen' : 'zu' };
  }
  function leistenSetzen(teil, merken = true) {
    const neu = { ...leisten(), ...teil }, h = document.documentElement.dataset;
    h.links = neu.links; h.rechts = neu.rechts;
    if (merken) try { localStorage.setItem(LEISTEN_SCHLUESSEL, JSON.stringify(neu)); } catch (e) { /* gilt bis zum Schließen */ }
    const lk = document.querySelector('[data-aktion="links-umschalten"]');
    lk.setAttribute('aria-pressed', String(neu.links === 'bedarf'));
    lk.querySelector('span').textContent = neu.links === 'bedarf' ? 'Leiste anheften' : 'Bei Bedarf einblenden';
    const rk = document.querySelector('[data-aktion="rechts-umschalten"]');
    rk.setAttribute('aria-expanded', String(neu.rechts === 'offen'));
    rk.querySelector('span').textContent = neu.rechts === 'offen' ? 'Einklappen' : 'Ausklappen';
    if (neu.rechts === 'zu') WP.blatt.festSchliessen();          // offenes Blatt im Bereich: abbrechen
    if (z) z.set({});
  }

  /* ------------------------------------------------------------ Zustand, Router, Zeichnen */

  const z = WK.zustand(() => ({ route: 'uebersicht', teil: null, stil: document.documentElement.dataset.theme === 'dunkel' ? 'nacht' : 'tag' }));
  const inhalt = document.getElementById('inhalt');
  let vorher = null, vorherTeil = null, gezeichnet = null, erzwingen = false;

  /* Was die Stammdaten-Ansichten von der Schale brauchen (siehe src/stamm/form.js). */
  const ctx = {
    get s() { return z.get(); },
    daten: () => WP.form.vollstaendig(sitzung.daten()),
    aendern: fn => { erzwingen = true; sitzung.aendern(d => { fn(WP.form.vollstaendig(d)); }); },
    gehe: pfad => gehe(pfad),
    neu: () => { erzwingen = true; z.set({}); },
  };

  let warGesperrt = null;
  z.abonnieren(s => {
    const offen = sitzung.info().offen;
    document.body.toggleAttribute('data-gesperrt', !offen);
    if (!offen) {
      WK.zeichnen(inhalt, sitzung.sperrbild());
      inhalt.querySelector('h1').tabIndex = -1;
      document.title = 'Gesperrt · Wartungsplaner';
      // Beim Wechsel der Tür (oder ins Gesperrte) auf das erste Feld, sonst bleibt der Fokus, wo er war
      const tuer = inhalt.querySelector('h1').textContent;
      if (warGesperrt !== tuer) (inhalt.querySelector('.wk-feld') || inhalt.querySelector('h1')).focus();
      warGesperrt = tuer;
      vorher = null; gezeichnet = null;
      nebenbei();
      return;
    }
    const entsperrt = warGesperrt !== null;
    warGesperrt = null;
    // Die Überschrift hat keinen Schlüssel für zeichnen(): Fokus auf ihr bleibt beim Neuzeichnen (etwa nach dem Speichern) so erhalten
    const aufH1 = !!document.activeElement && document.activeElement.matches('#inhalt h1');
    // Gleiches HTML (etwa nach dem Speichern im Ordner) nicht neu zeichnen: sonst gingen Markierung und noch nicht
    // übernommene Eingaben im Feld mit dem Fokus verloren. Nach ctx.aendern() und ctx.neu() zeichnet sie immer (die Gantt-
    // Zeitleiste steht nicht im HTML, ein geleertes Pflichtfeld wird so zurückgesetzt).
    const html = ansicht(s);
    if (html === gezeichnet && !erzwingen && !entsperrt) return;
    gezeichnet = html; erzwingen = false;
    WK.zeichnen(inhalt, html);
    nebenbei();
    const h1 = inhalt.querySelector('h1');
    h1.tabIndex = -1;
    if (entsperrt || aufH1) h1.focus({ preventScroll: !entsperrt });
    document.title = `${ANSICHTEN[s.route].titel} · Wartungsplaner`;
    document.querySelectorAll('[data-ansicht]').forEach(a => {
      if (a.dataset.ansicht === s.route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    const A = WP.ansichten[s.route];
    if (A && A.nachher) A.nachher(s, ctx);
    // Nach einem Wechsel der Ansicht (nicht beim Start) springt der Fokus auf die Überschrift,
    // nach der Wahl eines Kunden, einer Vorlage oder Serie auf die Überschrift des Bearbeitungsbereichs.
    const editor = document.getElementById('wp-bearbeiten');
    if (vorher && vorher !== s.route) h1.focus();
    else if (vorher && s.teil !== vorherTeil && editor) editor.focus();
    vorher = s.route; vorherTeil = s.teil;
  });

  // Bereich „Details“ ohne Blatt: die nächsten Termine (gesperrt: nur der Hinweis)
  WP.blatt.leer = () => (sitzung.info().offen ? WP.ansichten.uebersicht.naechste(ctx.daten()) : '');

  const { gehe } = WK.router({ namen: Object.keys(ANSICHTEN), start: '/uebersicht', beiWechsel: r => z.set({ route: r.name, teil: r.teile[0] || null }) });
  stilSetzen(z.get().stil, false);
  leistenSetzen({}, false);
  WP.fuehrung.einrichten({ z, gehe });   // nach dem Abonnenten oben: die Einführung sieht die fertig gezeichnete Ansicht
  sitzung.starten({ melden: () => z.set({}) });

  // Ohne gemerkte Wahl folgt der Stil dem System, auch wenn es während der Sitzung wechselt.
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!gemerkterStil()) stilSetzen(e.matches ? 'nacht' : 'tag', false);
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-aktion]');
    if (!el) return;
    const aktion = el.dataset.aktion;
    if (WP.fuehrung.klick(aktion)) return;
    if (aktion === 'zum-inhalt') { e.preventDefault(); inhalt.querySelector('h1').focus(); }
    else if (aktion === 'stil-wechseln') stilSetzen(z.get().stil === 'nacht' ? 'tag' : 'nacht', true);
    else if (aktion === 'stil') stilSetzen(el.dataset.wert, true);
    else if (aktion === 'links-umschalten') leistenSetzen({ links: leisten().links === 'bedarf' ? 'fest' : 'bedarf' });
    else if (aktion === 'rechts-umschalten') leistenSetzen({ rechts: leisten().rechts === 'offen' ? 'zu' : 'offen' });
    else if (aktion === 'links') leistenSetzen({ links: el.dataset.wert });
    else if (aktion === 'rechts') leistenSetzen({ rechts: el.dataset.wert });
    else if (aktion === 'sperren') sitzung.sperren('Gesperrt.');
    else if (aktion === 'app-fenster') appFenster();
    else if (aktion === 'update-suchen') updateSuchen();
    else if (aktion === 'speichern') sitzung.speichern();
    else if (aktion === 'export-ics' || aktion === 'export-csv' || aktion === 'export-plan') exportieren(aktion.slice(7));
    else if (aktion === 'export-sicherung') sitzung.sicherungExport().then(n => ui.toast(`Gesamtsicherung „${n}“ im Download-Ordner.`, { art: 'erfolg', dauer: 6000 }));
    else if (aktion === 'passwort-aendern') passwortAendern();
    else if (aktion === 'sperre-verbergen') sitzung.einstellungenSetzen({ verborgen: !sitzung.einstellungen().verborgen });
    else if (aktion === 'pin-festlegen') pinFestlegen();
    else if (aktion === 'pin-entfernen') { sitzung.pinEntfernen(); ui.toast('PIN entfernt', { art: 'erfolg' }); }
    else if (aktion === 'haupt') {
      const a = ANSICHTEN[z.get().route], A = WP.ansichten[z.get().route];
      if (z.get().route === 'einstellungen') sitzung.sicherungErstellen();
      else if (a.ziel) gehe('/' + a.ziel);
      else if (A && A.haupt) A.haupt(z.get(), ctx);
      else ui.toast(`„${a.aktion}“ kommt mit einem der nächsten Ausbauschritte.`);
    } else if (aktion === 'termin-oeffnen' && sitzung.info().offen && el.closest('#wp-rechts-inhalt')) {
      const w = el.dataset.wert, i = w.indexOf('|');
      WP.plan.schrittBlatt(ctx, w.slice(0, i), w.slice(i + 1));
    } else if (sitzung.info().offen && inhalt.contains(el)) {
      const A = WP.ansichten[z.get().route];
      if (A && A.klick && A.klick[aktion]) A.klick[aktion](el, ctx);
      else if (A) WP.form.klick(aktion, el, ctx, A);
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    const f = el.dataset;
    if (f.export) { ex[f.export] = el.type === 'checkbox' ? el.checked : el.value; z.set({}); }
    else if (f.exportBeschreibung) { ex.beschreibung[f.exportBeschreibung] = el.checked; z.set({}); }
    else if (f.aktion === 'sperre-minuten') sitzung.einstellungenSetzen({ minuten: Number(el.value) });
    else if (f.pfad && sitzung.info().offen && inhalt.contains(el)) {
      const A = WP.ansichten[z.get().route];
      if (!A) return;
      if (f.typ === 'lokal') { if (A.lokal) A.lokal(el, ctx); }
      else WP.form.geaendert(el, ctx, A);
    }
  });

  /* Tab aus einem Feld: change kommt vor dem Fokuswechsel, und die App zeichnet dabei neu. Das verlassene Feld wäre
     ersetzt, Chrome fände das nächste nicht mehr (Fokus landete irgendwo). Deshalb führt die App den Wechsel selbst:
     Feld loslassen (change, Neuzeichnen), dasselbe Feld im neuen Inhalt suchen, Fokus auf das nächste bzw. vorige.
     Datums- und Zeitfelder nicht: Dort springt Tab zwischen Tag, Monat und Jahr. */
  const TABBAR = 'a[href], button, input, select, textarea, [tabindex]';
  const tabbar = () => [...document.querySelectorAll(TABBAR)].filter(e => e.tabIndex >= 0 && !e.disabled && e.type !== 'hidden'
    && !e.closest('[inert], [hidden]') && e.getClientRects().length);
  const feldSchluessel = e => (e.id ? '#' + CSS.escape(e.id) : e.dataset.pfad ? `[data-pfad="${CSS.escape(e.dataset.pfad)}"]` : null);
  document.addEventListener('keydown', e => {
    const el = document.activeElement;
    if (e.key !== 'Tab' || e.ctrlKey || e.altKey || e.metaKey || !el || !inhalt.contains(el) || !el.dataset.pfad) return;
    if (!/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || /^(date|time|datetime-local|month|week)$/.test(el.type)) return;
    const sk = feldSchluessel(el);
    if (!sk) return;
    e.preventDefault();
    el.blur();                                                     // change und Neuzeichnen jetzt, mit dem Fokus noch hier
    const neu = document.querySelector(sk) || el;
    const liste = tabbar(), i = liste.indexOf(neu);
    const ziel = i < 0 ? null : liste[i + (e.shiftKey ? -1 : 1)];
    (ziel || neu).focus();
    if (ziel && ziel.select && /^(text|search|email|url|tel|number|password)$/.test(ziel.type)) ziel.select();
  }, true);

  /* Als App-Fenster: Chrome legt für die Datei eine Verknüpfung an, die ohne Adresszeile in einem eigenen Fenster startet. */
  function appFenster() {
    const m = document.querySelector('.wp-hilfemenue');
    if (m) m.open = false;
    ui.frage({ titel: 'Als App-Fenster öffnen', ja: 'Verstanden', nein: '',
      text: 'In Chrome: Menü ⋮ › „Streamen, speichern und teilen“ › „Verknüpfung erstellen …“, dort „Als Fenster öffnen“ anhaken und „Erstellen“ wählen. '
        + 'Danach startet der Wartungsplaner über das neue Symbol auf dem Desktop oder im Startmenü in einem eigenen Fenster ohne Adresszeile. '
        + 'Die Datei muss dafür an ihrem Ort bleiben. Ohne Chrome-Menü geht es auch mit einer Verknüpfung auf chrome.exe --app="file:///…/wartungsplaner.html".' });
  }

  /* PIN festlegen oder ändern: Passwort und zweimal die PIN; bei einem Fehler fragt sie mit der Ursache erneut. */
  async function pinFestlegen() {
    let text = 'Die PIN gilt nur zum Entsperren, solange die App offen ist. Sie liegt verschlüsselt in diesem Browser.';
    for (;;) {
      const w = await ui.frage({ titel: 'PIN festlegen', text, ja: 'PIN festlegen', felder: [
        { name: 'passwort', label: 'Passwort der Datei', typ: 'password', pflicht: true },
        { name: 'pin', label: 'PIN (4 bis 8 Ziffern)', typ: 'password', pflicht: true },
        { name: 'wiederholung', label: 'PIN wiederholen', typ: 'password', pflicht: true },
      ] });
      if (!w) return;
      if (w.pin !== w.wiederholung) { text = 'Die beiden PINs sind verschieden. Bitte beide gleich eingeben.'; continue; }
      try {
        await sitzung.pinFestlegen(w.passwort, w.pin);
      } catch (e) {
        if (e.art === 'passwort') { text = 'Das Passwort stimmt nicht. Bitte noch einmal eingeben.'; continue; }
        if (e.art === 'pin') { text = e.message; continue; }
        ui.toast('PIN nicht festgelegt. ' + sitzung.ursache(e), { dauer: 8000 });
        return;
      }
      ui.toast('PIN festgelegt', { art: 'erfolg' });
      return;
    }
  }

  /* Passwort ändern: Rückfrage mit drei Feldern; bei einem Fehler fragt sie mit der Ursache erneut. */
  async function passwortAendern() {
    let text = 'Ältere Sicherungen behalten das alte Passwort.';
    for (;;) {
      const w = await ui.frage({ titel: 'Passwort ändern', text, ja: 'Passwort ändern', felder: [
        { name: 'alt', label: 'Bisheriges Passwort', typ: 'password', pflicht: true },
        { name: 'neu', label: 'Neues Passwort (mindestens 12 Zeichen)', typ: 'password', pflicht: true },
        { name: 'wiederholung', label: 'Neues Passwort wiederholen', typ: 'password', pflicht: true },
      ] });
      if (!w) return;
      if (w.neu !== w.wiederholung) { text = 'Die beiden neuen Passwörter sind verschieden. Bitte beide gleich eingeben.'; continue; }
      try {
        await sitzung.passwortAendern(w.alt, w.neu);
      } catch (e) {
        if (e.art === 'passwort') { text = 'Das bisherige Passwort stimmt nicht. Bitte noch einmal eingeben.'; continue; }
        if (e.art === 'schwach') { text = sitzung.ursache(e); continue; }
        ui.toast('Passwort nicht geändert. ' + sitzung.ursache(e), { dauer: 8000 });
        return;
      }
      const i = sitzung.info();
      ui.toast(i.weg === 'einzeln' ? 'Passwort geändert. Bitte jetzt „Speichern“ wählen.' : 'Passwort geändert', { art: 'erfolg', dauer: 5000 });
      return;
    }
  }
})();
</script>
