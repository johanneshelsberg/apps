    s.arbeitet = 'Datei wird entschlüsselt …'; s.meldung = null; melden();
    try {
      const text = vorrat || (s.weg === 'ordner' ? await D.ordnerLesen(s.ordner) : s.dateiText);
      if (text === null) return ordnerPruefen();
      const echt = JSON.parse(text);
      const r = await D.entsperren(JSON.stringify({ ...echt, umschlag: pinUmschlag }) + '\n', pin);
      schluessel = r.schluessel; umschlag = echt.umschlag; daten = r.daten; vorrat = null; pinFehler = 0;
      if (r.migriert) { stand++; s.ungespeichert = true; }
      oeffnen();
      if (s.ungespeichert) planen();
    } catch (e) {
      if (e.art !== 'passwort') return tuer('pin', { art: 'fehler', text: ursache(e) });
      pinFehler++;
      if (pinFehler >= PIN_VERSUCHE) {
        pinSetzen(null); pinFehler = 0;
        return tuer('entsperren', { art: 'fehler', text: `Die PIN war ${PIN_VERSUCHE}-mal falsch. Bitte das Passwort eingeben.` });
      }
      const rest = PIN_VERSUCHE - pinFehler;
      tuer('pin', { art: 'fehler', text: `Die PIN stimmt nicht. Noch ${rest} ${rest === 1 ? 'Versuch' : 'Versuche'}, danach braucht es das Passwort.` });
    }
  }

  async function anlegen(passwort, wiederholung) {
    if (passwort !== wiederholung) return tuer('anlegen', { art: 'fehler', text: 'Die beiden Passwörter sind verschieden. Bitte beide gleich eingeben.' });
    const schwach = T.passwortPruefen(passwort);
    if (schwach) return tuer('anlegen', { art: 'fehler', text: ursache({ art: 'schwach', message: schwach }) });
    s.arbeitet = 'Datei wird angelegt …'; s.meldung = null; melden();
    try {
      const r = await D.anlegen(passwort, D.leereDaten());
      schluessel = r.schluessel; umschlag = r.umschlag; daten = D.leereDaten(); vorrat = null;
      stand++;
      s.ungespeichert = true;
      if (s.weg === 'einzeln') s.dateiName = '';
      oeffnen();
      if (s.weg === 'ordner') await speichern();
    } catch (e) {
      tuer('anlegen', { art: 'fehler', text: ursache(e) });
    }
  }

  function oeffnen() {
    s.offen = true; s.tuer = 'entsperren'; s.meldung = null; s.arbeitet = ''; s.dateiText = null;
    letzteEingabe = Date.now();
    melden();
  }

  /* ------------------------------------------------------------ Daten, Speichern */

  function daten_() { return s.offen ? uebung || daten : null; }

  function aendern(fn) {
    if (!s.offen) throw new Error('Gesperrt: erst entsperren.');
    if (uebung) {
      const neu = fn(uebung);
      if (neu !== undefined) uebung = neu;
      melden();
      return;
    }
    const neu = fn(daten);
    if (neu !== undefined) daten = neu;
    stand++; s.ungespeichert = true;
    planen();
    melden();
  }

  function planen() {
    if (s.weg !== 'ordner') return;
    clearTimeout(speicherUhr);
    speicherUhr = setTimeout(() => { speichern(); }, 800);
  }

  function herunterladen(text, name = `wartungsplaner-${D.zeitstempel()}.wpdb`, typ = 'application/octet-stream') {
    const url = URL.createObjectURL(new Blob([text], { type: typ }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return name;
  }

  /** Speichert den aktuellen Stand (Weg 1 in den Ordner, Weg 2 als Download). → true, wenn gespeichert */
  function speichern() {
    clearTimeout(speicherUhr);
    kette = kette.then(async () => {
      if (!s.offen) return false;                                 // sperren() speichert selbst
      const diesmal = stand;
      const text = await D.verpacken({ umschlag, schluessel }, daten);
      if (s.weg === 'einzeln') {
        s.dateiName = herunterladen(text);
      } else {
        s.speichert = true; melden();
        try {
          if (await s.ordner.queryPermission(SCHREIBEN) !== 'granted') throw Object.assign(new Error('Keine Freigabe'), { name: 'NotAllowedError' });
          await D.ordnerSpeichern(s.ordner, text);
        } catch (e) {
          s.speicherFehler = 'Speichern hat nicht geklappt. ' + ursache(e);
          return false;
        } finally { s.speichert = false; melden(); }
      }
      gespeicherterStand = diesmal;
      s.ungespeichert = stand !== gespeicherterStand; s.speicherFehler = ''; s.gespeichert = new Date();
      melden();
      return true;
    }).catch(e => { s.speicherFehler = 'Speichern hat nicht geklappt. ' + ursache(e); melden(); return false; });
    return kette;
  }

  /** Knopf „Speichern“: holt bei Bedarf die Freigabe (braucht den Klick) und speichert. */
  async function speichernKnopf() {
    if (s.weg === 'ordner' && s.ordner && await s.ordner.queryPermission(SCHREIBEN) !== 'granted') {
      try { await s.ordner.requestPermission(SCHREIBEN); } catch (e) { /* speichern() meldet es */ }
    }
    const ok = await speichern();
    if (ok && s.weg === 'einzeln') ui.toast(`Gespeichert als „${s.dateiName}“ im Download-Ordner. Diese Datei beim nächsten Mal öffnen.`, { art: 'erfolg', dauer: 6000 });
    else if (ok) ui.toast('Gespeichert', { art: 'erfolg' });
    return ok;
  }

  async function sicherungErstellen() {
    if (!s.offen) return false;
    if (s.weg === 'einzeln') {
      const ok = await speichern();
      if (ok) ui.toast(`Sicherung erstellt: „${s.dateiName}“ im Download-Ordner.`, { art: 'erfolg', dauer: 6000 });
      return ok;
    }
    if (await s.ordner.queryPermission(SCHREIBEN) !== 'granted') {
      try { await s.ordner.requestPermission(SCHREIBEN); } catch (e) { /* speichern() meldet es */ }
    }
    if (!await speichern()) { ui.toast('Sicherung nicht erstellt. ' + s.speicherFehler, { dauer: 8000 }); return false; }
    try {
      const name = await D.sicherungAblegen(s.ordner, await D.ordnerLesen(s.ordner));
      ui.toast(`Sicherung erstellt: sicherung/${name}`, { art: 'erfolg', dauer: 5000 });
      return true;
    } catch (e) {
      ui.toast('Sicherung nicht erstellt. ' + ursache(e), { dauer: 8000 });
      return false;
    }
  }

  /** Gesamtsicherung als Download, immer verschlüsselt (gleiche Datei wie die Datendatei, eigener Name). → Dateiname */
  async function sicherungExport() {
    if (!s.offen) throw new Error('Gesperrt: erst entsperren.');
    return herunterladen(await D.verpacken({ umschlag, schluessel }, daten), `wartungsplaner-sicherung-${D.zeitstempel()}.wpdb`);
  }

  /** Klartext-Datei (ICS, CSV) herunterladen. Sie verlässt die verschlüsselte Ablage. */
  function dateiExport(text, name, typ) { return herunterladen(text, name, typ); }

  /** Neues Passwort setzen. Fehler tragen art 'passwort' oder 'schwach' (Text über ursache). */
  async function passwortAendern(alt, neu) {
    if (!s.offen) throw new Error('Gesperrt');
    umschlag = await T.passwortAendern(umschlag, alt, neu);
    stand++; s.ungespeichert = true;
    if (s.weg === 'ordner') await speichern(); else melden();
  }

  /* ------------------------------------------------------------ Sperren */

  async function sperren(grund) {
    if (!s.offen) return;
    const k = schluessel, d = daten, u = umschlag, offenGeblieben = s.ungespeichert;
    schluessel = null; daten = null; uebung = null;
    s.offen = false;
    clearTimeout(speicherUhr);
    // Klartext verschwindet sofort von der Seite; der Hinweis sagt, ob PIN oder Passwort
    tuer(pinUmschlag ? 'pin' : 'entsperren', { art: 'hinweis', text: `${grund || 'Gesperrt.'} ${weiter()}` });
    kette = kette.then(async () => {
      const text = await D.verpacken({ umschlag: u, schluessel: k }, d);
      if (s.weg === 'ordner') {
        if (!offenGeblieben) return;
        try { await D.ordnerSpeichern(s.ordner, text); s.ungespeichert = false; s.speicherFehler = ''; s.gespeichert = new Date(); }
        catch (e) { vorrat = text; s.speicherFehler = 'Speichern hat nicht geklappt. ' + ursache(e); }
      } else {
        vorrat = text;
      }
    }).catch(() => {}).then(() => melden());
    return kette;
  }

  function leerlaufPruefen() {
    if (!s.offen) return;
    const { minuten, verborgen } = einstellungen();
    if (Date.now() - letzteEingabe >= minuten * 60000) {
      sperren(`Gesperrt nach ${minuten} ${minuten === 1 ? 'Minute' : 'Minuten'} ohne Eingabe.`);
    } else if (verborgen && verborgenSeit !== null && Date.now() - verborgenSeit >= VERBORGEN_MS) {
      sperren('Gesperrt, weil das Fenster länger als 1 Minute verborgen war.');
    }
  }

  const eingabe = () => { letzteEingabe = Date.now(); };
  for (const art of ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart']) addEventListener(art, eingabe, { passive: true, capture: true });
  setInterval(leerlaufPruefen, 15000);
  addEventListener('focus', leerlaufPruefen);                      // nach dem Ruhezustand laufen Zeitgeber verspätet
  addEventListener('pageshow', leerlaufPruefen);
  // Verborgen (auch nur von einem anderen Fenster verdeckt) sperrt nicht sofort: Die Zeit zählt als Leerlauf, und auf
  // Wunsch sperrt ein Fenster, das länger als 1 Minute verborgen war (Prüfung im Takt und beim Zurückkommen).
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') verborgenSeit = Date.now();
    else { leerlaufPruefen(); verborgenSeit = null; }
  });
  addEventListener('beforeunload', e => {
    if (s.ungespeichert || s.speichert) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ------------------------------------------------------------ Sperrbildschirm */

  function meldungHtml() {
    const m = s.meldung;
    const teile = [];
    if (m) teile.push(`<p class="wp-meldung ${m.art}" role="${m.art === 'fehler' ? 'alert' : 'status'}">${ui.pill(m.art === 'fehler' ? 'fehler' : 'offen', m.art === 'fehler' ? 'Fehler' : 'Hinweis')}<span>${esc(m.text)}</span></p>`);
    if (!s.offen && s.ungespeichert) {
      teile.push(`<p class="wp-meldung hinweis">${ui.pill('offen', 'Ungespeicherte Änderungen')}<span>${s.weg === 'einzeln'
        ? 'Nach dem Entsperren „Speichern“ wählen, sonst gehen sie beim Schließen verloren.'
        : esc(s.speicherFehler || 'Sie werden nach dem Entsperren gespeichert.')}</span></p>`);
    }
    return teile.join('');
  }

  const knopf = (aktion, text, haupt = false) => `<button type="button" class="wk-btn${haupt ? ' haupt' : ''}" data-tuer="${aktion}"${s.arbeitet ? ' disabled' : ''}>${esc(text)}</button>`;
  const feld = (id, name, label, auto, hilfe = '') => `<label class="wp-feld" for="${id}">${esc(label)}`
    + `<input class="wk-feld" id="${id}" name="${name}" type="password" autocomplete="${auto}" required${hilfe ? ` aria-describedby="${id}-hilfe"` : ''}></label>`
    + (hilfe ? `<p class="wk-klein wp-hilfe" id="${id}-hilfe">${esc(hilfe)}</p>` : '');
  // Fester Benutzername, damit Passwort-Manager das Passwort dieser Datei zuordnen
  const benutzer = '<input type="text" name="benutzer" autocomplete="username" value="wartungsplaner" hidden>';
  const arbeitet = () => (s.arbeitet ? `<p class="wp-arbeitet" role="status">${esc(s.arbeitet)}</p>` : '');
  const dateiwahl = '<input type="file" id="wp-datei-wahl" accept=".wpdb" hidden>';

  function sperrbild() {
    const ordner = ordnerMoeglich();
    let titel, unter, inhalt;
    if (s.tuer === 'freigabe') {
      titel = 'Ordner freigeben';
      unter = `Ordner „${s.ordner.name}“ · ${D.DATEINAME}`;
      inhalt = `<p>Chrome fragt gleich, ob der Wartungsplaner den Ordner „${esc(s.ordner.name)}“ bearbeiten darf. Bitte „Bearbeiten erlauben“ wählen.</p>`
        + '<p class="wk-klein">Chrome fragt das nach jedem Neustart einmal. Die Daten bleiben dabei im Ordner und verlassen den Rechner nicht.</p>'
        + `<div class="wp-tuer-knoepfe">${knopf('freigeben', 'Ordner freigeben', true)}${knopf('ordner-waehlen', 'Anderen Ordner wählen')}${knopf('zurueck', 'Ohne Ordner arbeiten')}</div>`;
    } else if (s.tuer === 'pin' && pinUmschlag) {
      titel = 'Mit PIN entsperren';
      unter = ort();
      inhalt = `<form class="wp-tuer-form" data-tuer-form="pin" novalidate>`
        + `<label class="wp-feld" for="wp-pin">PIN<input class="wk-feld wp-pin" id="wp-pin" name="pin" type="password" inputmode="numeric" `
        + `autocomplete="off" maxlength="8" required></label>`
        + `<div class="wp-tuer-knoepfe"><button type="submit" class="wk-btn haupt"${s.arbeitet ? ' disabled' : ''}>Entsperren</button>`
        + `${knopf('passwort', 'Mit Passwort entsperren')}</div></form>`;
    } else if (s.tuer === 'entsperren' || s.tuer === 'pin') {
      titel = 'Datei entsperren';
      unter = ort();
      inhalt = `<form class="wp-tuer-form" data-tuer-form="entsperren" novalidate>${benutzer}`
        + feld('wp-passwort', 'passwort', 'Passwort', 'current-password')
        + `<div class="wp-tuer-knoepfe"><button type="submit" class="wk-btn haupt"${s.arbeitet ? ' disabled' : ''}>Entsperren</button>`
        + `${pinUmschlag ? knopf('pin', 'Mit PIN entsperren') : ''}${knopf('zurueck', 'Andere Datei wählen')}</div></form>`;
    } else if (s.tuer === 'anlegen') {
      titel = 'Datei anlegen';
      unter = s.weg === 'ordner' ? `Neue Datei ${D.DATEINAME} im Ordner „${s.ordner.name}“` : 'Neue Datei. „Speichern“ lädt sie herunter.';
      inhalt = `<form class="wp-tuer-form" data-tuer-form="anlegen" novalidate>${benutzer}`
        + feld('wp-passwort', 'passwort', 'Passwort', 'new-password', 'Mindestens 12 Zeichen. Ein Satz aus mehreren Wörtern ist leicht zu merken.')
        + feld('wp-passwort-2', 'wiederholung', 'Passwort wiederholen', 'new-password')
        + '<div class="wk-karte offen wp-verloren"><p><strong>Vergessen heißt verloren.</strong> Ohne das Passwort lässt sich die Datei nicht mehr öffnen. '
        + 'Niemand kann es zurücksetzen. Bitte im Passwort-Manager ablegen.</p></div>'
        + `<div class="wp-tuer-knoepfe"><button type="submit" class="wk-btn haupt"${s.arbeitet ? ' disabled' : ''}>Datei anlegen</button>`
        + `${knopf('zurueck', 'Zurück')}</div></form>`;
    } else {
      titel = 'Datendatei wählen';
      unter = 'Die Daten liegen nur verschlüsselt in einer Datei auf diesem Rechner. Sie verlassen ihn nie.';
      const kein = !T.moeglich();
      inhalt = ordner
        ? `<p>Wähle einen Ordner, zum Beispiel „Dokumente/Wartung“. Dort liegt die Datei ${D.DATEINAME}, daneben in „sicherung“ die letzten ${D.BEHALTEN} Stände. Gibt es die Datei noch nicht, legt der Wartungsplaner sie an.</p>`
          + `<div class="wp-tuer-knoepfe">${kein ? '' : knopf('ordner-waehlen', 'Ordner wählen', true)}</div>`
          + `<h2 class="wk-h3">Ohne Ordnerzugriff</h2><p class="wk-klein">Öffnen über den Datei-Dialog, Speichern lädt jedes Mal eine neue Datei herunter.</p>`
          + `<div class="wp-tuer-knoepfe">${kein ? '' : knopf('einzeln-oeffnen', 'Datei öffnen') + knopf('einzeln-neu', 'Neue Datei anlegen')}</div>`
        : (s.richtlinie ? '' : '<p class="wp-meldung hinweis">' + ui.pill('offen', 'Hinweis') + '<span>Dieser Browser kann nicht direkt in einen Ordner speichern. Öffnen geht über den Datei-Dialog, Speichern lädt jedes Mal eine neue Datei herunter.</span></p>')
          + `<div class="wp-tuer-knoepfe">${kein ? '' : knopf('einzeln-oeffnen', 'Datei öffnen', true) + knopf('einzeln-neu', 'Neue Datei anlegen')}</div>`;
    }
    return ui.kopf({ titel, unter })
      + `<div class="wp-koerper"><section class="wp-tuer wk-karte" aria-label="${esc(titel)}">${meldungHtml()}${inhalt}${arbeitet()}${dateiwahl}</section></div>`;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-tuer]');
    if (!el || s.offen) return;
    const a = el.dataset.tuer;
    if (a === 'ordner-waehlen') ordnerWaehlen();
    else if (a === 'freigeben') freigeben();
    else if (a === 'passwort') tuer('entsperren');
    else if (a === 'pin') tuer('pin');
    else if (a === 'einzeln-oeffnen') document.getElementById('wp-datei-wahl').click();
    else if (a === 'einzeln-neu') { s.weg = 'einzeln'; s.ordner = null; s.dateiName = ''; s.dateiText = null; vorrat = null; s.ungespeichert = false; tuer('anlegen'); }
    else if (a === 'zurueck') {
      if (s.ungespeichert && vorrat) return tuer('entsperren', { art: 'fehler', text: 'Erst entsperren und speichern, sonst gehen die ungespeicherten Änderungen verloren.' });
      s.weg = null; s.dateiText = null; vorrat = null; s.ungespeichert = false; pinSetzen(null);
      tuer('start');
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'wp-datei-wahl') dateiGewaehlt(e.target.files[0]);
  });
  document.addEventListener('submit', e => {
    const form = e.target.closest('[data-tuer-form]');
    if (!form) return;
    e.preventDefault();
    if (s.arbeitet) return;
    const leer = [...form.elements].find(el => el.required && !el.value);
    if (leer) { leer.setAttribute('aria-invalid', 'true'); leer.focus(); return; }
    const w = formular(form);
    if (form.dataset.tuerForm === 'entsperren') entsperren(w.passwort);
    else if (form.dataset.tuerForm === 'pin') entsperrenMitPin(w.pin);
    else anlegen(w.passwort, w.wiederholung);
  });

  function uebungSetzen(d) {
    if (d && !s.offen) throw new Error('Gesperrt: erst entsperren.');
    uebung = d || null;
    melden();
  }

  WK.sitzung = { starten, info, sperrbild, daten: daten_, aendern, uebung: uebungSetzen, speichern: speichernKnopf, sicherungErstellen, sicherungExport, dateiExport,
    passwortAendern, sperren, einstellungen, einstellungenSetzen, pinFestlegen, pinEntfernen, pinPruefen, ursache, MINUTEN, PIN_VERSUCHE };
})();
</script>
<script>
/* Wartungsplaner · Stammdaten: Helfer für die Ansichten Kunden, Vorlagen, Serien und Einstellungen (WP.form).
   Braucht ui-bausteine (WK.ui) und den Kern (WP.kern).

   Ansichten melden sich in WP.ansichten[name] an:
     inhalt(s, ctx)        HTML unter dem Kopf
     aktion?(s, ctx)       Text der Hauptaktion (sonst der aus ANSICHTEN in app.js)
     haupt?(s, ctx)        Hauptaktion ausführen
     objekt?(d, s)         Objekt, auf das sich data-pfad bezieht (Kunde, Vorlage, Serie …)
     klick?: { aktion(el, ctx) }, feld?(el, ctx) → true, wenn selbst erledigt, lokal?(el, ctx)
     nachher?(s, ctx)      nach dem Zeichnen (etwa die Gantt-Zeitleiste der Planung)
   ctx (aus app.js): { s, daten(), aendern(fn), gehe(pfad), neu() }

   Felder tragen data-pfad (relativ zum Objekt) und data-typ. app.js gibt change-Ereignisse an aendern() weiter.
   Listen im Objekt: Knopf data-aktion="reihe-hinzu" data-wert="<pfad>", Entfernen "reihe-weg" data-wert="<pfad>.<i>".
   Ids der Felder: wp-f-<pfad mit Bindestrichen>; zeichnen() hält darüber den Fokus. */
(function () {
  'use strict';
  const { ui } = WK;
  const esc = ui.esc;
  const WP = window.WP = window.WP || {};
  WP.ansichten = WP.ansichten || {};

  const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const WOCHENTAGE_LANG = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

  /** Fehlende Listen ergänzen (ältere Dateien, leere Datei). Ändert nichts Bestehendes. */
  function vollstaendig(d) {
    if (!d) return d;
    for (const k of ['kunden', 'vorlagen', 'varianten', 'serien', 'laeufe', 'releases']) if (!Array.isArray(d[k])) d[k] = [];
    if (!d.verfuegbarkeit || typeof d.verfuegbarkeit !== 'object') d.verfuegbarkeit = {};
    if (!Array.isArray(d.verfuegbarkeit.abwesenheiten)) d.verfuegbarkeit.abwesenheiten = [];
    return d;
  }

  // --- Ids -------------------------------------------------------------------------------------------------
  function kuerzel(text) {
    const s = String(text || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '');
    return s || 'neu';
  }
  /** Id aus einem Namen, eindeutig gegenüber den vorhandenen. */
  function neueId(text, vorhanden) {
    const belegt = new Set(vorhanden), b = kuerzel(text);
    let id = b;
    for (let i = 2; belegt.has(id); i++) id = `${b}-${i}`;
    return id;
  }
  const feldId = pfad => 'wp-f-' + String(pfad).replace(/[^A-Za-z0-9_-]+/g, '-');

  // --- Pfade -----------------------------------------------------------------------------------------------
  function holen(obj, pfad) { return String(pfad).split('.').reduce((o, t) => (o == null ? undefined : o[t]), obj); }
  function setzen(obj, pfad, wert) {
    const teile = String(pfad).split('.');
    let o = obj;
    for (let i = 0; i < teile.length - 1; i++) {
      if (o[teile[i]] == null) o[teile[i]] = /^\d+$/.test(teile[i + 1]) ? [] : {};
      o = o[teile[i]];
    }
    const l = teile[teile.length - 1];
    if (wert === undefined) delete o[l]; else o[l] = wert;
  }

  /** Wert eines Felds nach data-typ. undefined = Angabe entfällt. FEHLT = Pflichtfeld leer. */
  const FEHLT = Symbol('fehlt');
  function wert(el, alt) {
    const t = el.dataset.typ || 'text', v = String(el.value ?? '').trim();
    if (t === 'an') return el.checked ? true : undefined;
    if (t === 'erlaubt') return el.checked ? false : undefined;          // freeze: false = darf im Freeze liegen
    if (t === 'tag') {
      const tage = new Set(Array.isArray(alt) ? alt : []), n = Number(el.dataset.tag);
      if (el.checked) tage.add(n); else tage.delete(n);
      return [...tage].sort((a, b) => a - b);
    }
    if (t === 'pflicht') return v || FEHLT;
    if (t === 'zahl') {
      if (v === '') return undefined;
      const n = Math.trunc(Number(v.replace(',', '.').replace('−', '-')));
      return Number.isFinite(n) ? n : undefined;
    }
    if (t === 'zahlwahl') return v === '' ? undefined : (Number.isFinite(Number(v)) ? Number(v) : v);
    return v === '' ? undefined : v;
  }

  // --- Felder als HTML -------------------------------------------------------------------------------------
  const attr = (pfad, typ) => `id="${feldId(pfad)}" data-pfad="${esc(pfad)}" data-typ="${esc(typ)}"`;
  /** Eingabefeld mit Beschriftung. art: text | date | time | number. */
  function feld({ label, pfad, wert: w, typ = 'text', art = 'text', klasse = '', extra = '', hinweis = '' }) {
    return `<label class="wp-feld ${klasse}" for="${feldId(pfad)}"><span>${esc(label)}</span>`
      + `<input class="wk-feld" ${attr(pfad, typ)} type="${art}" value="${esc(w ?? '')}"${extra}>`
      + (hinweis ? `<small class="wp-feld-hinweis">${hinweis}</small>` : '') + '</label>';
  }
  /** Auswahl. optionen: [[wert, text]] oder [{ gruppe, optionen }]. */
  function wahl({ label, pfad, wert: w, optionen, typ = 'wahl', klasse = '', hinweis = '' }) {
    const opt = o => `<option value="${esc(o[0])}"${String(o[0]) === String(w ?? '') ? ' selected' : ''}>${esc(o[1])}</option>`;
    const html = optionen.map(o => (Array.isArray(o) ? opt(o)
      : (o.optionen.length ? `<optgroup label="${esc(o.gruppe)}">${o.optionen.map(opt).join('')}</optgroup>` : ''))).join('');
    return `<label class="wp-feld ${klasse}" for="${feldId(pfad)}"><span>${esc(label)}</span>`
      + `<select class="wk-feld" ${attr(pfad, typ)}>${html}</select>`
      + (hinweis ? `<small class="wp-feld-hinweis">${hinweis}</small>` : '') + '</label>';
  }
  /** Kontrollkästchen. typ 'an' (true/entfällt) oder 'erlaubt' (false/entfällt). */
  function haken({ label, pfad, an, typ = 'an', klasse = '', hinweis = '' }) {
    return `<label class="wp-haken ${klasse}" for="${feldId(pfad)}"><input type="checkbox" ${attr(pfad, typ)}${an ? ' checked' : ''}>`
      + `<span>${esc(label)}</span>${hinweis ? `<small class="wp-feld-hinweis">${hinweis}</small>` : ''}</label>`;
  }
  /** Mehrzeiliges Feld (Notizen). */
  function notiz({ label, pfad, wert: w, klasse = '', hinweis = '' }) {
    return `<label class="wp-feld ${klasse}" for="${feldId(pfad)}"><span>${esc(label)}</span>`
      + `<textarea class="wk-feld wp-notiz" ${attr(pfad, 'text')} rows="5">${esc(w ?? '')}</textarea>`
      + (hinweis ? `<small class="wp-feld-hinweis">${hinweis}</small>` : '') + '</label>';
  }
  /* Zeichen eines Kunden: sein Logo (nur Rasterbild als data:, so legt es der Upload ab) oder die Initialen.
     Dient dem schnellen Wiedererkennen; der Name steht immer daneben, deshalb alt="". */
  const LOGO = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
  function kundeZeichen(k, klasse = '') {
    if (!k) return '';
    if (k.logo && LOGO.test(k.logo)) return `<img class="wp-kunde-zeichen ${klasse}" src="${k.logo}" alt="">`;
    const init = String(k.name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
    return `<span class="wp-kunde-zeichen wp-kunde-initialen ${klasse}" aria-hidden="true">${esc(init)}</span>`;
  }
  /** Wochentage als Kästchen (Mo–So), Wert ist die Liste der Tage. */
  function tage({ label, pfad, wert: w }) {
    const an = new Set(w || []);
    return `<fieldset class="wp-tage"><legend>${esc(label)}</legend>` + [1, 2, 3, 4, 5, 6, 7].map(t =>
      `<label class="wp-haken" for="${feldId(pfad + '.' + t)}"><input type="checkbox" id="${feldId(pfad + '.' + t)}" data-pfad="${esc(pfad)}" data-typ="tag" data-tag="${t}"${an.has(t) ? ' checked' : ''}>`
      + `<span title="${WOCHENTAGE_LANG[t]}">${WP.kern.WOCHENTAGE[t]}</span></label>`).join('') + '</fieldset>';
  }
  const knopf = (text, aktion, wert, klasse = '', symbol = '') =>
    `<button type="button" class="wk-btn klein ${klasse}" data-aktion="${esc(aktion)}"${wert != null ? ` data-wert="${esc(wert)}"` : ''}>`
    + `${symbol ? `<svg class="wp-sym" aria-hidden="true"><use href="#i-${esc(symbol)}"/></svg><span>${esc(text)}</span>` : esc(text)}</button>`;

  /** Liste von Einträgen mit Feldern je Zeile, Entfernen und Hinzufügen.
      felder: [{ feld, label, art, typ }] (art auch 'tage', 'haken' und 'wahl' mit optionen), pruefen(eintrag) → HTML einer Status-Pill oder ''. */
  function reihen({ pfad, eintraege, felder, hinzu, leer, pruefen }) {
    const zeilen = (eintraege || []).map((e, i) => `<li class="wp-reihe">`
      + felder.map(f => (f.art === 'tage' ? tage({ label: f.label, pfad: `${pfad}.${i}.${f.feld}`, wert: e[f.feld] })
        : f.art === 'haken' ? haken({ label: f.label, pfad: `${pfad}.${i}.${f.feld}`, an: !!e[f.feld] })
        : f.art === 'wahl' ? wahl({ label: f.label, pfad: `${pfad}.${i}.${f.feld}`, wert: e[f.feld] ?? '', optionen: f.optionen, klasse: f.klasse || '' })
        : feld({ label: f.label, pfad: `${pfad}.${i}.${f.feld}`, wert: e[f.feld], art: f.art, typ: f.typ, klasse: f.klasse || '' }))).join('')
      + `<div class="wp-reihe-ende">${pruefen ? pruefen(e) : ''}${knopf('Entfernen', 'reihe-weg', `${pfad}.${i}`)}</div></li>`).join('');
    return (zeilen ? `<ul class="wp-reihen">${zeilen}</ul>` : `<p class="wk-klein wp-leise">${esc(leer)}</p>`)
      + `<div class="wp-knoepfe">${knopf(hinzu, 'reihe-hinzu', pfad)}</div>`;
  }

  /** Zeitraum prüfen: Status als Symbol plus Wort. */
  function zeitraumPill(e) {
    if (!e.von || !e.bis) return ui.pill('offen', 'Unvollständig');
    if (e.bis < e.von) return ui.pill('fehler', 'Bis liegt vor Von');
    return '';
  }

  // --- Anzeige ---------------------------------------------------------------------------------------------
  /** 'JJJJ-MM-TT' → 'Fr 15.1.2027' */
  function tag(d) {
    if (!d) return '–';
    return `${WP.kern.WOCHENTAGE[WP.kern.wochentag(d)]} ${+d.slice(8, 10)}.${+d.slice(5, 7)}.${d.slice(0, 4)}`;
  }
  const heute = () => { const j = new Date(); return new Date(j.getTime() - j.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const mehrzahl = (n, eins, viele) => `${n} ${n === 1 ? eins : viele}`;

  /** Kopf eines Bearbeitungsbereichs: H2 (Fokusziel nach der Wahl) und Knöpfe. */
  function editorKopf(titel, knoepfe = '', unter = '') {
    return `<div class="wp-editor-kopf"><div><h2 class="wk-h2" id="wp-bearbeiten" tabindex="-1">${esc(titel)}</h2>${unter}</div>`
      + (knoepfe ? `<div class="wp-knoepfe">${knoepfe}</div>` : '') + '</div>';
  }
  /** Tabelle mit Kopf; zeilen ist fertiges HTML (<tr>…). */
  function tabelle(titel, spalten, zeilen, leer, kopfKnoepfe = '') {
    return `<section class="wp-abschnitt"><div class="wp-abschnitt-kopf"><h2 class="wk-h2">${esc(titel)}</h2>${kopfKnoepfe}</div>`
      + `<div class="wp-tabelle-rahmen" role="region" aria-label="${esc(titel)}" tabindex="0" data-scroll="${esc(titel)}">`
      + `<table class="wp-tabelle"><thead><tr>${spalten.map(s => `<th scope="col">${esc(s)}</th>`).join('')}</tr></thead>`
      + `<tbody>${zeilen || `<tr><td class="wp-leer" colspan="${spalten.length}">${esc(leer)}</td></tr>`}</tbody></table></div></section>`;
  }
  const verweis = (href, text, aktuell) => `<a href="${esc(href)}"${aktuell ? ' aria-current="true"' : ''}>${esc(text)}</a>`;

  // --- Ereignisse (aus app.js) -----------------------------------------------------------------------------
  /** Feld geändert: an den Pfad des Objekts der Ansicht schreiben. */
  function geaendert(el, ctx, A) {
    if (A.feld && A.feld(el, ctx)) return;
    if (!A.objekt) return;
    const pfad = el.dataset.pfad, alt = holen(A.objekt(ctx.daten(), ctx.s), pfad);
    const w = wert(el, alt);
    if (w === FEHLT) {
      ui.toast(`${el.closest('label')?.querySelector('span')?.textContent || 'Angabe'} fehlt. Bitte etwas eintragen.`, { dauer: 5000 });
      ctx.neu();
      return;
    }
    if (JSON.stringify(w) === JSON.stringify(alt)) return;
    ctx.aendern(d => { setzen(A.objekt(d, ctx.s), pfad, w); });
  }

  /** Listenknöpfe: Eintrag hinzufügen (Fokus aufs erste Feld) oder entfernen (Fokus auf „hinzufügen“). */
  function klick(aktion, el, ctx, A) {
    if (aktion === 'reihe-hinzu' && A.objekt) {
      const pfad = el.dataset.wert;
      let i = 0;
      ctx.aendern(d => {
        const o = A.objekt(d, ctx.s);
        if (!Array.isArray(holen(o, pfad))) setzen(o, pfad, []);
        const liste = holen(o, pfad);
        liste.push(A.neu && A.neu[pfad] ? A.neu[pfad](d, o) : {});
        i = liste.length - 1;
      });
      const erstes = document.querySelector(`#inhalt [data-pfad^="${CSS.escape(pfad + '.' + i + '.')}"]`);
      if (erstes) erstes.focus();
      ui.toast(el.textContent.replace('hinzufügen', 'hinzugefügt'));
      return true;
    }
    if (aktion === 'reihe-weg' && A.objekt) {
      const teile = el.dataset.wert.split('.'), i = Number(teile.pop()), pfad = teile.join('.');
      ctx.aendern(d => { holen(A.objekt(d, ctx.s), pfad).splice(i, 1); });
      if (!document.activeElement || document.activeElement === document.body) {
        document.querySelector(`#inhalt [data-aktion="reihe-hinzu"][data-wert="${CSS.escape(pfad)}"]`)?.focus();
      }
      ui.toast('Entfernt');
      return true;
    }
    return false;
  }

  WP.form = { MONATE, WOCHENTAGE_LANG, FEHLT, LOGO, vollstaendig, kuerzel, neueId, feldId, holen, setzen, wert, feld, wahl, haken, notiz, kundeZeichen,
    tage, knopf, reihen, zeitraumPill, tag, heute, mehrzahl, editorKopf, tabelle, verweis, geaendert, klick };
})();
</script>
<script>
/* Wartungsplaner · Ansicht Kunden/Projekte: Liste, Kunde mit „Auf einen Blick“ (Kalender, Freeze, Wartungsfenster,
   eigene Regeln), Regeln, Ansprechpartnern, Projekten, Wartungen des Kunden (Filter, Sortierung) und Kundenkalender
   (Bundesland, Feiertage als Vorschlag oder eigene Liste, Freeze, Wartungsfenster). Braucht WP.form und WP.kern,
   für die Wartungen WP.plan (zur Laufzeit). Regeln und Ansprechpartner sind optionale Listen am Kunden, Notiz (Text)
   und Logo (kleines Rasterbild als data:, siehe logoLaden) optionale Angaben. Die Liste lässt sich durchsuchen und
   sortieren (Standard: Name A–Z). */
(function () {
  'use strict';
  const { ui } = WK, esc = ui.esc, F = WP.form, K = WP.kern;
  const LISTE_JAHRE = 3;                 // „Liste übernehmen“ übernimmt das gezeigte Jahr und die beiden folgenden
  const lokal = { jahr: null, wprojekt: '', wstatus: 'alle', wsort: 'anker-auf', ksuche: '', ksort: 'name-auf' };
  const LOGO_MAX = 256, LOGO_DATEI_MAX = 5 * 1024 * 1024;   // Kante in px nach dem Verkleinern, Größe der gewählten Datei
  const KSORT = [['name-auf', 'Name A–Z'], ['name-ab', 'Name Z–A'], ['wartungen', 'Meiste Wartungen'], ['naechster', 'Nächster Termin']];
  const MAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  const kundeVon = (d, id) => d.kunden.find(k => k.id === id) || null;
  const fensterText = f => `${(f.tage || []).map(t => K.WOCHENTAGE[t]).join(', ') || 'keine Tage'} ${f.von || '?'}–${f.bis || '?'}`;

  const vergleich = new Intl.Collator('de', { sensitivity: 'base', numeric: true }).compare;
  /** Kunden nach Suche (Name, Projekte, Regeln, Ansprechpartner, Notiz) und Sortierung. */
  function gefiltert(d) {
    const such = lokal.ksuche.trim().toLowerCase(), heute = F.heute();
    const text = k => [k.name, ...(k.projekte || []).map(p => p.name), ...(k.regeln || []).map(r => r.text),
      ...(k.ansprechpartner || []).map(a => `${a.name || ''} ${a.rolle || ''} ${a.mail || ''}`), k.notiz].filter(Boolean).join(' ').toLowerCase();
    const wartungen = k => d.laeufe.filter(l => l.kunde === k.id);
    const naechster = k => wartungen(k).flatMap(l => l.termine).filter(t => !t.erledigt && t.ende >= heute).map(t => t.start).sort()[0] || '9999';
    const liste = d.kunden.filter(k => !such || text(k).includes(such));
    const name = (a, b) => vergleich(a.name || '', b.name || '');
    const ordnung = {
      'name-auf': name, 'name-ab': (a, b) => name(b, a),
      wartungen: (a, b) => wartungen(b).length - wartungen(a).length || name(a, b),
      naechster: (a, b) => (naechster(a) < naechster(b) ? -1 : naechster(a) > naechster(b) ? 1 : name(a, b)),
    }[lokal.ksort] || name;
    return liste.sort(ordnung);
  }

  function liste(d, s) {
    const auswahl = gefiltert(d);
    const kopf = d.kunden.length > 1 ? `<div class="wp-felder wp-filter" role="search" aria-label="Kunden">`
      + F.feld({ label: 'Suchen', pfad: 'lokal.ksuche', wert: lokal.ksuche, typ: 'lokal', art: 'search', klasse: 'breit',
        hinweis: 'Name, Projekt, Regel, Ansprechpartner oder Notiz. Enter sucht.' })
      + F.wahl({ label: 'Sortieren', pfad: 'lokal.ksort', wert: lokal.ksort, typ: 'lokal', optionen: KSORT })
      + (lokal.ksuche ? `<p class="wk-klein wp-leise wp-treffer">${esc(F.mehrzahl(auswahl.length, 'Treffer', 'Treffer'))} von ${d.kunden.length}</p>` : '')
      + '</div>' : '';
    const zeilen = auswahl.map(k => {
      const kal = k.kalender || {};
      return `<tr><td><span class="wp-mit-zeichen">${F.kundeZeichen(k, 'klein')}${F.verweis('#/kunden/' + encodeURIComponent(k.id), k.name || 'Ohne Namen', k.id === s.teil)}</span></td>`
        + `<td>${esc((k.projekte || []).map(p => p.name).join(', ') || '–')}</td>`
        + `<td>${esc(K.BUNDESLAENDER[kal.bundesland] || '–')}</td>`
        + `<td>${esc(Array.isArray(kal.feiertage) ? 'eigene Liste' : 'Vorschlag')}</td>`
        + `<td>${esc((kal.freeze || []).length ? F.mehrzahl(kal.freeze.length, 'Zeitraum', 'Zeiträume') : '–')}</td>`
        + `<td>${esc((kal.wartungsfenster || []).map(fensterText).join('; ') || '–')}</td>`
        + `<td>${esc((k.regeln || []).length ? F.mehrzahl(k.regeln.length, 'Regel', 'Regeln') : '–')}</td>`
        + `<td>${esc(String(d.laeufe.filter(l => l.kunde === k.id).length))}</td></tr>`;
    }).join('');
    return kopf + F.tabelle('Kunden', ['Kunde', 'Projekte', 'Bundesland', 'Feiertage', 'Freeze', 'Wartungsfenster', 'Besonderheiten', 'Wartungen'], zeilen,
      d.kunden.length ? 'Kein Kunde passt zur Suche.' : 'Noch keine Kunden. Mit „Kunde anlegen“ legst Du den ersten an.');
  }

  function feiertage(k) {
    const kal = k.kalender || {};
    const jahr = lokal.jahr || +F.heute().slice(0, 4) + 1;
    if (!Array.isArray(kal.feiertage)) {
      const vorschlag = K.feiertageVorschlag(jahr, kal.bundesland);
      const jahre = [0, 1, 2, 3, 4].map(i => jahr - 1 + i);
      return `<div class="wk-karte vorschlag wp-block">`
        + `<div class="wp-block-kopf">${ui.pill('vorschlag', 'Vorschlag aus dem Bundesland')}`
        + F.wahl({ label: 'Jahr', pfad: 'lokal.jahr', wert: jahr, optionen: jahre.map(j => [j, String(j)]), typ: 'lokal' }) + '</div>'
        + `<p class="wk-klein wp-leise">Gesetzliche Feiertage ${kal.bundesland ? 'in ' + esc(K.BUNDESLAENDER[kal.bundesland]) : 'bundesweit'}. Sie gelten in jedem Jahr. Örtliche Feiertage fehlen: Dafür die Liste übernehmen und ergänzen.</p>`
        + `<ul class="wp-tageliste">${vorschlag.map(f => `<li><span>${esc(F.tag(f.datum))}</span>${esc(f.name)}</li>`).join('')}</ul>`
        + `<div class="wp-knoepfe">${F.knopf('Liste übernehmen', 'feiertage-uebernehmen', jahr)}</div>`
        + `<p class="wk-klein wp-leise">Übernimmt ${jahr} bis ${jahr + LISTE_JAHRE - 1}. Danach gilt nur die eigene Liste.</p></div>`;
    }
    const sortiert = kal.feiertage.map((f, i) => ({ f, i })).sort((a, b) => String(a.f.datum || '9').localeCompare(String(b.f.datum || '9')));
    const zeilen = sortiert.map(({ f, i }) => `<li class="wp-reihe">`
      + F.feld({ label: 'Datum', pfad: `kalender.feiertage.${i}.datum`, wert: f.datum, art: 'date' })
      + F.feld({ label: 'Name', pfad: `kalender.feiertage.${i}.name`, wert: f.name, klasse: 'breit' })
      + `<div class="wp-reihe-ende">${f.datum ? '' : ui.pill('offen', 'Unvollständig')}${F.knopf('Entfernen', 'reihe-weg', `kalender.feiertage.${i}`)}</div></li>`).join('');
    return `<div class="wk-karte entschieden wp-block">`
      + `<div class="wp-block-kopf">${ui.pill('entschieden', 'Eigene Liste')}</div>`
      + `<p class="wk-klein wp-leise">Nur diese Tage gelten als Feiertag, in jedem Jahr. ${F.mehrzahl(kal.feiertage.length, 'Eintrag', 'Einträge')}.</p>`
      + (zeilen ? `<ul class="wp-reihen">${zeilen}</ul>` : '')
      + `<div class="wp-knoepfe">${F.knopf('Feiertag hinzufügen', 'reihe-hinzu', 'kalender.feiertage')}`
      + `${F.knopf('Auf Vorschlag zurücksetzen', 'feiertage-zuruecksetzen')}</div></div>`;
  }

  /** Auf einen Blick: was bei diesem Kunden anders ist (Kalender, Freeze ab heute, Wartungsfenster, eigene Regeln). */
  function aufEinenBlick(d, k) {
    const kal = k.kalender || {}, heute = F.heute();
    const freeze = (kal.freeze || []).filter(f => f.von && f.bis && f.bis >= heute).sort((a, b) => (a.von < b.von ? -1 : 1));
    const zeilen = [
      ['Kalender', `${kal.bundesland ? esc(K.BUNDESLAENDER[kal.bundesland]) : 'Bundesweite Feiertage'} · ${Array.isArray(kal.feiertage) ? 'eigene Feiertagsliste' : 'Feiertage als Vorschlag'}`],
      ['Freeze', freeze.length ? freeze.map(f => esc(`${f.name ? f.name + ': ' : ''}${F.tag(f.von)} – ${F.tag(f.bis)}`)).join('<br>') : 'Kein Freeze ab heute'],
      ['Wartungsfenster', (kal.wartungsfenster || []).length ? esc(kal.wartungsfenster.map(fensterText).join('; ')) : 'Keins: Schritte „im Wartungsfenster“ finden keinen Tag'],
      ['Ansprechpartner', (k.ansprechpartner || []).filter(a => a.name).map(a => esc(a.name + (a.rolle ? ` (${a.rolle})` : ''))).join(', ') || 'Noch niemand eingetragen'],
    ];
    const regeln = (k.regeln || []).filter(r => r.text);
    return `<div class="wk-karte wp-blick" role="region" aria-label="Auf einen Blick"><h3 class="wk-h3 wp-mit-zeichen">${F.kundeZeichen(k, 'gross')}<span>Auf einen Blick</span></h3>`
      + `<dl class="wp-angaben">${zeilen.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join('')}</dl>`
      + (regeln.length ? `<ul class="wp-regeln">${regeln.map(r => `<li>${r.wichtig ? ui.pill('offen', 'Wichtig') + ' ' : ''}${esc(r.text)}</li>`).join('')}</ul>`
        : '<p class="wk-klein wp-leise">Keine eigenen Regeln. Unten unter „Besonderheiten und Regeln“ eintragen.</p>')
      + '</div>';
  }

  /** Status eines Laufs: Erledigt, Konflikt (offene Schritte mit Konflikt) oder Geplant. */
  function laufStatus(l) {
    if (l.termine.every(t => t.erledigt)) return 'erledigt';
    return l.termine.some(t => !t.erledigt && t.konflikte.length) ? 'konflikt' : 'geplant';
  }
  const STATUS = { geplant: ['entschieden', 'Geplant'], konflikt: ['fehler', 'Konflikt'], erledigt: ['erfolg', 'Erledigt'] };

  /** Wartungen dieses Kunden: filtern nach Projekt und Status, sortieren nach Anker oder nächstem Schritt. */
  function wartungen(d, k) {
    const P = WP.plan, alle = d.laeufe.filter(l => l.kunde === k.id);
    const kopf = `<h3 class="wk-h3" id="wp-wartungen">Wartungen</h3>`;
    if (!alle.length) return kopf + '<p class="wk-klein wp-leise">Noch keine Wartung für diesen Kunden. In der Planung legt „Wartung planen“ eine an.</p>';
    if (lokal.wprojekt && !(k.projekte || []).some(p => p.id === lokal.wprojekt)) lokal.wprojekt = '';
    const naechster = l => l.termine.filter(t => !t.erledigt).sort((a, b) => (a.start < b.start ? -1 : 1))[0] || null;
    const vergleich = {
      'anker-auf': (a, b) => (a.anker < b.anker ? -1 : a.anker > b.anker ? 1 : 0),
      'anker-ab': (a, b) => (a.anker > b.anker ? -1 : a.anker < b.anker ? 1 : 0),
      naechster: (a, b) => ((naechster(a) || { start: '9' }).start < (naechster(b) || { start: '9' }).start ? -1 : 1),
    };
    const liste = alle.filter(l => (!lokal.wprojekt || l.projekt === lokal.wprojekt) && (lokal.wstatus === 'alle'
      || (lokal.wstatus === 'offen' ? laufStatus(l) !== 'erledigt' : laufStatus(l) === lokal.wstatus))).sort(vergleich[lokal.wsort] || vergleich['anker-auf']);
    const projektName = id => ((k.projekte || []).find(p => p.id === id) || {}).name || '–';
    const zeilen = liste.map(l => {
      const st = STATUS[laufStatus(l)], n = naechster(l), fertig = l.termine.filter(t => t.erledigt).length;
      return `<tr><td>${ui.pill(st[0], st[1])}</td>`
        + `<td><button type="button" class="wp-verweis" data-aktion="wartung-oeffnen" data-wert="${esc(l.id)}">${esc(P.laufName(d, l))}</button></td>`
        + `<td>${esc(projektName(l.projekt))}</td><td>${esc(`${fertig} von ${l.termine.length}`)}</td>`
        + `<td>${n ? esc(`${n.titel} · ${F.tag(n.start)}`) : '–'}</td></tr>`;
    }).join('');
    return kopf
      + `<div class="wp-felder wp-filter" role="group" aria-label="Wartungen filtern und sortieren">`
      + F.wahl({ label: 'Projekt', pfad: 'lokal.wprojekt', wert: lokal.wprojekt, typ: 'lokal', optionen: [['', 'Alle Projekte'], ...(k.projekte || []).map(p => [p.id, p.name])] })
      + F.wahl({ label: 'Status', pfad: 'lokal.wstatus', wert: lokal.wstatus, typ: 'lokal',
        optionen: [['alle', 'Alle'], ['offen', 'Offen (geplant oder Konflikt)'], ['konflikt', 'Mit Konflikt'], ['erledigt', 'Erledigt']] })
      + F.wahl({ label: 'Sortieren', pfad: 'lokal.wsort', wert: lokal.wsort, typ: 'lokal',
        optionen: [['anker-auf', 'Anker, früheste zuerst'], ['anker-ab', 'Anker, späteste zuerst'], ['naechster', 'Nächster offener Schritt']] })
      + '</div>'
      + `<div class="wp-tabelle-rahmen" role="region" aria-label="Wartungen von ${esc(k.name || '')}" tabindex="0" data-scroll="wartungen">`
      + `<table class="wp-tabelle"><thead><tr>${['Status', 'Wartung', 'Projekt', 'Erledigt', 'Nächster Schritt'].map(s => `<th scope="col">${s}</th>`).join('')}</tr></thead>`
      + `<tbody>${zeilen || `<tr><td class="wp-leer" colspan="5">Keine Wartung passt zum Filter.</td></tr>`}</tbody></table></div>`;
  }

  const mailKnopf = a => (a.mail ? (MAIL.test(a.mail) ? `<a class="wk-btn klein" href="mailto:${esc(a.mail)}">Mail schreiben</a>` : ui.pill('offen', 'Mail prüfen')) : '');

  /** Logo: Vorschau, wählen (PNG, JPG, WebP oder SVG), entfernen. Es erscheint überall, wo der Kunde steht. */
  function logoAbschnitt(k) {
    const da = k.logo && F.LOGO.test(k.logo);
    return `<h4 class="wp-h4">Logo</h4><div class="wp-logo-wahl">${F.kundeZeichen(k, 'vorschau')}`
      + `<div class="wp-logo-text"><p class="wk-klein wp-leise">${da ? 'Erscheint in Liste, Übersicht, Kalender, Planung und im Übersichtsplan.'
        : 'Ohne Logo stehen die Initialen da. Ein Logo macht den Kunden überall schneller erkennbar.'}</p>`
      + `<div class="wp-knoepfe"><label class="wk-btn klein wp-datei-knopf"><svg class="wp-sym" aria-hidden="true"><use href="#i-hochladen"/></svg><span>${da ? 'Anderes Logo wählen' : 'Logo wählen'}</span>`
      + `<input type="file" class="wp-datei-feld" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-pfad="lokal.logo" data-typ="lokal" id="wp-f-logo"></label>`
      + (da ? F.knopf('Logo entfernen', 'logo-entfernen', null, '', 'papierkorb') : '') + '</div></div></div>';
  }

  /** Bild lesen, auf höchstens LOGO_MAX px verkleinern und als PNG (data:) am Kunden ablegen. Nur Rasterbild, damit
      ein SVG kein Skript oder Verweis in die Datei trägt; CSP erlaubt Bilder nur als data:. */
  async function logoLaden(datei, ctx) {
    if (!datei) return;
    if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(datei.type)) { ui.toast('Bitte ein Bild als PNG, JPG, WebP oder SVG wählen.', { dauer: 6000 }); return; }
    if (datei.size > LOGO_DATEI_MAX) { ui.toast('Das Bild ist größer als 5 MB. Bitte ein kleineres wählen.', { dauer: 6000 }); return; }
    try {
      const url = await new Promise((ja, nein) => { const r = new FileReader(); r.onload = () => ja(r.result); r.onerror = () => nein(r.error); r.readAsDataURL(datei); });
      const bild = await new Promise((ja, nein) => { const b = new Image(); b.onload = () => ja(b); b.onerror = () => nein(new Error('Bild nicht lesbar')); b.src = url; });
      const b0 = bild.naturalWidth || LOGO_MAX, h0 = bild.naturalHeight || LOGO_MAX, f = Math.min(1, LOGO_MAX / Math.max(b0, h0));
      const leinwand = document.createElement('canvas');
      leinwand.width = Math.max(1, Math.round(b0 * f)); leinwand.height = Math.max(1, Math.round(h0 * f));
      leinwand.getContext('2d').drawImage(bild, 0, 0, leinwand.width, leinwand.height);
      const logo = leinwand.toDataURL('image/png');
      if (!F.LOGO.test(logo)) throw new Error('Bild nicht lesbar');
      ctx.aendern(d => { kundeVon(d, ctx.s.teil).logo = logo; });
      ui.toast('Logo übernommen', { art: 'erfolg' });
    } catch (e) {
      ui.toast('Logo nicht übernommen. Das Bild ließ sich nicht lesen.', { dauer: 6000 });
    }
  }

  function editor(d, k) {
    const kal = k.kalender || {};
    const projekte = (k.projekte || []).map((p, i) => `<li class="wp-reihe">`
      + F.feld({ label: 'Projekt', pfad: `projekte.${i}.name`, wert: p.name, typ: 'pflicht', klasse: 'breit' })
      + `<div class="wp-reihe-ende">${p.name ? F.knopf('Kopieren', 'projekt-kopieren', i, '', 'kopie') : ''}${F.knopf('Entfernen', 'projekt-entfernen', i)}</div></li>`).join('');
    // Raster in Gruppen: breit drei Spalten, mittel zwei, schmal eine (Container-Abfrage in app.css)
    const gruppe = (inhalt, klasse = '') => `<div class="wp-gruppe${klasse ? ' ' + klasse : ''}">${inhalt}</div>`;
    return `<section class="wp-abschnitt wp-editor" aria-labelledby="wp-bearbeiten">`
      + F.editorKopf(k.name || 'Ohne Namen', F.knopf('Kunde löschen', 'kunde-loeschen'))
      + aufEinenBlick(d, k)
      + '<div class="wp-gruppen">'
      + gruppe(`<h3 class="wk-h3">Name und Logo</h3><div class="wp-felder">${F.feld({ label: 'Name', pfad: 'name', wert: k.name, typ: 'pflicht', klasse: 'voll' })}</div>`
        + logoAbschnitt(k))
      + gruppe(`<h3 class="wk-h3">Notizen</h3>`
        + `<div class="wp-felder">${F.notiz({ label: 'Notizen zu diesem Kunden', pfad: 'notiz', wert: k.notiz, klasse: 'voll' })}</div>`, 'weit')
      + gruppe(`<h3 class="wk-h3">Besonderheiten und Regeln</h3>`
        + '<p class="wk-klein wp-leise">Was bei diesem Kunden anders läuft, zum Beispiel „Ankündigung 5 Arbeitstage vorher“ oder „Freigabe nur durch die IT-Leitung“.</p>'
        + F.reihen({ pfad: 'regeln', eintraege: k.regeln, hinzu: 'Regel hinzufügen', leer: 'Keine eigenen Regeln.',
          felder: [{ feld: 'text', label: 'Regel', klasse: 'breit' }, { feld: 'wichtig', label: 'Wichtig', art: 'haken' }] }))
      + gruppe(`<h3 class="wk-h3">Ansprechpartner</h3>`
        + F.reihen({ pfad: 'ansprechpartner', eintraege: k.ansprechpartner, hinzu: 'Ansprechpartner hinzufügen', leer: 'Noch niemand eingetragen.',
          pruefen: mailKnopf, felder: [{ feld: 'name', label: 'Name', klasse: 'breit' }, { feld: 'rolle', label: 'Rolle' },
            { feld: 'mail', label: 'Mail', art: 'email', klasse: 'breit' }, { feld: 'telefon', label: 'Telefon', art: 'tel' }] }))
      + gruppe(`<h3 class="wk-h3">Projekte</h3>`
        + (projekte ? `<ul class="wp-reihen">${projekte}</ul>` : '<p class="wk-klein wp-leise">Noch keine Projekte. Serien gehören zu einem Projekt.</p>')
        + `<div class="wp-knoepfe">${F.knopf('Projekt hinzufügen', 'reihe-hinzu', 'projekte')}</div>`)
      + gruppe(wartungen(d, k), 'voll')
      + gruppe(`<h3 class="wk-h3">Kalender</h3>`
        + `<div class="wp-felder">${F.wahl({ label: 'Bundesland', pfad: 'kalender.bundesland', wert: kal.bundesland,
          optionen: [['', 'Keins (nur bundesweite Feiertage)'], ...Object.entries(K.BUNDESLAENDER)], klasse: 'voll' })}</div>`
        + `<h4 class="wp-h4">Feiertage</h4>${feiertage(k)}`, 'weit')
      + gruppe(`<h3 class="wk-h3">Freeze</h3><p class="wk-klein wp-leise">In diesen Zeiträumen liegt kein Schritt, außer er darf es.</p>`
        + F.reihen({ pfad: 'kalender.freeze', eintraege: kal.freeze, hinzu: 'Freeze hinzufügen', leer: 'Kein Freeze.',
          pruefen: F.zeitraumPill, felder: [{ feld: 'von', label: 'Von', art: 'date' }, { feld: 'bis', label: 'Bis', art: 'date' },
            { feld: 'name', label: 'Name', klasse: 'breit' }] })
        + `<h3 class="wk-h3">Wartungsfenster</h3><p class="wk-klein wp-leise">Schritte „im Wartungsfenster“ liegen nur an diesen Tagen. Sie zählen in Fenstertagen.</p>`
        + F.reihen({ pfad: 'kalender.wartungsfenster', eintraege: kal.wartungsfenster, hinzu: 'Wartungsfenster hinzufügen',
          leer: 'Kein Wartungsfenster.', pruefen: f => ((f.tage || []).length && f.von && f.bis ? '' : ui.pill('offen', 'Unvollständig')),
          felder: [{ feld: 'tage', label: 'Tage', art: 'tage' }, { feld: 'von', label: 'Von', art: 'time' }, { feld: 'bis', label: 'Bis', art: 'time' }] }))
      + '</div>'
      + '</section>';
  }

  async function anlegen(ctx) {
    const w = await ui.frage({ titel: 'Kunde anlegen', ja: 'Kunde anlegen', felder: [
      { name: 'name', label: 'Name', pflicht: true }, { name: 'projekt', label: 'Erstes Projekt (kann leer bleiben)' }] });
    if (!w) return;
    let id;
    ctx.aendern(d => {
      id = F.neueId(w.name, d.kunden.map(k => k.id));
      const projekte = w.projekt.trim() ? [{ id: F.neueId(w.projekt, []), name: w.projekt.trim() }] : [];
      d.kunden.push({ id, name: w.name.trim(), projekte, kalender: { freeze: [], wartungsfenster: [] } });
    });
    ctx.gehe('/kunden/' + encodeURIComponent(id));
    ui.toast('Kunde angelegt', { art: 'erfolg' });
  }

  WP.ansichten.kunden = {
    inhalt(s, ctx) {
      const d = ctx.daten(), k = s.teil && kundeVon(d, s.teil);
      return liste(d, s) + (k ? editor(d, k) : (d.kunden.length ? '<p class="wk-klein wp-leise">Einen Kunden in der Liste wählen, um ihn zu bearbeiten.</p>' : ''));
    },
    haupt: (s, ctx) => anlegen(ctx),
    objekt: (d, s) => kundeVon(d, s.teil),
    neu: {
      projekte: (d, k) => ({ id: F.neueId('projekt', k.projekte.map(p => p.id)), name: '' }),
      'kalender.freeze': () => ({ von: '', bis: '', name: '' }),
      'kalender.wartungsfenster': () => ({ tage: [], von: '', bis: '' }),
      'kalender.feiertage': () => ({ datum: '', name: '' }),
      regeln: () => ({ text: '' }),
      ansprechpartner: () => ({ name: '', rolle: '', mail: '', telefon: '' }),
    },
    lokal(el, ctx) {
      const name = el.dataset.pfad.slice('lokal.'.length);
      if (name === 'logo') { const f = el.files && el.files[0]; el.value = ''; logoLaden(f, ctx); return; }
      if (name === 'jahr') lokal.jahr = Number(el.value); else if (name in lokal) lokal[name] = el.value;
      ctx.neu();
    },
    feld(el, ctx) {
      // Neue Projekte bekommen ihre Id aus dem ersten Namen
      const m = /^projekte\.(\d+)\.name$/.exec(el.dataset.pfad);
      if (!m) return false;
      const v = el.value.trim();
      if (!v) { ui.toast('Projekt fehlt. Bitte einen Namen eintragen oder das Projekt entfernen.', { dauer: 5000 }); ctx.neu(); return true; }
      ctx.aendern(d => {
        const k = kundeVon(d, ctx.s.teil), p = k.projekte[+m[1]];
        if (!p.id || /^projekt(-\d+)?$/.test(p.id) && !p.name) p.id = F.neueId(v, k.projekte.filter(x => x !== p).map(x => x.id));
        p.name = v;
      });
      return true;
    },
    klick: {
      // Wartung in der Planung zeigen: Filter auf Kunde, Projekt und Lauf
      'wartung-oeffnen'(el, ctx) {
        const l = ctx.daten().laeufe.find(x => x.id === el.dataset.wert);
        if (!l) return;
        Object.assign(WP.plan.filter, { kunde: l.kunde || '', projekt: l.projekt || '', lauf: l.id });
        ctx.gehe('/planung');
      },
      'feiertage-uebernehmen'(el, ctx) {
        const jahr = Number(el.dataset.wert);
        ctx.aendern(d => {
          const k = kundeVon(d, ctx.s.teil);
          k.kalender = k.kalender || {};
          k.kalender.feiertage = Array.from({ length: LISTE_JAHRE }, (_, i) => K.feiertageVorschlag(jahr + i, k.kalender.bundesland)).flat();
        });
        document.querySelector('[data-aktion="reihe-hinzu"][data-wert="kalender.feiertage"]')?.focus();
        ui.toast('Liste übernommen');
      },
      async 'feiertage-zuruecksetzen'(el, ctx) {
        const ok = await ui.frage({ titel: 'Auf Vorschlag zurücksetzen?', text: 'Die eigene Liste geht verloren. Danach gilt wieder der Vorschlag aus dem Bundesland.',
          ja: 'Auf Vorschlag zurücksetzen', gefahr: true });
        if (!ok) return;
        ctx.aendern(d => { delete kundeVon(d, ctx.s.teil).kalender.feiertage; });
        document.querySelector('[data-aktion="feiertage-uebernehmen"]')?.focus();
        ui.toast('Auf Vorschlag zurückgesetzt');
      },
      /* Projekt kopieren: in diesen oder einen anderen Kunden, auf Wunsch mit seinen Serien (deren Läufe entstehen wie
         immer unter Serien mit „Läufe erzeugen“, im Kalender des Ziel-Kunden). */
      async 'projekt-kopieren'(el, ctx) {
        const d = ctx.daten(), k = kundeVon(d, ctx.s.teil), p = k.projekte[+el.dataset.wert];
        const serien = d.serien.filter(x => x.kunde === k.id && x.projekt === p.id);
        const felder = [
          { name: 'kunde', label: 'In Kunde', typ: 'auswahl', pflicht: true, wert: k.id, optionen: d.kunden.map(x => ({ wert: x.id, text: x.name || 'Ohne Namen' })) },
          { name: 'name', label: 'Name des neuen Projekts', pflicht: true, wert: `${p.name} (Kopie)` },
        ];
        if (serien.length) felder.push({ name: 'serien', label: 'Serien', typ: 'auswahl', wert: true,
          optionen: [{ wert: true, text: `${F.mehrzahl(serien.length, 'Serie', 'Serien')} mitkopieren` }, { wert: false, text: 'Ohne Serien' }] });
        const w = await ui.frage({ titel: `„${p.name}“ kopieren`, text: 'Die Kopie ist ein eigenes Projekt. Spätere Änderungen gelten nur für eines von beiden.',
          ja: 'Projekt kopieren', felder });
        if (!w || !w.name.trim()) return;
        const name = w.name.trim();
        let ziel = null;
        ctx.aendern(dd => {
          ziel = kundeVon(dd, w.kunde);
          const id = F.neueId(name, ziel.projekte.map(x => x.id));
          ziel.projekte.push({ ...JSON.parse(JSON.stringify(p)), id, name });
          if (w.serien) serien.forEach(x => dd.serien.push({ ...JSON.parse(JSON.stringify(x)), id: F.neueId(x.id, dd.serien.map(y => y.id)),
            name: ziel.id === k.id ? `${x.name} (Kopie)` : x.name, kunde: ziel.id, projekt: id }));
        });
        const wo = ziel.id === k.id ? '' : ` bei „${ziel.name}“`;
        ui.toast(`Projekt kopiert${wo}${w.serien ? `, mit ${F.mehrzahl(serien.length, 'Serie', 'Serien')}. Die Läufe erzeugst Du unter Serien` : ''}.`, { art: 'erfolg', dauer: 6000 });
      },
      'logo-entfernen'(el, ctx) {
        ctx.aendern(d => { delete kundeVon(d, ctx.s.teil).logo; });
        document.getElementById('wp-f-logo')?.focus();
        ui.toast('Logo entfernt');
      },
      'projekt-entfernen'(el, ctx) {
        const d = ctx.daten(), k = kundeVon(d, ctx.s.teil), p = k.projekte[+el.dataset.wert];
        const serie = d.serien.find(x => x.kunde === k.id && x.projekt === p.id);
        if (serie) { ui.toast(`„${p.name}“ gehört zur Serie „${serie.name}“. Erst dort ein anderes Projekt wählen.`, { dauer: 6000 }); return; }
        ctx.aendern(dd => { kundeVon(dd, ctx.s.teil).projekte.splice(+el.dataset.wert, 1); });
        document.querySelector('[data-aktion="reihe-hinzu"][data-wert="projekte"]')?.focus();
        ui.toast('Projekt entfernt');
      },
      async 'kunde-loeschen'(el, ctx) {
        const d = ctx.daten(), k = kundeVon(d, ctx.s.teil);
        const serie = d.serien.find(x => x.kunde === k.id);
        if (serie) { ui.toast(`„${k.name}“ hat die Serie „${serie.name}“. Erst die Serie löschen oder einem anderen Kunden geben.`, { dauer: 6000 }); return; }
        if (!await ui.frage({ titel: `„${k.name}“ löschen?`, text: 'Projekte und Kalender gehen mit verloren.', ja: 'Kunde löschen', gefahr: true })) return;
        ctx.aendern(dd => { dd.kunden = dd.kunden.filter(x => x.id !== k.id); });
        ctx.gehe('/kunden');
        ui.toast('Kunde gelöscht');
      },
    },
  };
})();
</script>
<script>
/* Wartungsplaner · Ansicht Vorlagen: Liste, Vorlage als Schrittliste (Abstand zum Anker, Dauer, Abhängigkeit,
   Puffer, Rolle, Sperren), Variante mit sichtbaren Abweichungen und „Auf Vorlage zurücksetzen“, dazu eine Vorschau
   als lesende Gantt-Zeitleiste zu einem Beispielanker. Braucht WP.form, WP.kern und WK.gantt.

   Felder einer Vorlage: data-pfad „schritte.<i>.<feld>“ (schreibt direkt). Felder einer Variante: „schritt.<id>.<feld>“:
   hinzugefügte Schritte ändern sich selbst, geerbte bekommen einen Eintrag in geaendert, nur wo sie abweichen. */
(function () {
  'use strict';
  const { ui, gantt } = WK, esc = ui.esc, F = WP.form, K = WP.kern;
  const lokal = { anker: null, kunde: null };

  const ARTEN = gantt.ARTEN;
  /* Ohne Angabe gilt der Standard. In einer Variante überschreibt LEER einen Wert der Vorlage. */
  const LEER = { titel: '', abstand: null, dauer: 1, nach: null, art: 'ea', puffer: 0, rolle: '', notiz: '',
    wartungsfenster: false, freeze: true, abwesenheit: true };
  function norm(feld, v) {
    if (feld === 'abstand') return v == null || v === '' ? null : Math.trunc(Number(v));
    if (feld === 'dauer') return Math.max(1, Math.trunc(Number(v)) || 1);
    if (feld === 'puffer') return Math.trunc(Number(v)) || 0;
    if (feld === 'nach') return v || null;
    if (feld === 'art') return ARTEN.some(([k]) => k === v) ? v : 'ea';
    if (feld === 'wartungsfenster') return !!v;
    if (feld === 'freeze' || feld === 'abwesenheit') return v !== false;
    return v == null ? '' : String(v);
  }
  const FELDER = Object.keys(LEER);

  const finden = (d, id) => d.vorlagen.find(v => v.id === id) || d.varianten.find(v => v.id === id) || null;
  const istVariante = v => !!(v && v.vorlage);
  const aufloesen = (d, id) => { try { return { v: K.aufloesen(d, id) }; } catch (e) { return { fehler: e.message }; } };
  const alleSchrittIds = d => d.vorlagen.flatMap(v => (v.schritte || []).map(s => s.id))
    .concat(d.varianten.flatMap(v => (v.hinzu || []).map(s => s.id)));
  const abweichungen = v => (v.hinzu || []).length + Object.keys(v.geaendert || {}).length + (v.weg || []).length;

  function anzeige(feld, v, schritte) {
    const n = norm(feld, v);
    if (feld === 'abstand') return n === null ? 'ohne' : `${n} AT`;
    if (feld === 'dauer' || feld === 'puffer') return `${n} AT`;
    if (feld === 'nach') return n ? ((schritte.find(s => s.id === n) || {}).titel || n) : 'kein Vorgänger';
    if (feld === 'art') return ARTEN.find(([k]) => k === n)[1];
    if (typeof n === 'boolean') return n ? 'ja' : 'nein';
    return n ? `„${n}“` : 'leer';
  }

  // --- Liste -----------------------------------------------------------------------------------------------
  function liste(d, s) {
    const zeile = (v, art) => {
      const r = aufloesen(d, v.id);
      return `<tr><td>${F.verweis('#/vorlagen/' + encodeURIComponent(v.id), v.name || 'Ohne Namen', v.id === s.teil)}</td>`
        + `<td>${esc(art)}</td><td>${esc(r.v ? r.v.anker : '–')}</td><td>${r.v ? r.v.schritte.length : ui.pill('fehler', 'Fehler')}</td>`
        + `<td>${istVariante(v) ? esc(F.mehrzahl(abweichungen(v), 'Abweichung', 'Abweichungen')) : '–'}</td></tr>`;
    };
    const zeilen = d.vorlagen.map(v => zeile(v, 'Vorlage')
      + d.varianten.filter(x => x.vorlage === v.id).map(x => zeile(x, `Variante von ${v.name}`)).join('')).join('')
      + d.varianten.filter(x => !d.vorlagen.some(v => v.id === x.vorlage))
        .map(x => zeile(x, `Variante von ${(finden(d, x.vorlage) || {}).name || x.vorlage}`)).join('');
    return F.tabelle('Vorlagen und Varianten', ['Name', 'Art', 'Anker', 'Schritte', 'Abweichungen'], zeilen,
      'Noch keine Vorlagen. Eine Vorlage beschreibt eine Wartungsart als Schritte rund um einen Anker, etwa ein Release.');
  }

  // --- Schritt als Karte -----------------------------------------------------------------------------------
  /** pfad(feld) → data-pfad; basis: Schritt der Vorlage (in einer Variante), dann sind Abweichungen markiert. */
  function schrittKarte(s, nr, { pfad, schritte, basis, klasse, status, knoepfe }) {
    const ab = f => basis && norm(f, basis[f]) !== norm(f, s[f]);
    const merk = f => (ab(f) ? ' wp-abweichend' : '');
    const vorher = f => (ab(f) ? `Vorlage: ${esc(anzeige(f, basis[f], schritte))}` : '');
    const zahl = (f, label, extra = '') => F.feld({ label, pfad: pfad(f), wert: s[f] ?? '', typ: 'zahl', art: 'number',
      klasse: 'schmal' + merk(f), extra: ` inputmode="numeric" step="1"${extra}`, hinweis: vorher(f) });
    const andere = schritte.filter(x => x.id !== s.id);
    const titel = s.titel || 'Ohne Titel';
    return `<li class="wk-karte ${klasse} wp-schritt" aria-label="Schritt ${nr}: ${esc(titel)}">`
      + `<div class="wp-schritt-kopf"><span class="wp-nr" aria-hidden="true">${nr}</span>${status}</div>`
      + `<div class="wp-felder">`
      + F.feld({ label: 'Schritt', pfad: pfad('titel'), wert: s.titel, typ: 'pflicht', klasse: 'breit' + merk('titel'), hinweis: vorher('titel') })
      + zahl('abstand', 'Abstand zum Anker (AT)') + zahl('dauer', 'Dauer (AT)', ' min="1"')
      + F.wahl({ label: 'Nach', pfad: pfad('nach'), wert: s.nach || '', klasse: merk('nach'), hinweis: vorher('nach'),
        optionen: [['', 'Kein Vorgänger'], ...andere.map(x => [x.id, x.titel || 'Ohne Titel'])] })
      + F.wahl({ label: 'Abhängigkeit', pfad: pfad('art'), wert: norm('art', s.art), optionen: ARTEN, klasse: merk('art'), hinweis: vorher('art') })
      + zahl('puffer', 'Puffer (AT)')
      + F.feld({ label: 'Rolle', pfad: pfad('rolle'), wert: s.rolle, klasse: merk('rolle'), hinweis: vorher('rolle') })
      + F.feld({ label: 'Notiz', pfad: pfad('notiz'), wert: s.notiz, klasse: 'breit' + merk('notiz'), hinweis: vorher('notiz') })
      + '</div><div class="wp-haken-reihe">'
      + F.haken({ label: 'Im Wartungsfenster', pfad: pfad('wartungsfenster'), an: !!s.wartungsfenster, klasse: merk('wartungsfenster'), hinweis: vorher('wartungsfenster') })
      + F.haken({ label: 'Darf im Freeze liegen', pfad: pfad('freeze'), an: s.freeze === false, typ: 'erlaubt', klasse: merk('freeze'), hinweis: vorher('freeze') })
      + F.haken({ label: 'Darf in Abwesenheit liegen', pfad: pfad('abwesenheit'), an: s.abwesenheit === false, typ: 'erlaubt', klasse: merk('abwesenheit'), hinweis: vorher('abwesenheit') })
      + `</div><div class="wp-knoepfe">${knoepfe}</div></li>`;
  }

  const HILFE = '<p class="wk-klein wp-leise">AT = Arbeitstage des Kunden. Mit Abstand zählt der Schritt vom Anker (negativ = davor). '
    + 'Ohne Abstand hängt er am Vorgänger. Die Reihenfolge änderst Du mit dem Griff oder „Nach oben“/„Nach unten“; die Vorgänger wandern mit. Puffer zählt ab dem Vorgänger, Sperrzeiten weichen aus: vor dem Anker nach früher, ab dem Anker nach später.</p>';

  /* Reihenfolge: Griff zum Ziehen (Maus, Stift, Finger), dazu „Nach oben“ und „Nach unten“ für die Tastatur. */
  const ordnen = (i, n, titel) => `<span class="wp-schritt-ordnen">`
    + `<button type="button" class="wk-btn klein wp-schritt-griff" data-nr="${i}" aria-label="Schritt ${i + 1} ziehen: ${esc(titel)}" title="Ziehen, um die Reihenfolge zu ändern">`
    + `<svg class="wp-sym" aria-hidden="true"><use href="#i-griff"/></svg></button>`
    + (i > 0 ? F.knopf('Nach oben', 'schritt-hoch', i, '', 'hoch') : '')
    + (i < n - 1 ? F.knopf('Nach unten', 'schritt-runter', i, '', 'runter') : '') + '</span>';

  /** Schritt von Platz von nach zu: Die Kette wandert mit. Wer am Vorgänger hing (oder an nichts), hängt danach am
      neuen Vorgänger; der Abstand zum Anker bleibt beim ersten Schritt der Kette. Schritte mit eigenem Abstand oder
      einem anderen Vorgänger bleiben, wie sie sind. */
  function schrittVerschieben(v, von, zu) {
    const alt = v.schritte.slice(), ohneAbstand = x => x.abstand == null || x.abstand === '';
    const gekettet = new Set(alt.filter((x, i) => ohneAbstand(x) && (!x.nach || (i > 0 && x.nach === alt[i - 1].id))).map(x => x.id));
    const [x] = v.schritte.splice(von, 1);
    v.schritte.splice(zu, 0, x);
    const neu = v.schritte, kopfAlt = alt[0], kopfNeu = neu[0];
    if (kopfAlt !== kopfNeu && !ohneAbstand(kopfAlt) && !kopfAlt.nach && gekettet.has(kopfNeu.id)) {
      kopfNeu.abstand = kopfAlt.abstand; delete kopfAlt.abstand;
      gekettet.delete(kopfNeu.id); gekettet.add(kopfAlt.id);
    }
    neu.forEach((y, i) => { if (gekettet.has(y.id)) { if (i > 0) y.nach = neu[i - 1].id; else delete y.nach; } });
    if (!ohneAbstand(kopfNeu)) delete kopfNeu.nach;
  }

  function verschieben(ctx, von, zu) {
    if (von === zu) { ctx.neu(); return; }
    ctx.aendern(d => schrittVerschieben(finden(d, ctx.s.teil), von, zu));
    document.querySelector(`#inhalt .wp-schritt-griff[data-nr="${zu}"]`)?.focus();
    ui.toast(`Schritt auf Platz ${zu + 1} verschoben. Die Vorgänger sind angepasst.`, { art: 'erfolg' });
  }

  /* Ziehen am Griff: Die Karte rückt mit dem Zeiger durch die Liste, Loslassen übernimmt, Esc bricht ab. */
  let ctxZuletzt = null;
  document.addEventListener('pointerdown', e => {
    const griff = e.target.closest('#inhalt .wp-schritt-griff');
    if (!griff || e.button !== 0 || !ctxZuletzt) return;
    const karte = griff.closest('.wp-schritt'), liste = karte.parentElement, von = [...liste.children].indexOf(karte), ctx = ctxZuletzt;
    e.preventDefault();
    const zeiger = e.pointerId;
    karte.classList.add('wp-zieht');
    document.body.classList.add('wp-ziehen');
    // Am Dokument, nicht am Griff: Die Karte wandert im DOM, dabei ginge eine Zeigerbindung am Griff verloren
    const bewegen = ev => {
      if (ev.pointerId !== zeiger) return;
      const vor = [...liste.children].find(y => y !== karte && ev.clientY < y.getBoundingClientRect().top + y.getBoundingClientRect().height / 2);
      if (vor) { if (karte.nextElementSibling !== vor) liste.insertBefore(karte, vor); } else if (liste.lastElementChild !== karte) liste.appendChild(karte);
      if (ev.clientY < 80) scrollBy(0, -16); else if (ev.clientY > innerHeight - 80) scrollBy(0, 16);
    };
    let fertig = false;
    const ende = ok => {
      if (fertig) return;
      fertig = true;
      document.removeEventListener('pointermove', bewegen);
      document.removeEventListener('pointerup', los);
      document.removeEventListener('pointercancel', abbruch);
      document.removeEventListener('keydown', taste, true);
      karte.classList.remove('wp-zieht');
      document.body.classList.remove('wp-ziehen');
      const zu = [...liste.children].indexOf(karte);
      if (ok) verschieben(ctx, von, zu); else ctx.neu();
    };
    const taste = ev => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); ende(false); } };
    const los = ev => { if (ev.pointerId === zeiger) ende(true); };
    const abbruch = ev => { if (ev.pointerId === zeiger) ende(false); };
    document.addEventListener('pointermove', bewegen);
    document.addEventListener('pointerup', los);
    document.addEventListener('pointercancel', abbruch);
    document.addEventListener('keydown', taste, true);
  });

  function vorlageEditor(d, v) {
    const schritte = v.schritte || [];
    const karten = schritte.map((s, i) => schrittKarte(s, i + 1, { pfad: f => `schritte.${i}.${f}`, schritte,
      klasse: 'entschieden', status: schritte.length > 1 ? ordnen(i, schritte.length, s.titel || 'Ohne Titel') : '',
      knoepfe: F.knopf('Schritt entfernen', 'schritt-entfernen', s.id) })).join('');
    return `<section class="wp-abschnitt wp-editor" aria-labelledby="wp-bearbeiten">`
      + F.editorKopf(v.name || 'Ohne Namen', F.knopf('Variante ableiten', 'variante-ableiten') + F.knopf('Vorlage löschen', 'vorlage-loeschen'))
      + `<div class="wp-felder">${F.feld({ label: 'Name', pfad: 'name', wert: v.name, typ: 'pflicht', klasse: 'breit' })}`
      + F.feld({ label: 'Name des Ankers', pfad: 'anker', wert: v.anker, hinweis: 'Etwa Release oder Stichtag' }) + '</div>'
      + `<h3 class="wk-h3">Schritte</h3>${HILFE}`
      + (karten ? `<ol class="wp-schritte">${karten}</ol>` : '<p class="wk-klein wp-leise">Noch keine Schritte.</p>')
      + `<div class="wp-knoepfe">${F.knopf('Schritt hinzufügen', 'schritt-hinzufuegen')}</div></section>`
      + vorschau(d, v.id);
  }

  function varianteEditor(d, v) {
    const r = aufloesen(d, v.id), b = aufloesen(d, v.vorlage), quelle = finden(d, v.vorlage);
    const unter = `<p class="wk-klein wp-leise">Variante von ${quelle ? F.verweis('#/vorlagen/' + encodeURIComponent(quelle.id), quelle.name) : esc(v.vorlage)}. `
      + 'Was nicht abweicht, kommt aus der Vorlage und ändert sich mit ihr.</p>';
    const knoepfe = F.knopf('Variante ableiten', 'variante-ableiten')
      + (abweichungen(v) ? F.knopf('Alles auf Vorlage zurücksetzen', 'variante-zuruecksetzen') : '')
      + F.knopf('Variante löschen', 'vorlage-loeschen');
    let inhalt;
    if (!r.v || !b.v) inhalt = `<p class="wp-meldung">${ui.pill('fehler', 'Fehler')}<span>${esc(r.fehler || b.fehler)}. Bitte eine andere Vorlage wählen.</span></p>`;
    else {
      const schritte = r.v.schritte, basis = new Map(b.v.schritte.map(s => [s.id, s])), geaendert = v.geaendert || {};
      const karten = schritte.map((s, i) => {
        const hinzu = s.abweichung === 'hinzu', eigen = hinzu || !!geaendert[s.id];
        const status = hinzu ? ui.pill('entschieden', 'Hinzugefügt') : eigen ? ui.pill('entschieden', 'Geändert') : ui.pill('vorschlag', 'Wie Vorlage');
        const kn = (geaendert[s.id] ? F.knopf('Auf Vorlage zurücksetzen', 'schritt-zuruecksetzen', s.id) : '')
          + F.knopf('Schritt entfernen', 'schritt-entfernen', s.id);
        return schrittKarte(s, i + 1, { pfad: f => `schritt.${s.id}.${f}`, schritte, basis: hinzu ? null : basis.get(s.id),
          klasse: eigen ? 'entschieden' : 'vorschlag', status, knoepfe: kn });
      }).join('');
      const weg = (v.weg || []).map(id => {
        const s = basis.get(id);
        return `<li class="wp-reihe">${ui.pill('offen', 'Entfernt')}<span class="wp-reihe-text">${esc(s ? s.titel : id)}</span>`
          + `<div class="wp-reihe-ende">${F.knopf('Zurückholen', 'schritt-zurueckholen', id)}</div></li>`;
      }).join('');
      inhalt = `<h3 class="wk-h3">Schritte</h3>${HILFE}`
        + '<p class="wk-klein wp-leise">Gestrichelt: wie in der Vorlage. Durchgezogen: in dieser Variante entschieden. Abweichende Felder sind markiert, darunter steht der Wert der Vorlage.</p>'
        + (karten ? `<ol class="wp-schritte">${karten}</ol>` : '<p class="wk-klein wp-leise">Keine Schritte.</p>')
        + (weg ? `<h4 class="wp-h4">Entfernte Schritte</h4><ul class="wp-reihen">${weg}</ul>` : '')
        + `<div class="wp-knoepfe">${F.knopf('Schritt hinzufügen', 'schritt-hinzufuegen')}</div>`;
    }
    return `<section class="wp-abschnitt wp-editor" aria-labelledby="wp-bearbeiten">`
      + F.editorKopf(v.name || 'Ohne Namen', knoepfe, unter)
      + `<div class="wp-felder">${F.feld({ label: 'Name', pfad: 'name', wert: v.name, typ: 'pflicht', klasse: 'breit' })}</div>`
      + inhalt + '</section>' + (r.v ? vorschau(d, v.id) : '');
  }

  // --- Vorschau --------------------------------------------------------------------------------------------
  function standardKunde(d, id) {
    const s = d.serien.find(x => x.vorlage === id || (finden(d, x.vorlage) || {}).vorlage === id);
    return (s && s.kunde) || (d.kunden[0] && d.kunden[0].id) || '';
  }
  function vorschau(d, id) {
    const r = aufloesen(d, id);
    if (!r.v) return '';
    const anker = lokal.anker || K.plus(F.heute(), 56);
    const kundeId = lokal.kunde === null ? standardKunde(d, id) : lokal.kunde;
    const kunde = d.kunden.find(k => k.id === kundeId) || null;
    const { termine } = K.rechnen(r.v, anker, kunde, d.verfuegbarkeit);
    const aufgaben = termine.map(t => ({ id: t.schritt, titel: t.titel, start: t.start, ende: t.ende, nach: t.nach, art: t.art, puffer: t.puffer }));
    const ankerPunkt = { id: 'wp-anker', titel: `${r.v.anker} (Anker)`, start: null, ende: anker };
    const i = aufgaben.findIndex(a => a.start > anker);
    aufgaben.splice(i < 0 ? aufgaben.length : i, 0, ankerPunkt);
    const zeilen = termine.map(t => {
      const hinweis = t.konflikte.length ? `${ui.pill('fehler', 'Konflikt')} ${esc(t.konflikte.join('; '))}`
        : t.ausgewichen ? `${ui.pill('offen', 'Ausgewichen')} ${esc(`${Math.abs(t.ausgewichen.tage)} Tage ${t.ausgewichen.tage < 0 ? 'früher' : 'später'}: ${t.ausgewichen.grund}`)}`
          : ui.pill('erfolg', 'Passt');
      return `<tr><td>${esc(t.titel)}</td><td>${esc(F.tag(t.start))}</td><td>${esc(F.tag(t.ende))}</td>`
        + `<td>${esc(F.mehrzahl(t.dauer, 'AT', 'AT'))}${t.uhrzeit ? ` · ${esc(t.uhrzeit.von)}–${esc(t.uhrzeit.bis)}` : ''}</td><td class="wp-umbruch">${hinweis}</td></tr>`;
    }).join('');
    return `<section class="wp-abschnitt wp-vorschau" aria-labelledby="wp-vorschau-titel">`
      + `<div class="wp-abschnitt-kopf"><h2 class="wk-h2" id="wp-vorschau-titel">Vorschau</h2>${ui.pill('vorschlag', 'Vorschau, nicht gespeichert')}</div>`
      + `<p class="wk-klein wp-leise">So lägen die Schritte zu einem Beispielanker. Gespeichert wird nur die Vorlage.</p>`
      + `<div class="wp-felder">${F.feld({ label: `Beispielanker (${r.v.anker})`, pfad: 'lokal.anker', wert: anker, typ: 'lokal', art: 'date' })}`
      + F.wahl({ label: 'Kalender von', pfad: 'lokal.kunde', wert: kundeId, typ: 'lokal',
        optionen: [['', 'Ohne Kunde (bundesweite Feiertage)'], ...d.kunden.map(k => [k.id, k.name])] }) + '</div>'
      + `<div class="wk-karte vorschlag wp-vorschau-gantt">${gantt.html(aufgaben, { massstab: 'einpassen', breite: 760, pfeilform: 'rund',
        leer: 'Noch keine Schritte. Mit „Schritt hinzufügen“ erscheint der erste Balken.' })}</div>`
      + (termine.length ? `<div class="wp-tabelle-rahmen" role="region" aria-label="Termine der Vorschau" tabindex="0" data-scroll="vorschau">`
        + `<table class="wp-tabelle"><thead><tr><th scope="col">Schritt</th><th scope="col">Start</th><th scope="col">Ende</th><th scope="col">Dauer</th><th scope="col">Status</th></tr></thead>`
        + `<tbody>${zeilen}</tbody></table></div>` : '')
      + '</section>';
  }

  // --- Ändern ----------------------------------------------------------------------------------------------
  /** Feld einer Variante: hinzugefügter Schritt direkt, geerbter als Abweichung (gleich der Vorlage = keine). */
  function varianteFeld(d, v, id, feld, w) {
    const h = (v.hinzu || []).find(s => s.id === id);
    if (h) { if (w === undefined) delete h[feld]; else h[feld] = w; return; }
    const basis = K.aufloesen(d, v.vorlage).schritte.find(s => s.id === id);
    if (!basis) return;
    v.geaendert = v.geaendert || {};
    const g = v.geaendert[id] = v.geaendert[id] || {};
    const neu = w === undefined ? LEER[feld] : w;
    if (norm(feld, basis[feld]) === norm(feld, neu)) delete g[feld]; else g[feld] = neu;
    if (!Object.keys(g).length) delete v.geaendert[id];
  }

  /** Schritt aus einer Vorlage nehmen: Nachfolger verlieren den Vorgänger, Varianten ihre Abweichungen dazu. */
  function schrittWeg(d, v, id) {
    v.schritte = v.schritte.filter(s => s.id !== id);
    v.schritte.forEach(s => { if (s.nach === id) delete s.nach; });
    d.varianten.forEach(x => {
      if (x.geaendert) delete x.geaendert[id];
      x.weg = (x.weg || []).filter(w => w !== id);
      (x.hinzu || []).forEach(s => { if (s.nach === id) delete s.nach; });
    });
  }

  async function anlegen(ctx) {
    const w = await ui.frage({ titel: 'Vorlage anlegen', ja: 'Vorlage anlegen', felder: [
      { name: 'name', label: 'Name', pflicht: true }, { name: 'anker', label: 'Name des Ankers', wert: 'Release', pflicht: true }] });
    if (!w) return;
    let id;
    ctx.aendern(d => {
      id = F.neueId(w.name, d.vorlagen.concat(d.varianten).map(v => v.id));
      d.vorlagen.push({ id, name: w.name.trim(), anker: w.anker.trim(), schritte: [] });
    });
    ctx.gehe('/vorlagen/' + encodeURIComponent(id));
    ui.toast('Vorlage angelegt', { art: 'erfolg' });
  }

  const fokusTitel = () => {
    const el = [...document.querySelectorAll('#inhalt .wp-schritte [data-pfad$=".titel"]')].pop();
    if (el) { el.focus(); el.select(); }
  };

  WP.ansichten.vorlagen = {
    inhalt(s, ctx) {
      ctxZuletzt = ctx;
      const d = ctx.daten(), v = s.teil && finden(d, s.teil);
      return liste(d, s) + (v ? (istVariante(v) ? varianteEditor(d, v) : vorlageEditor(d, v))
        : (d.vorlagen.length ? '<p class="wk-klein wp-leise">Eine Vorlage in der Liste wählen, um sie zu bearbeiten.</p>' : ''));
    },
    haupt: (s, ctx) => anlegen(ctx),
    objekt: (d, s) => finden(d, s.teil),
    lokal(el, ctx) {
      const f = el.dataset.pfad.split('.')[1];
      lokal[f] = f === 'anker' ? (el.value || null) : el.value;
      ctx.neu();
    },
    feld(el, ctx) {
      const m = /^schritt\.([^.]+)\.(\w+)$/.exec(el.dataset.pfad);
      if (!m || !FELDER.includes(m[2])) return false;
      const w = F.wert(el);
      if (w === F.FEHLT) { ui.toast('Schritt fehlt. Bitte einen Titel eintragen.', { dauer: 5000 }); ctx.neu(); return true; }
      ctx.aendern(d => varianteFeld(d, finden(d, ctx.s.teil), m[1], m[2], w));
      return true;
    },
    klick: {
      'schritt-hoch'(el, ctx) { const i = Number(el.dataset.wert); verschieben(ctx, i, i - 1); },
      'schritt-runter'(el, ctx) { const i = Number(el.dataset.wert); verschieben(ctx, i, i + 1); },
      'schritt-hinzufuegen'(el, ctx) {
        ctx.aendern(d => {
          const v = finden(d, ctx.s.teil);
          const id = F.neueId(istVariante(v) ? `${v.id}-schritt` : 'schritt', alleSchrittIds(d));
          const neu = { id, titel: 'Neuer Schritt', dauer: 1 };
          if (istVariante(v)) (v.hinzu = v.hinzu || []).push(neu);
          else {
            v.schritte = v.schritte || [];
            if (v.schritte.length) neu.nach = v.schritte[v.schritte.length - 1].id;   // hängt am letzten; Ziehen gliedert ihn ein
            v.schritte.push(neu);
          }
        });
        fokusTitel();
        ui.toast('Schritt hinzugefügt');
      },
      'schritt-entfernen'(el, ctx) {
        const id = el.dataset.wert;
        ctx.aendern(d => {
          const v = finden(d, ctx.s.teil);
          if (!istVariante(v)) { schrittWeg(d, v, id); return; }
          if ((v.hinzu || []).some(s => s.id === id)) {
            v.hinzu = v.hinzu.filter(s => s.id !== id);
            v.hinzu.forEach(s => { if (s.nach === id) delete s.nach; });
            Object.values(v.geaendert || {}).forEach(g => { if (g.nach === id) g.nach = null; });
          } else {
