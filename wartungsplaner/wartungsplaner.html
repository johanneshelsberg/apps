.wp-termin-titel { font-weight: var(--wk-gewicht-stark); overflow-wrap: anywhere; }
.wp-termin-text .wk-pill { margin-top: 4px; }

/* Schritte ordnen: Griff zum Ziehen, Nach oben/Nach unten; die gezogene Karte schwebt (Fläche und Schatten statt Linie) */
.wp-schritt-kopf { display: flex; align-items: center; gap: var(--wk-abstand-2); flex-wrap: wrap; }
.wp-schritt-ordnen { display: flex; align-items: center; gap: var(--wk-abstand-1); margin-left: auto; }
.wp-schritt-griff { padding-inline: 8px; cursor: grab; touch-action: none; }
.wp-schritt.wp-zieht { position: relative; z-index: 2; background: var(--wk-schwebend); box-shadow: var(--wk-schatten-3); }
body.wp-ziehen, body.wp-ziehen * { cursor: grabbing !important; user-select: none; }

/* Kunden: Zeichen (Logo oder Initialen), Notiz, Logo wählen */
.wp-mit-zeichen { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.wp-kunde-zeichen { flex: none; width: 28px; height: 28px; border-radius: var(--wk-radius-m); object-fit: contain; background: var(--wk-flaeche); box-shadow: var(--wk-schatten-1); }

  font: var(--wk-gewicht-stark) 11px/1 var(--wk-schrift); letter-spacing: .02em; }

.wp-kunde-initialen.gross { font-size: 14px; }

.wp-logo-wahl { display: flex; align-items: center; gap: var(--wk-abstand-4); flex-wrap: wrap; }

.wp-datei-knopf:focus-within { outline: var(--wk-strich-aktiv) solid var(--wk-fokus); outline-offset: 2px; }
.wp-datei-feld { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
.wp-feld.voll { flex: 1 1 100%; }
.wp-notiz { min-height: 110px; resize: vertical; font: inherit; line-height: 1.45; }
.wp-treffer { align-self: end; padding-bottom: 10px; }
.wp-pfeil { padding-inline: 8px; min-width: var(--wk-knopf-klein); }

/* Releases: im Kalender als Zeile mit Symbol, in der Ansicht die Zuordnung je Kunde */
.wp-kal-release { display: flex; align-items: center; gap: 4px; font-size: var(--wk-groesse-klein); font-weight: var(--wk-gewicht-stark); color: var(--wk-text); }

.wp-zuordnungen { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--wk-abstand-2); grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.wp-zuordnung { margin: 0; padding: var(--wk-abstand-3); border: 0; border-radius: var(--wk-radius-l); background: var(--wk-flaeche); display: grid; gap: 4px; }
.wp-zuordnung legend { float: left; width: 100%; margin-bottom: 4px; font-weight: var(--wk-gewicht-stark); }

<script>
/* Werkzeugkasten · zustand-router
   Zentraler Zustand mit Abonnenten, Hash-Router und ein Zeichner, der beim
   Neuzeichnen Fokus, Cursor und Scrollpositionen erhält; dazu ein Sprung zu einem Element mit Fokus und Hervorhebung.
   Im Browser: WK.zustand / WK.router / WK.zeichnen / WK.springen. In Node: require('./zustand.js'). */
(function (wurzel, fabrik) {
  const api = fabrik();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else Object.assign(wurzel.WK = wurzel.WK || {}, api);
})(typeof window !== 'undefined' ? window : globalThis, function () {
  'use strict';

  /** zustand(anfang): { get, set(teil | fn), reset, abonnieren(fn) → abbestellen } */
  function zustand(anfang) {
    const start = () => (typeof anfang === 'function' ? anfang() : structuredClone(anfang));
    let s = start();
    const hoerer = new Set();
    const melden = () => hoerer.forEach(f => f(s));
    return {
      get: () => s,
      set(teil) { const neu = typeof teil === 'function' ? teil(s) : teil; if (neu && neu !== s) Object.assign(s, neu); melden(); },
      reset() { s = start(); melden(); },
      abonnieren(f) { hoerer.add(f); return () => hoerer.delete(f); },
    };
  }

  /** Hash-Pfade wie #/korrigieren/K11-D-06 in { name, teile } zerlegen */
  function pfadLesen(hash, namen) {
    const teile = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const name = namen.includes(teile[0]) ? teile[0] : null;
    return name ? { name, teile: teile.slice(1) } : null;
  }

  /** router({ namen, start, beiWechsel }) – nutzt pushState, fällt still zurück, wenn die Umgebung es verbietet */
  function router({ namen, start, beiWechsel }) {
    const gehe = (pfad, merken = true) => {
      const r = pfadLesen('#' + pfad, namen); if (!r) return;
      try { merken ? history.pushState(null, '', '#' + pfad) : history.replaceState(null, '', '#' + pfad); } catch (e) { /* Sandbox */ }
      beiWechsel(r);
    };
    window.addEventListener('popstate', () => { const r = pfadLesen(location.hash, namen); if (r) beiWechsel(r); });
    const r = pfadLesen(location.hash, namen);
    r ? beiWechsel(r) : gehe(start, false);
    return { gehe };
  }

  function schluessel(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset && el.dataset.aktion) return `[data-aktion="${CSS.escape(el.dataset.aktion)}"]` + (el.dataset.wert != null ? `[data-wert="${CSS.escape(el.dataset.wert)}"]` : '');
    return null;
  }

  /** zeichnen(wurzelElement, html): ersetzt den Inhalt und stellt Fokus, Cursor und
      Scrollpositionen (Elemente mit data-scroll="name") wieder her. */
  function zeichnen(ziel, html) {
    const aktiv = document.activeElement, sk = schluessel(aktiv);
    const cursor = aktiv && 'selectionStart' in aktiv ? aktiv.selectionStart : null;
    const scroll = {};
    ziel.querySelectorAll('[data-scroll]').forEach(e => { scroll[e.dataset.scroll] = [e.scrollTop, e.scrollLeft]; });
    ziel.innerHTML = html;
    ziel.querySelectorAll('[data-scroll]').forEach(e => { const p = scroll[e.dataset.scroll]; if (p) { e.scrollTop = p[0]; e.scrollLeft = p[1]; } });
    if (sk) { const e = ziel.querySelector(sk); if (e) { e.focus({ preventScroll: true }); if (cursor != null && e.setSelectionRange) try { e.setSelectionRange(cursor, cursor); } catch (x) { } } }
  }

  /** springen(element, { klasse, dauer, block }): scrollt zum Element, setzt den Fokus darauf (ohne zweites Scrollen)
      und hebt es mit `klasse` für `dauer` ms hervor (die Gestaltung macht die App). Höher als der Bildschirm: oben
      ausgerichtet; scroll-margin der App hält es frei von festen Kopf- und Fußleisten. Nicht fokussierbare Elemente
      bekommen tabindex="-1". Bei prefers-reduced-motion ohne weiches Scrollen. → false, wenn es das Element nicht gibt. */
  function springen(el, { klasse = 'wk-hervor', dauer = 1600, block = 'center' } = {}) {
    if (!el || !el.isConnected) return false;
    const win = el.ownerDocument.defaultView;
    const ruhig = !win.matchMedia || win.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (el.tabIndex < 0 && !el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
    // Höher als der Bildschirm: am Anfang ausrichten, sonst wäre der Anfang abgeschnitten
    const hoch = block === 'center' && el.getBoundingClientRect && el.getBoundingClientRect().height > (win.innerHeight || Infinity) * 0.8;
    if (typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: hoch ? 'start' : block, behavior: ruhig ? 'auto' : 'smooth' });
    el.focus({ preventScroll: true });
    if (klasse) {
      el.classList.remove(klasse);
      void el.offsetWidth;                                   // gleiche Nachricht erneut: Hervorhebung beginnt neu
      el.classList.add(klasse);
      win.clearTimeout(el.wkSprungUhr);
      el.wkSprungUhr = win.setTimeout(() => el.classList.remove(klasse), dauer);
    }
    return true;
  }

  return { zustand, pfadLesen, router, zeichnen, springen };
});
</script>
<script>
/* Werkzeugkasten · ui-bausteine
   Kleine HTML-Helfer für Seitenkopf, Schritte, Status-Pills, Toasts, Rückfragen und Stufen-Regler.
   Braucht design-grundlagen. Keine Abhängigkeiten, CSP-tauglich (als Datei einbinden).
   Nutzung: WK.ui.toast('Gespeichert'); el.innerHTML = WK.ui.kopf({ titel: 'Arbeit prüfen' });
            if (await WK.ui.frage({ titel: 'Karte löschen?', ja: 'Löschen', gefahr: true })) … */
(function (wurzel) {
  'use strict';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const SYMBOL = {
    vorschlag: '<circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.6"/>',
    entschieden: '<path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    offen: '<circle cx="6" cy="6" r="4" fill="currentColor"/>',
    fehler: '<path d="M3.5 3.5l5 5M8.5 3.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  };
  SYMBOL.erfolg = SYMBOL.entschieden;
  const STANDARD = { vorschlag: 'Vorschlag', entschieden: 'Entschieden', offen: 'Offen', fehler: 'Fehler', erfolg: 'Erreicht' };

  /** Status-Pill: Symbol plus Wort. art: vorschlag | entschieden | offen | fehler | erfolg (Haken, wie der Toast „erfolg“) */
  function pill(art, text) {
    return `<span class="wk-pill ${art}"><svg viewBox="0 0 12 12" aria-hidden="true">${SYMBOL[art]}</svg>${esc(text ?? STANDARD[art])}</span>`;
  }

  /** Schritte: [{ text, erledigt, aktuell, aktion }] – aktion landet in data-aktion */
  function schritte(liste, label = 'Schritte') {
    return `<nav class="wk-schritte" aria-label="${esc(label)}">` + liste.map((s, i) =>
      (i ? '<span class="wk-schritt-linie"></span>' : '') +
      `<button class="wk-schritt ${s.erledigt ? 'erledigt' : ''} ${s.aktuell ? 'aktuell' : ''}" ${s.aktion ? `data-aktion="${esc(s.aktion)}"` : ''} ${s.aktuell ? 'aria-current="step"' : ''}><i>${s.erledigt ? '✓' : i + 1}</i>${esc(s.text)}</button>`
    ).join('') + '</nav>';
  }

  /** Seitenkopf: { krumen, titel, unter, schritte (HTML), aktionen (HTML) } */
  function kopf({ krumen = '', titel, unter = '', schritte: st = '', aktionen = '' }) {
    return `<header class="wk-kopf"><div class="wk-kopf-l">${krumen ? `<div class="wk-krumen">${esc(krumen)}</div>` : ''}<h1 class="wk-h1">${esc(titel)}</h1>${unter ? `<p class="wk-unter">${esc(unter)}</p>` : ''}${st}</div>${aktionen ? `<div class="wk-kopf-r">${aktionen}</div>` : ''}</header>`;
  }

  /** Toast unten rechts (oder mittig, --wk-toast-lage), 3 Sekunden, höchstens drei gleichzeitig. Gibt das Element zurück.
      Gleiche Vokabel wie der Knopf: „Übernehmen“ → „Übernommen“.
      optionen: { art: 'erfolg' } für Erfolgserlebnisse (gut-Farben, Haken, kleiner Hüpfer), dauer in ms.
      aktion: { text: 'Rückgängig', tun, fokus } Knopf im Toast, Standarddauer dann 8 Sekunden. Ein Tipp schließt den
      Toast und ruft tun(). Zeit steht still, solange Zeiger oder Fokus im Toast sind; Esc darin schließt.
      Fokus springt auf den Knopf, wenn fokus: true oder der Fokus verloren ist (liegt bei <body>), und kehrt beim
      Schließen dorthin zurück, wo er vorher war. */
  function toast(text, { art = '', dauer, aktion = null } = {}) {
    let box = document.querySelector('.wk-toasts');
    if (!box) { box = document.createElement('div'); box.className = 'wk-toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
    const lage = getComputedStyle(box).getPropertyValue('--wk-toast-lage').trim();   // rechts | mittig, Regeln in design-grundlagen
    if (lage === 'mittig') box.dataset.lage = lage; else delete box.dataset.lage;
    const t = document.createElement('div'); t.className = 'wk-toast'; t.textContent = text;
    if (art) t.classList.add(art);
    if (art === 'erfolg') t.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 12 12" aria-hidden="true">${SYMBOL.entschieden}</svg>`);
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    if (!aktion) { setTimeout(() => t.remove(), dauer ?? 3000); return t; }

    t.classList.add('mit-aktion');
    const knopf = document.createElement('button');
    knopf.type = 'button'; knopf.className = 'wk-toast-aktion'; knopf.textContent = aktion.text;
    t.appendChild(knopf);
    let vorher = document.activeElement, rest = dauer ?? 8000, seit = 0, uhr = 0, zeiger = false;
    const laufen = () => { if (uhr || !t.isConnected || zeiger || t.contains(document.activeElement)) return; seit = Date.now(); uhr = setTimeout(schliessen, rest); };
    const halten = () => { if (!uhr) return; clearTimeout(uhr); uhr = 0; rest = Math.max(0, rest - (Date.now() - seit)); };
    function schliessen() {
      clearTimeout(uhr); uhr = 0;
      const drin = t.contains(document.activeElement);
      t.remove();
      if (!drin) return;
      if (vorher && vorher !== document.body && vorher.isConnected && vorher.focus) vorher.focus();
      else if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    }
    t.addEventListener('pointerenter', () => { zeiger = true; halten(); });
    t.addEventListener('pointerleave', () => { zeiger = false; laufen(); });
    t.addEventListener('focusin', e => { if (e.relatedTarget && !t.contains(e.relatedTarget)) vorher = e.relatedTarget; halten(); });
    t.addEventListener('focusout', e => { if (!t.contains(e.relatedTarget)) setTimeout(laufen); });
    t.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); schliessen(); } });
    knopf.addEventListener('click', () => { if (!t.isConnected) return; schliessen(); aktion.tun?.(); });
    if (aktion.fokus || !vorher || vorher === document.body) knopf.focus({ preventScroll: true });
    laufen();
    return t;
  }

  let fragen = 0;
  /** Rückfrage im App-Design statt confirm()/prompt().
      { titel, text, ja = 'OK', nein = 'Abbrechen', gefahr, felder, mehr } → Promise:
      ohne felder true/false, mit felder { name: wert } oder null.
      mehr: [{ wert, text }] weitere Knöpfe zwischen „nein“ und „ja“; ein Tipp gibt ihren wert zurück (Felder bleiben ungelesen).
      felder: [{ name, label, wert, typ = 'text' | 'email' | 'number' | … | 'mehrzeilig' | 'auswahl', platzhalter, pflicht, optionen }]
      auswahl: optionen [{ wert, text }], vorgewählt die Option mit wert; Rückgabe ihr wert (beliebiger Typ) oder null.
      Esc oder Tipp neben die Karte bricht ab, Enter bestätigt (im mehrzeiligen Feld Strg/⌘+Enter).
      gefahr: Ja-Knopf in Fehlerfarbe, Fokus startet auf „nein“. Hängt an <body>, der Rest der Seite ist solange inert. */
  function frage({ titel, text = '', ja = 'OK', nein = 'Abbrechen', gefahr = false, felder = null, mehr = [] } = {}) {
    return new Promise(fertig => {
      const id = `wk-frage-${++fragen}`, vorher = document.activeElement;
      // Auswahl: value ist der Index (wert kann jeder Typ sein). Leere Zeile mit platzhalter oder bei pflicht ohne Vorwahl.
      const optionen = f => {
        const opt = f.optionen || [], gewaehlt = opt.findIndex(o => o.wert === f.wert);
        const leer = f.platzhalter || (f.pflicht && gewaehlt < 0)
          ? `<option value="" disabled${gewaehlt < 0 ? ' selected' : ''}>${esc(f.platzhalter || '–')}</option>` : '';
        return leer + opt.map((o, j) => `<option value="${j}"${j === gewaehlt ? ' selected' : ''}>${esc(o.text ?? o.wert)}</option>`).join('');
      };
      const feld = (f, i) => {
        const a = `id="${id}-f${i}" name="${esc(f.name)}" class="wk-feld"${f.platzhalter && f.typ !== 'auswahl' ? ` placeholder="${esc(f.platzhalter)}"` : ''}${f.pflicht ? ' required' : ''}`;
        const eingabe = f.typ === 'mehrzeilig' ? `<textarea ${a} rows="4">${esc(f.wert)}</textarea>`
          : f.typ === 'auswahl' ? `<select ${a}>${optionen(f)}</select>`
          : `<input ${a} type="${esc(f.typ || 'text')}" value="${esc(f.wert)}">`;
        return `<label class="wk-frage-feld" for="${id}-f${i}">${esc(f.label ?? f.name)}${eingabe}</label>`;
      };
      const schleier = document.createElement('div'); schleier.className = 'wk-schleier';
      schleier.innerHTML = `<form class="wk-dialog wk-karte wk-frage" role="${felder ? 'dialog' : 'alertdialog'}" aria-modal="true" aria-labelledby="${id}-t" tabindex="-1"${text ? ` aria-describedby="${id}-x"` : ''} novalidate>`
        + `<h2 class="wk-h3" id="${id}-t">${esc(titel)}</h2>${text ? `<p class="wk-frage-text" id="${id}-x">${esc(text)}</p>` : ''}`
        + (felder || []).map(feld).join('')
        + `<div class="wk-frage-knoepfe">${nein ? `<button type="button" class="wk-btn" data-wahl="nein">${esc(nein)}</button>` : ''}`
        + mehr.map((m, i) => `<button type="button" class="wk-btn" data-wahl="mehr" data-mehr="${i}">${esc(m.text)}</button>`).join('')
        + `<button type="submit" class="wk-btn ${gefahr ? 'gefahr' : 'haupt'}" data-wahl="ja">${esc(ja)}</button></div></form>`;
      const form = schleier.firstChild;
      const stumm = [...document.body.children].filter(e => !e.inert && !e.classList.contains('wk-toasts'));
      stumm.forEach(e => { e.inert = true; });
      document.body.appendChild(schleier);

      const schliessen = wert => {
        document.removeEventListener('keydown', taste, true);
        schleier.remove();
        stumm.forEach(e => { e.inert = false; });
        if (vorher && vorher.isConnected && vorher.focus) vorher.focus();
        fertig(wert);
      };
      const abbrechen = () => schliessen(felder ? null : false);
      form.addEventListener('submit', e => {
        e.preventDefault();
        const leer = [...form.elements].find(el => el.required && !el.value.trim());
        if (leer) { leer.setAttribute('aria-invalid', 'true'); leer.focus(); return; }
        schliessen(felder ? Object.fromEntries(felder.map((f, i) => {
          const el = form.querySelector(`#${id}-f${i}`);
          if (f.typ === 'auswahl') return [f.name, el.value === '' ? null : f.optionen[el.value].wert];
          return [f.name, f.typ === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value];
        })) : true);
      });
      form.addEventListener('input', e => e.target.removeAttribute('aria-invalid'));
      form.addEventListener('change', e => e.target.removeAttribute('aria-invalid'));
      form.querySelector('[data-wahl="nein"]')?.addEventListener('click', abbrechen);
      form.querySelectorAll('[data-wahl="mehr"]').forEach(k => k.addEventListener('click', () => schliessen(mehr[k.dataset.mehr].wert)));
      // Am Dokument (Fokus kann nach einem Tipp auf die Karte bei <body> liegen); nur die oberste Rückfrage reagiert.
      const taste = e => {
        if (schleier !== [...document.querySelectorAll('.wk-schleier')].pop()) return;
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); abbrechen(); }
        else if (e.key === 'Enter' && (e.target.tagName === 'TEXTAREA' ? e.ctrlKey || e.metaKey : e.target.tagName === 'SELECT')) { e.preventDefault(); form.requestSubmit(); }
      };
      document.addEventListener('keydown', taste, true);
      // Tipp daneben: nur, wenn Drücken und Loslassen beide auf dem Schleier liegen (kein Abbruch beim Markieren).
      let unten = null;
      schleier.addEventListener('pointerdown', e => { unten = e.target; });
      schleier.addEventListener('click', e => { if (e.target === schleier && unten === schleier) abbrechen(); });

      const start = form.querySelector('.wk-feld') || form.querySelector(gefahr && nein ? '[data-wahl="nein"]' : '[data-wahl="ja"]');
      start.focus();
      if (start.select) start.select();
    });
  }

  const STUFEN = ['offen', 'niedrig', 'mittel', 'hoch'];
  const spur = (n, wert) => `<span class="wk-stufen-spur" aria-hidden="true">${Array.from({ length: n - 1 }, (_, i) => `<i${i < wert ? ' class="an"' : ''}></i>`).join('')}</span>`;
  const begrenzt = (wert, n) => Math.min(n - 1, Math.max(0, Math.round(Number(wert) || 0)));
  let regler = 0;
  const ATTR_NAME = /^[A-Za-z_][\w.:-]*$/;
  const EIGENE = new Set(['type', 'class', 'id', 'name', 'min', 'max', 'step', 'value', 'aria-valuetext', 'data-stufen', 'disabled']);

  /** Stufen-Regler (z. B. Priorität): { name, label, stufen = offen · niedrig · mittel · hoch, wert = 0, knapp, id,
      attribute, gesperrt, marken }
      Echter Schieberegler (input type=range, Pfeiltasten, Tippfläche 44 px), Wort der Stufe daneben.
      Stufe 0 zeigt einen hohlen Knopf („noch nicht gesetzt“). knapp: alles in einer Zeile.
      attribute: eigene Attribute am Regler, z. B. { 'data-wahl': 'i-prio', 'data-prio': true } (Werte escaped,
      true = ohne Wert, false/null = weglassen); Namen, die der Baustein selbst setzt, und on…-Zuhörer sind nicht erlaubt.
      gesperrt: Regler ausgegraut und nicht bedienbar (disabled, zählt nicht im Formular).
      marken: Wörter aller Stufen unter dem Regler (nicht bei knapp), die aktuelle hervorgehoben.
      Wert lesen: input.valueAsNumber oder FormData (name); Änderungen über die Ereignisse input/change des Reglers. */
  function stufen({ name = '', label = 'Priorität', stufen: woerter = STUFEN, wert = 0, knapp = false, id = `wk-stufen-${++regler}`,
    attribute = {}, gesperrt = false, marken = false } = {}) {
    const n = woerter.length, w = begrenzt(wert, n);
    const eigene = Object.entries(attribute || {}).filter(([, v]) => v !== false && v != null).map(([k, v]) => {
      if (!ATTR_NAME.test(k) || EIGENE.has(k.toLowerCase()) || /^on/i.test(k)) throw new Error(`WK.ui.stufen: Attribut „${k}“ nicht erlaubt`);
      return v === true ? ` ${k}` : ` ${k}="${esc(v)}"`;
    }).join('');
    const unten = marken && !knapp

    let klar;
    try {
      klar = await kryp().subtle.decrypt({ name: 'AES-GCM', iv: bytes(paket.iv), additionalData: text.encode(String(bezug || '')) }, schluessel, bytes(paket.daten));

        const grenze = y2 > y1 ? y2 - ZEILE / 2 : y2 + ZEILE / 2, xa = x1 + sx * 8, xb = zumAnfang ? x2 - 8 : x2 + 8;
        return [[x1, y1], [xa, y1], [xa, grenze], [xb, grenze], [xb, y2], [x2, y2]];
      })();
    if (form !== 'rund') {
      return 'M' + punkte[0].join(',') + punkte.slice(1).map((p, i) => (p[0] !== punkte[i][0] ? ` H${p[0]}` : ` V${p[1]}`)).join('');
    }
    let pfad = 'M' + punkte[0].join(',');
    for (let i = 1; i < punkte.length - 1; i++) {
      const [a, p, b] = [punkte[i - 1], punkte[i], punkte[i + 1]];
      const lein = Math.hypot(p[0] - a[0], p[1] - a[1]), laus = Math.hypot(b[0] - p[0], b[1] - p[1]);
      const r = Math.min(6, lein / 2, laus / 2);
      if (r < 0.5) { pfad += ` L${p[0]},${p[1]}`; continue; }
      const vor = [p[0] - (p[0] - a[0]) / lein * r, p[1] - (p[1] - a[1]) / lein * r];

  /** Zeitraum über alle Aufgaben mit Terminen (plus heute), mit 3 Tagen Luft. */
  function zeitraum(aufgaben, heute) {
    const tage = [];
    aufgaben.forEach(a => { if (beginn(a)) tage.push(beginn(a)); if (ende(a)) tage.push(ende(a)); });
    if (heute) tage.push(heute);

  }

  /** Alle Konfliktgründe einer Aufgabe: zuerst die Abhängigkeit, dann die eigenen der App (Feld konflikte). */

    const mit = liste.filter(a => beginn(a));

      const fehlt = Math.floor((o.breite - 2 * RAND_PX) / tb) - anzahl;
      if (fehlt > 0) { z.bis = tagPlus(z.bis, fehlt); anzahl += fehlt; }
    }
    const stufe = o.massstab === 'einpassen' ? massstabNahe(tb) : (MASSSTAB[o.massstab] ? o.massstab : 'wochen');
    const k = kopf(z.von, anzahl, tb, stufe);
    const breite = anzahl * tb + 2 * RAND_PX;

      ? `<details class="wk-gantt-ohne"><summary>${ohne.length} ohne Termin</summary><ul>${ohne.map(a => `<li><button type="button" data-id="${esc(a.id)}">${esc(a.titel || 'Ohne Titel')}</button></li>`).join('')}</ul></details>`
      : '';

    return `<div class="wk-gantt" data-massstab="${esc(stufe)}" data-tagesbreite="${tb}" style="--wk-gantt-zeile:${ZEILE}px">`
      + `<ul class="wk-gantt-namen" style="padding-top:${stufe === 'monate' ? 28 : 48}px">${namen}</ul>`

  /** In ein Element zeichnen. onWahl(id) bei Klick auf Name, Balken oder Punkt. Mit onZiehen(id, tage) lassen sich

    // mit der gemessenen Breite noch einmal zeichnen.

      zug = { b, a, x: ev.clientX, tb, tage: 0, bewegt: false, id: ev.pointerId, schild: null };
      document.addEventListener('keydown', escTaste);

      if (!zug || ev.pointerId !== zug.id || zug.abgebrochen) return;

      if (!zug.bewegt && Math.abs(dx) < 5) return;
      if (!zug.bewegt) {
        zug.bewegt = true;
        try { zug.b.setPointerCapture(ev.pointerId); } catch (e) { /* ohne Fang geht es auch */ }
        zug.b.classList.add('wk-gantt-zieht');
        zug.schild = document.createElement('div');
        zug.schild.className = 'wk-gantt-ziel';
        zug.b.parentNode.appendChild(zug.schild);
      }
      zug.tage = Math.round(dx / zug.tb);
      const px = zug.tage * zug.tb;
      zug.b.style.transform = (zug.b.classList.contains('wk-gantt-punkt') ? `translateX(${px}px) rotate(45deg)` : `translateX(${px}px)`);
      const ziel = tagPlus(zug.a.start || zug.a.ende, zug.tage);
      zug.schild.textContent = (zug.tage ? pufferText(zug.tage) + ' · ' : '') + mitTag(ziel);
      zug.schild.style.left = (zug.b.offsetLeft + px) + 'px';

    el.addEventListener('pointerup', ev => { if (zug && ev.pointerId === zug.id) zugEnde(false); });
    el.addEventListener('pointercancel', ev => { if (zug && ev.pointerId === zug.id) zugEnde(true); });

    neu();
    return {
      massstab(m) { o.massstab = m; neu(); },
      pfeilform(f) { o.pfeilform = f; neu(); },
      aktualisieren(neueDaten) { daten = neueDaten || []; neu(); },
    };
  }

  return {
    html, zeichnen, zeitraum,
    naechsterMassstab, massstabNahe, kopf, tageZwischen, tagPlus, dauer, kalenderwoche, kurz, mitTag, schildText,
    naechsteStufe, art, puffer, pufferText, artText, konflikt, konfliktText, konfliktGruende, kaskade, verschoben, linienPfad,
    MASSSTAB, MASSSTAB_NAMEN, PFEILFORMEN, ARTEN, FORTSCHRITT_STUFEN, ZEILE, RAND_PX,
  };
});

                  puffer?: AT, rolle?, notiz?, wartungsfenster?: bool, freeze?: false, abwesenheit?: false }

     serie      { id, name, kunde, projekt, vorlage: id, regel, von, bis }

                dazu ausweichen: 'frueher' (Standard) | 'spaeter' | 'nein' für Anker auf freien Tagen

      [plus(o, 50), 'Pfingstmontag', true],
      [plus(o, 60), 'Fronleichnam', in_('BW', 'BY', 'HE', 'NW', 'RP', 'SL')],
      [datumAus(jahr, 8, 15), 'Mariä Himmelfahrt', in_('SL')],
      [datumAus(jahr, 9, 20), 'Weltkindertag', in_('TH') && jahr >= 2019],
      [datumAus(jahr, 10, 3), 'Tag der Deutschen Einheit', true],
      [datumAus(jahr, 10, 31), 'Reformationstag', in_('BB', 'MV', 'SN', 'ST', 'TH')
        || (in_('HB', 'HH', 'NI', 'SH') && jahr >= 2018) || jahr === 2017],
      [datumAus(jahr, 11, 1), 'Allerheiligen', in_('BW', 'BY', 'NW', 'RP', 'SL')],
      [bussUndBettag(jahr), 'Buß- und Bettag', in_('SN')],
      [datumAus(jahr, 12, 25), '1. Weihnachtstag', true],
      [datumAus(jahr, 12, 26), '2. Weihnachtstag', true],
    ];
    return liste.filter(f => f[2]).map(([datum, name]) => ({ datum, name })).sort((a, b) => (a.datum < b.datum ? -1 : 1));
  }
  /** Mittwoch vor dem 23. November. */
  function bussUndBettag(j) { const d = datumAus(j, 11, 22); return plus(d, -((wochentag(d) - 3 + 7) % 7)); }

  // --- Kalender eines Kunden mit eigener Verfügbarkeit ---------------------------------------------------
  /** Fragen an den Kalender. Ohne Feiertagsliste gilt der Vorschlag des Bundeslands (je Jahr bei Bedarf). */
  function kalender(kunde, verfuegbarkeit) {
    const k = (kunde && kunde.kalender) || {};
    const abw = (verfuegbarkeit && verfuegbarkeit.abwesenheiten) || [];
    const liste = Array.isArray(k.feiertage) ? new Map(k.feiertage.map(f => [f.datum, f.name])) : null;
    const jahre = new Map();
    function feiertag(d) {
      if (liste) return liste.get(d) || null;
      const j = +d.slice(0, 4);
      if (!jahre.has(j)) jahre.set(j, new Map(feiertageVorschlag(j, k.bundesland).map(f => [f.datum, f.name])));
      return jahre.get(j).get(d) || null;
    }
    const freeze = d => (k.freeze || []).find(f => zwischen(d, f.von, f.bis)) || null;
    const abwesend = d => abw.find(a => zwischen(d, a.von, a.bis)) || null;
    const fenster = d => (k.wartungsfenster || []).find(f => (f.tage || []).includes(wochentag(d))) || null;
    const arbeitstag = d => wochentag(d) <= 5 && !feiertag(d);
    /** n Arbeitstage weiter (n < 0: zurück). Bei 0 der Tag selbst. */
    const atPlus = (d, n) => zaehlen(d, n, arbeitstag);
    /** Nächster Arbeitstag ab d in Richtung r (d selbst, wenn er einer ist; ohne Treffer in SUCHE_TAGE d selbst). */
    function naechsterAT(d, r) {
      for (let i = 0, x = d; i < SUCHE_TAGE; i++, x = plus(x, r)) if (arbeitstag(x)) return x;
      return d;
    }
    return { feiertag, freeze, abwesend, fenster, arbeitstag, atPlus, naechsterAT, hatFenster: !!(k.wartungsfenster || []).length };
  }

  // --- Tage eines Schritts ---------------------------------------------------------------------------------
  /** Grundraster des Schritts: Arbeitstage, im Wartungsfenster die Fenstertage ohne Feiertage. */
  function imRaster(kal, s, d) { return s.wartungsfenster ? !!kal.fenster(d) && !kal.feiertag(d) : kal.arbeitstag(d); }
  /** Warum der Tag für den Schritt gesperrt ist, sonst null. */
  function sperre(kal, s, d) {
    if (s.wartungsfenster) {
      if (!kal.fenster(d)) return kal.hatFenster ? `kein Wartungsfenster am ${WOCHENTAGE[wochentag(d)]}` : 'Kunde hat kein Wartungsfenster';
    } else if (wochentag(d) > 5) return 'Wochenende';
    const f = kal.feiertag(d);
    if (f) return `Feiertag „${f}“`;
    const fr = s.freeze !== false && kal.freeze(d);
    if (fr) return `Freeze „${fr.name || 'ohne Namen'}“`;
    const ab = s.abwesenheit !== false && kal.abwesend(d);
    if (ab) return `Abwesenheit „${ab.grund || 'ohne Grund'}“`;
    return null;
  }
  const rasterPlus = (kal, s, d, n) => zaehlen(d, n, x => imRaster(kal, s, x));
  const dauer = s => Math.min(HOECHSTENS_TAGE, Math.max(1, Math.trunc(Number(s.dauer)) || 1));
  /** Tage im Raster des Schritts von a bis b (beide eingeschlossen), mindestens 1, höchstens HOECHSTENS_TAGE. */
  function rasterTage(kal, s, a, b) {
    let n = 0;
    for (let d = a, i = 0; d <= b && i < HOECHSTENS_TAGE * 2; d = plus(d, 1), i++) if (imRaster(kal, s, d)) n++;
    return Math.max(1, Math.min(HOECHSTENS_TAGE, n));
  }
  const ende = (kal, s, start) => rasterPlus(kal, s, start, dauer(s) - 1);
  const anfangVon = (kal, s, e) => rasterPlus(kal, s, e, -(dauer(s) - 1));
  /** Tage der Spanne im Raster des Schritts. */
  function spanne(kal, s, start) {
    const tage = [start];
    for (let i = 1; i < dauer(s); i++) tage.push(rasterPlus(kal, s, tage[i - 1], 1));
    return tage;
  }
  const spanneSperre = (kal, s, start) => {
    for (const d of spanne(kal, s, start)) { const g = sperre(kal, s, d); if (g) return { tag: d, grund: g }; }
    return null;
  };

  // --- Abhängigkeiten --------------------------------------------------------------------------------------
  /* Puffer zählt in Arbeitstagen. Ende → Anfang heißt: frühestens am Arbeitstag nach dem Ende (dann Puffer).
     Für WK.gantt.konflikt wird daraus der Puffer in Kalendertagen, der genau diese Grenze ergibt. */
  const art = s => gantt.art(s);
  const ankerVon = (t, seite) => (seite === 'a' ? t.start : t.ende);
  function grenze(kal, vorg, nach) {
    const x = art(nach), p = gantt.puffer(nach);
    return kal.atPlus(ankerVon(vorg, x[0]), p + (x === 'ea' ? 1 : x === 'ae' ? -1 : 0));
  }
  function ganttAufgabe(t, mitPuffer) {
    const a = { id: t.schritt, titel: t.titel, start: t.start, ende: t.ende, nach: t.nach || null, art: t.art, erledigt: !!t.erledigt };
    if (mitPuffer !== undefined) a.puffer = mitPuffer;
    return a;
  }
  /** Konflikt zwischen zwei Terminen über WK.gantt.konflikt, Puffer umgerechnet. */
  function abhaengigkeitKonflikt(kal, vorg, nach) {
    const g = grenze(kal, vorg, nach), a = ankerVon(vorg, art(nach)[0]);
    const v = ganttAufgabe(vorg), n = ganttAufgabe(nach, Math.round((zahl(g) - zahl(a)) / MS));
    return gantt.konflikt(v, n);
  }

  /** Reihenfolge so, dass Vorgänger vor Nachfolgern stehen. Kreise brechen auf und werden gemeldet. */
  function reihenfolge(schritte) {
    const nachId = new Map(schritte.map(s => [s.id, s])), fertig = new Set(), aktiv = new Set(), folge = [], kreis = new Set();
    function besuch(s) {
      if (fertig.has(s.id)) return;
      if (aktiv.has(s.id)) { kreis.add(s.id); return; }
      aktiv.add(s.id);
      if (s.nach && nachId.has(s.nach)) besuch(nachId.get(s.nach));
      aktiv.delete(s.id); fertig.add(s.id); folge.push(s);
    }
    schritte.forEach(besuch);
    return { folge, kreis };
  }

  // --- Vorlage und Variante --------------------------------------------------------------------------------
  function finden(daten, id) {
    return (daten.vorlagen || []).find(v => v.id === id) || (daten.varianten || []).find(v => v.id === id) || null;
  }
  /** Wirksame Vorlage: Variante = Stand der Vorlage (auch einer Variante) plus eigene Abweichungen. Jeder Schritt
      trägt `abweichung` ('hinzu' | 'geaendert' | null); `weg` listet entfernte Schritte. */
  function aufloesen(daten, id, gesehen) {
    const quelle = finden(daten, id);
    if (!quelle) throw new Error(`Vorlage „${id}“ fehlt`);
    gesehen = gesehen || new Set();
    if (gesehen.has(id)) throw new Error(`Variante „${id}“ erbt im Kreis`);
    gesehen.add(id);
    if (!quelle.vorlage) {
      return { id: quelle.id, name: quelle.name, anker: quelle.anker || 'Anker', vorlage: quelle.id, variante: null,
        schritte: (quelle.schritte || []).map(s => ({ ...kopie(s), abweichung: null })), weg: [] };
    }
    const basis = aufloesen(daten, quelle.vorlage, gesehen);
    const weg = new Set(quelle.weg || []), geaendert = quelle.geaendert || {};
    const entfernt = basis.schritte.filter(s => weg.has(s.id));
    const vorgaenger = new Map(basis.schritte.map(s => [s.id, s]));
    let schritte = basis.schritte.filter(s => !weg.has(s.id)).map(s => {
      let n = s;
      // Hing der Schritt an einem entfernten, rückt er an dessen Vorgänger (ohne Vorgänger: nur Abstand zum Anker).
      if (n.nach && weg.has(n.nach)) {
        let v = vorgaenger.get(n.nach);
        while (v && v.nach && weg.has(v.nach)) v = vorgaenger.get(v.nach);
        n = { ...n, nach: (v && v.nach) || null, abweichung: n.abweichung || 'geaendert' };
      }
      if (geaendert[s.id]) n = { ...n, ...kopie(geaendert[s.id]), id: s.id, abweichung: n.abweichung === 'hinzu' ? 'hinzu' : 'geaendert' };
      return n;
    });
    schritte = schritte.concat((quelle.hinzu || []).map(s => ({ ...kopie(s), abweichung: 'hinzu' })));
    return { id: quelle.id, name: quelle.name, anker: basis.anker, vorlage: basis.vorlage, variante: quelle.id,
      schritte, weg: basis.weg.concat(entfernt.map(s => ({ id: s.id, titel: s.titel }))) };
  }

  // --- Rechnung --------------------------------------------------------------------------------------------
  /** Termine einer wirksamen Vorlage zum Anker. Ergebnis { termine, konflikte }. */
  function rechnen(vorlage, anker, kunde, verfuegbarkeit) {
    const kal = kalender(kunde, verfuegbarkeit);
    const { folge, kreis } = reihenfolge(vorlage.schritte);
    const schritt = new Map(folge.map(s => [s.id, s]));
    const pos = new Map();      // id → { start, ende }
    const suche = new Map();    // id → Grund, wenn nichts Zulässiges gefunden wurde

    // 1. Soll: Abstand zum Anker, sonst an den Vorgänger gehängt, sonst am Anker.
    folge.forEach(s => {
      let start;
      const v = s.nach && !kreis.has(s.id) && pos.get(s.nach);
      if (Number.isFinite(Number(s.abstand)) && s.abstand !== null && s.abstand !== '') start = kal.atPlus(kal.naechsterAT(anker, 1), Math.trunc(s.abstand));
      else if (v) {
        const g = grenze(kal, v, s);
        start = art(s)[1] === 'a' ? g : anfangVon(kal, s, g);
      } else start = kal.naechsterAT(anker, 1);
      pos.set(s.id, { start, ende: ende(kal, s, start), soll: start });
    });
    const seite = new Map(folge.map(s => [s.id, pos.get(s.id).ende < anker ? 'vor' : 'nach']));

    const nachfolger = id => folge.filter(n => n.nach === id && !kreis.has(n.id));
    const termin = (s, p) => ({ schritt: s.id, titel: s.titel, start: p.start, ende: p.ende, nach: s.nach, art: art(s), puffer: s.puffer });
    function platz(s, r, passt) {
      let d = pos.get(s.id).start, erster = null;
      for (let i = 0; i < SUCHE_TAGE; i++, d = plus(d, r)) {
        if (!imRaster(kal, s, d)) continue;
        const sp = spanneSperre(kal, s, d);
        if (sp) { erster = erster || sp.grund; continue; }
        const p = { start: d, ende: ende(kal, s, d) };
        if (!passt(p)) { erster = erster || 'Abhängigkeit'; continue; }
        return p;
      }
      suche.set(s.id, `kein zulässiger Termin ${r < 0 ? 'vor' : 'ab'} dem Anker gefunden (${erster || 'gesperrt'})`);
      return null;
    }
    // 2. Vor dem Anker rückwärts: Nachfolger zuerst, ausweichen nach früher.
    folge.slice().reverse().filter(s => seite.get(s.id) === 'vor').forEach(s => {
      const p = platz(s, -1, p => nachfolger(s.id).every(n => !abhaengigkeitKonflikt(kal, termin(s, p), termin(n, pos.get(n.id)))));
      if (p) pos.set(s.id, { ...pos.get(s.id), ...p });
    });
    // 3. Ab dem Anker vorwärts: Vorgänger zuerst, ausweichen nach später.
    folge.filter(s => seite.get(s.id) === 'nach').forEach(s => {
      const v = s.nach && !kreis.has(s.id) && schritt.get(s.nach);
      const p = platz(s, 1, p => !v || !abhaengigkeitKonflikt(kal, termin(v, pos.get(v.id)), termin(s, p)));
      if (p) pos.set(s.id, { ...pos.get(s.id), ...p });
    });

    const termine = folge.map(s => {
      const p = pos.get(s.id), f = s.wartungsfenster ? kal.fenster(p.start) : null;
      const ausgewichen = p.start !== p.soll
        ? { tage: Math.round((zahl(p.start) - zahl(p.soll)) / MS), grund: (spanneSperre(kal, s, p.soll) || {}).grund || 'Abhängigkeit' } : null;
      return { schritt: s.id, titel: s.titel, start: p.start, ende: p.ende, soll: p.soll, dauer: dauer(s), seite: seite.get(s.id),
        nach: s.nach || null, art: art(s), puffer: gantt.puffer(s), rolle: s.rolle || '', notiz: s.notiz || '',
        wartungsfenster: !!s.wartungsfenster, uhrzeit: f ? { von: f.von, bis: f.bis } : null, freeze: s.freeze !== false,
        abwesenheit: s.abwesenheit !== false, abweichung: s.abweichung || null, ausgewichen, angepasst: false, konflikte: [] };
    }).sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    termine.forEach(t => {
      if (kreis.has(t.schritt)) t.konflikte.push('Abhängigkeit im Kreis');
      if (suche.has(t.schritt)) t.konflikte.push(suche.get(t.schritt));
    });
    return pruefen(termine, anker, kal);
  }

  /** Konflikte der Termine neu bestimmen (Tage, Abhängigkeiten, Seite des Ankers). Behält Meldungen der Suche.
      Ein erledigter Vorgänger gilt als erfüllt. */
  function pruefen(termine, anker, kal) {
    const nachId = new Map(termine.map(t => [t.schritt, t]));
    termine.forEach(t => {
      const fest = t.konflikte.filter(k => (!t.angepasst && k.startsWith('kein zulässiger')) || k === 'Abhängigkeit im Kreis');
      const k = new Set(fest);
      const s = { dauer: t.dauer, wartungsfenster: t.wartungsfenster, freeze: t.freeze, abwesenheit: t.abwesenheit };
      for (const d of spanne(kal, s, t.start)) { const g = sperre(kal, s, d); if (g) k.add(`${g} am ${d}`); }
      if (t.seite === 'vor' && t.ende >= anker) k.add('reicht über den Anker');
      if (t.seite === 'nach' && t.start < anker && t.start < t.soll) k.add('liegt vor dem Anker');
      const v = t.nach && nachId.get(t.nach);
      if (t.nach && !v) k.add(`Vorgänger „${t.nach}“ fehlt`);
      if (v && !v.erledigt && abhaengigkeitKonflikt(kal, v, t)) k.add(gantt.konfliktText(ganttAufgabe(v), ganttAufgabe(t)));
      t.konflikte = [...k];
    });
    return { termine, konflikte: termine.flatMap(t => t.konflikte.map(grund => ({ schritt: t.schritt, titel: t.titel, grund }))) };
  }

  // --- Lauf ------------------------------------------------------------------------------------------------
  const kundeVon = (daten, id) => (daten.kunden || []).find(k => k.id === id) || null;

  // --- Releases (feste Termine wie LTS-Versionen) -----------------------------------------------------------
  const releaseVon = (daten, id) => (daten.releases || []).find(r => r.id === id) || null;
  /** Gilt das Release für Kunde und Projekt? Ohne Zuordnung für alle, 'kunde/' für alle Projekte des Kunden. */
  function releaseGilt(r, kunde, projekt) {
    const z = r.projekte || [];
    return !z.length || z.includes(`${kunde || ''}/${projekt || ''}`) || z.includes(`${kunde || ''}/`);
  }
  /** Anker aus einem Release: sein Datum plus Abstand in Arbeitstagen des Kunden (0: das Datum selbst). */
  function releaseAnker(daten, kundeId, r, abstand) {
    const n = Math.trunc(Number(abstand) || 0);
    if (!n) return r.datum;
    const kal = kalender(kundeVon(daten, kundeId), daten.verfuegbarkeit);
    return kal.atPlus(kal.naechsterAT(r.datum, n > 0 ? 1 : -1), n);
  }
  /** Neues Datum eines Releases: Läufe mit Anker an diesem Release rechnen neu (wie Anker verschieben, erledigte
      Schritte bleiben). Läufe einer Serie behalten ihre Zuordnung (serienAnker = Datum des Releases).
      Gibt { laeufe, betroffen: [id] } zurück; die Daten selbst bleiben unverändert. */
  function releaseFolgen(daten, releaseId, neuesDatum) {
    const r = releaseVon(daten, releaseId);
    if (!r) throw new Error(`Release „${releaseId}“ fehlt`);
    const neuR = { ...r, datum: neuesDatum }, betroffen = [];
    const laeufe = (daten.laeufe || []).map(l => {
      if (!l.release || l.release.id !== releaseId) return l;
      const anker = releaseAnker(daten, l.kunde, neuR, l.release.abstand);
      let n = l;
      if (anker !== l.anker) { n = ankerVerschieben(daten, l, anker); n.angepasst = l.angepasst; betroffen.push(l.id); }
      if (l.serie && n.serienAnker !== neuesDatum) n = { ...n, serienAnker: neuesDatum };
      return n;
    });
    return { laeufe, betroffen };
  }

  /** Lauf zu einer Vorlage (oder Variante) und einem Anker. Der Stand der Vorlage wird eingefroren. */
  function laufErzeugen(daten, { vorlage, anker, kunde, projekt, serie, serienAnker, id, release }) {
    const v = aufloesen(daten, vorlage);
    const k = kundeVon(daten, kunde);
    const { termine, konflikte } = rechnen(v, anker, k, daten.verfuegbarkeit);
    return { id: id || `${serie || vorlage}-${serienAnker || anker}`, serie: serie || null, kunde: kunde || null,
      projekt: projekt || null, anker, serienAnker: serienAnker || anker,
      vorlage: { id: v.vorlage, name: v.name, variante: v.variante }, stand: kopie({ anker: v.anker, schritte: v.schritte, weg: v.weg }),
      termine, konflikte, angepasst: false, ...(release ? { release: { id: release.id, abstand: Math.trunc(Number(release.abstand) || 0) } } : {}) };
  }

  /** Schritt eines Laufs auf einen neuen Start legen. Offene Nachfolger gehen über WK.gantt.kaskade mit und weichen
      danach Sperren und Abhängigkeiten nach später aus. Gibt einen neuen Lauf zurück, angepasst. */
  function verschieben(daten, lauf, schrittId, neuerStart, neuesEnde) {
    const kal = kalender(kundeVon(daten, lauf.kunde), daten.verfuegbarkeit);
    const neu = kopie(lauf);
    const t = neu.termine.find(x => x.schritt === schrittId);
    if (!t) throw new Error(`Schritt „${schrittId}“ fehlt im Lauf`);
    const s = x => ({ dauer: x.dauer, wartungsfenster: x.wartungsfenster, freeze: x.freeze, abwesenheit: x.abwesenheit });
    // Neues Ende: Dauer dieses Termins = Tage im Raster des Schritts von Start bis Ende (mindestens 1)
    if (neuesEnde && neuesEnde >= neuerStart) t.dauer = rasterTage(kal, s(t), neuerStart, neuesEnde);
    const ziel = { start: neuerStart, ende: ende(kal, s(t), neuerStart) };
    const tage = gantt.kaskade(ganttAufgabe(t), ziel, neu.termine.map(x => ganttAufgabe(x)));
    Object.assign(t, ziel, { angepasst: true });
    const { folge } = reihenfolge(neu.termine.map(x => ({ id: x.schritt, nach: x.nach })));
    const nachId = new Map(neu.termine.map(x => [x.schritt, x]));
    folge.forEach(({ id }) => {
      if (!tage.has(id)) return;
      const x = nachId.get(id), v = x.nach && nachId.get(x.nach);
      let d = plus(x.start, tage.get(id));
      for (let i = 0; i < SUCHE_TAGE; i++, d = plus(d, 1)) {
        const p = { ...x, start: d, ende: ende(kal, s(x), d) };
        if (imRaster(kal, s(x), d) && !spanneSperre(kal, s(x), d) && !(v && !v.erledigt && abhaengigkeitKonflikt(kal, v, p))) break;
      }
      Object.assign(x, { start: d, ende: ende(kal, s(x), d), angepasst: true });
    });
    neu.termine.forEach(x => {
      const f = x.wartungsfenster ? kal.fenster(x.start) : null;
      x.uhrzeit = f ? { von: f.von, bis: f.bis } : null;
    });
    neu.termine.sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    neu.angepasst = true;
    vermerken(lauf.termine, neu.termine);
    return Object.assign(neu, pruefen(neu.termine, neu.anker, kal));
  }

  /** Anker eines Laufs verschieben: Der Lauf rechnet mit dem eingefrorenen Stand neu und weicht Sperrzeiten aus wie
      beim Erzeugen. Erledigte Schritte bleiben, wo sie sind. Gibt einen neuen Lauf zurück, angepasst. */
  function ankerVerschieben(daten, lauf, neuerAnker) {
    const k = kundeVon(daten, lauf.kunde), kal = kalender(k, daten.verfuegbarkeit);
    const { termine } = rechnen({ anker: lauf.stand.anker, schritte: lauf.stand.schritte }, neuerAnker, k, daten.verfuegbarkeit);
    const alt = new Map(lauf.termine.map(t => [t.schritt, t]));
    termine.forEach(t => {
      const a = alt.get(t.schritt);
      if (a && a.erledigt) Object.assign(t, { start: a.start, ende: a.ende, uhrzeit: a.uhrzeit, erledigt: true });
    });

  function vermerken(alt, neu) {

      .map(t => ({ schritt: t.schritt, titel: t.titel, von: vorher.get(t.schritt).start, nach: t.start }));

    const r = regel || {}, aus = [];

    for (let j = +von.slice(0, 4); j <= +bis.slice(0, 4); j++) {
      if (r.art === 'quartal' || r.art === 'jahr') {
        const n = r.art === 'quartal' ? 4 : Math.min(12, Math.max(1, Math.trunc(r.anzahl) || 1));
        const erster = Math.min(12, Math.max(1, +r.monat || 1)) - 1;

      const nur = Array.isArray(r.releases) && r.releases.length ? new Set(r.releases) : null;
      return (daten.releases || []).filter(x => x.datum && zwischen(x.datum, von, bis) && (nur ? nur.has(x.id) : releaseGilt(x, serie.kunde, serie.projekt)))

  function serieErzeugen(daten, serie, zeitraum) {
    const von = (zeitraum && zeitraum.von) || serie.von, bis = (zeitraum && zeitraum.bis) || serie.bis;
    const alle = daten.laeufe || [];
    const eigene = new Map(alle.filter(l => l.serie === serie.id).map(l => [l.serienAnker, l]));
    const bericht = { neu: [], erneuert: [], behalten: [], entfallen: [] };
    const ergebnis = new Map();
    serieAnker(daten, serie, von, bis).forEach(({ serienAnker: a, tag, release }) => {
      const alt = eigene.get(a);
      if (alt && alt.angepasst) { bericht.behalten.push(alt.id); ergebnis.set(a, alt); return; }
      const l = laufErzeugen(daten, { vorlage: serie.vorlage, anker: tag, kunde: serie.kunde, projekt: serie.projekt,
        serie: serie.id, serienAnker: a, id: alt && alt.id, release });
      bericht[alt ? 'erneuert' : 'neu'].push(l.id);
      ergebnis.set(a, l);
    });

    alle.forEach(l => {
      if (l.serie !== serie.id || !zwischen(l.serienAnker, von, bis)) { laeufe.push(l); return; }
      if (ergebnis.has(l.serienAnker)) return;
      if (l.angepasst) { laeufe.push(l); bericht.behalten.push(l.id); } else bericht.entfallen.push(l.id);
    });
    laeufe.push(...ergebnis.values());
    laeufe.sort((a, b) => (a.anker < b.anker ? -1 : a.anker > b.anker ? 1 : 0));
    return { laeufe, ...bericht };
  }

  return {
    WOCHENTAGE, BUNDESLAENDER, plus, wochentag, tageImMonat, ostern, feiertageVorschlag, kalender, sperre,
    aufloesen, rechnen, pruefen, laufErzeugen, verschieben, ankerVerschieben, aenderungen, termintage, standVergleich, nterWochentag, serienAnker, serieErzeugen,
    serieAnker, releaseVon, releaseGilt, releaseAnker, releaseFolgen,
  };
});

<script>
/* Wartungsplaner · Export: Termine als ICS (RFC 5545) für Outlook, Aufgaben als CSV für den Jira-Import.
   Rein rechnend, ohne Oberfläche und ohne Netz. Im Browser WP.export, in Node require('./export.js').

   ICS: je Schritt eines Laufs ein VEVENT, UID = <lauf-id>-<schritt-id>@wartungsplaner.invalid (bleibt gleich, so
   aktualisiert ein erneuter Import in Outlook den Termin). SEQUENCE steigt, wenn sich der Inhalt ändert; den Stand
   dazu (UID → { pruefsumme, sequence }) liefert die Funktion zurück, der Aufrufer legt ihn in den Daten ab.
   Keine RRULE. Ganztägig (DTEND exklusiv) oder mit Uhrzeit im Wartungsfenster (Europe/Berlin).
   CSV: UTF-8 mit BOM, Komma, CRLF; Zellen mit = + - @ Tab CR am Anfang bekommen einen Apostroph (Formel-Injektion).
   Übersichtsplan: eine eigenständige HTML-Datei zum Ansehen und Drucken (je Kunde mit Logo, je Wartung die Schritte).
   Ohne Skript, ohne Netz (eigene CSP), Logos nur als Rasterbild (data:). Das Hausdesign steht in HAUS. */
(function (wurzel, fabrik) {
  const api = fabrik();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (wurzel.WP = wurzel.WP || {}).export = api;
})(typeof window !== 'undefined' ? window : globalThis, function () {
  'use strict';
  const DOMAIN = 'wartungsplaner.invalid';
  const MS = 86400000;
  const zahl = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
  const iso = ms => new Date(ms).toISOString().slice(0, 10);
  const plusTag = (d, n) => iso(zahl(d) + n * MS);
  const kompakt = d => d.replace(/-/g, '');

  /** Standard knapp: Titel nur der Schritt, keine Beschreibung. */
  const STANDARD = { titelMitKunde: false, beschreibung: { kunde: false, projekt: false, vorlage: false, rolle: false, notiz: false } };

  function optionenVon(o) {
    return { titelMitKunde: !!(o && o.titelMitKunde), beschreibung: { ...STANDARD.beschreibung, ...((o && o.beschreibung) || {}) } };
  }

  const kundeName = (daten, id) => ((daten.kunden || []).find(k => k.id === id) || {}).name || '';
  const projektName = (daten, l) => {
    const k = (daten.kunden || []).find(x => x.id === l.kunde);

  };

  /** Auswahl: { lauf?: id, kunde?: id, von?: datum, bis?: datum }. Zeitraum: Termine, die ihn berühren.

  function auswaehlen(daten, auswahl = {}) {
    const r = [];
    (daten.laeufe || []).forEach(lauf => {
      if (auswahl.lauf && lauf.id !== auswahl.lauf) return;
      if (auswahl.kunde && lauf.kunde !== auswahl.kunde) return;
      lauf.termine.forEach(termin => {
        if (auswahl.von && termin.ende < auswahl.von) return;
        if (auswahl.bis && termin.start > auswahl.bis) return;
        r.push({ lauf, termin });

  function texte(daten, { lauf, termin }, o) {

    const b = o.beschreibung;
    const zeilen = [];
    if (b.kunde && kunde) zeilen.push(`Kunde: ${kunde}`);
    if (b.projekt && projektName(daten, lauf)) zeilen.push(`Projekt: ${projektName(daten, lauf)}`);
    if (b.vorlage && lauf.vorlage) zeilen.push(`Vorlage: ${lauf.vorlage.name}`);
    if (b.rolle && termin.rolle) zeilen.push(`Rolle: ${termin.rolle}`);

    'BEGIN:STANDARD', 'DTSTART:19961027T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU',
    'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'END:STANDARD',
    'BEGIN:DAYLIGHT', 'DTSTART:19810329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU',
    'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'END:DAYLIGHT',

      const summe = pruefsumme(inhalt), alt = stand[uid];
      const sequence = !alt ? 0 : alt.pruefsumme === summe ? alt.sequence : alt.sequence + 1;

  // ------------------------------------------------------------------------------------------ CSV

  const KOPF = ['Summary', 'Description', 'Due Date', 'Start Date'];

  /** Formel-Injektion abfangen und nach RFC 4180 in Anführungszeichen setzen, wenn nötig. */
  function zelle(wert) {
    let s = String(wert == null ? '' : wert);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;

    name: 'Wartungsplan', schrift: '"Segoe UI", system-ui, sans-serif', text: '#141B2D', leise: '#5A6478',
    flaeche: '#F4F6FA', akzent: '#141B2D', aufAkzent: '#FFFFFF', gut: '#1F6F50', warnung: '#8A5A00', fehler: '#B42318',

  const LOGO = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
  const html = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const tagText = d => (d ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : '–');
  const STATUS = t => (t.erledigt ? ['gut', '✓', 'Erledigt'] : (t.konflikte || []).length ? ['fehler', '⚠', 'Konflikt'] : ['', '○', 'Geplant']);

  /** Übersichtsplan als HTML-Text. Auswahl wie bei ICS/CSV; heute (JJJJ-MM-TT) für den Stand. → { text, anzahl } */
  function plan(daten, auswahl = {}, heute = new Date().toISOString().slice(0, 10)) {
    const termine = auswaehlen(daten, auswahl), H = HAUS;
    const kunden = (daten.kunden || []).map(k => ({ k, laeufe: new Map() }));
    const ohne = { k: { id: null, name: 'Ohne Kunde' }, laeufe: new Map() };
    termine.forEach(({ lauf, termin }) => {
      const g = kunden.find(x => x.k.id === lauf.kunde) || ohne;
      if (!g.laeufe.has(lauf)) g.laeufe.set(lauf, []);
      g.laeufe.get(lauf).push(termin);
    });
    const zeichen = k => (k.logo && LOGO.test(k.logo) ? `<img class="logo" src="${k.logo}" alt="">`
      : `<span class="logo initialen">${html(String(k.name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`);
    const abschnitte = [...kunden, ohne].filter(g => g.laeufe.size).map(({ k, laeufe }) => `<section class="kunde"><h2>${zeichen(k)}<span>${html(k.name)}</span></h2>`
      + [...laeufe].map(([l, ts]) => `<h3>${html(l.vorlage ? l.vorlage.name : 'Wartung')} · Anker ${tagText(l.anker)}${projektName(daten, l) ? ` · ${html(projektName(daten, l))}` : ''}</h3>`
        + `<table><thead><tr><th>Schritt</th><th>Start</th><th>Ende</th><th>Rolle</th><th>Status</th></tr></thead><tbody>`
        + ts.map(t => { const [k2, sym, wort] = STATUS(t); return `<tr><td>${html(t.titel)}</td><td>${tagText(t.start)}</td><td>${tagText(t.ende)}</td>`
          + `<td>${html(t.rolle || '')}</td><td class="${k2}">${sym} ${wort}</td></tr>`; }).join('')
        + '</tbody></table>').join('') + '</section>').join('');
    const zeitraum = auswahl.von || auswahl.bis ? `${tagText(auswahl.von)} – ${tagText(auswahl.bis)}` : 'alle Termine';
    const text = `<!doctype html>\n<html lang="de"><head><meta charset="utf-8">`
      + `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">`
      + `<meta name="viewport" content="width=device-width, initial-scale=1"><title>${html(H.name)} · Stand ${tagText(heute)}</title><style>`
      + `@page{size:A4 landscape;margin:14mm}body{margin:0;padding:24px;font:14px/1.45 ${H.schrift};color:${H.text};background:#fff}`
      + `header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 20px;border-radius:12px;background:${H.akzent};color:${H.aufAkzent}}`
      + `header h1{margin:0;font-size:22px}header p{margin:0;opacity:.85}.kunde{break-inside:avoid-page;margin-top:24px}`
      + `h2{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-size:18px}h3{margin:16px 0 6px;font-size:14px;color:${H.leise}}`
      + `.logo{width:36px;height:36px;object-fit:contain;border-radius:8px;background:${H.flaeche}}.initialen{display:inline-grid;place-items:center;font-size:13px;color:${H.leise}}`
      + `table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th{text-align:left;font-size:12px;color:${H.leise};padding:6px 10px;background:${H.flaeche}}`
      + `td{padding:6px 10px}tbody tr:nth-child(even) td{background:${H.flaeche}}.gut{color:${H.gut}}.fehler{color:${H.fehler};font-weight:600}`
      + `footer{margin-top:32px;font-size:12px;color:${H.leise}}<\/style></head><body>`
      + `<header><h1>${html(H.name)}</h1><p>${html(zeitraum)} · Stand ${tagText(heute)} · ${termine.length} ${termine.length === 1 ? 'Termin' : 'Termine'}</p></header>`
      + (abschnitte || '<p>Keine Termine in der Auswahl.</p>')
      + `<footer>${html(H.fuss)}</footer></body></html>\n`;
    return { text, anzahl: termine.length };
  }

  return { DOMAIN, STANDARD, HAUS, auswaehlen, texte, maskieren, falten, zelle, ics, csv, plan };
});

<script>
/* Wartungsplaner · Datei: Format der verschlüsselten Datei (*.wpdb), Migration und Speichern im Ordner.
   Braucht tresor (WK.tresor). Im Browser WK.datei, in Node require('./datei.js') (dann vorher tresor.js laden).

   Aufbau der Datei (JSON, nur Umschlag und Paket, kein Klartext):
     { app: 'wartungsplaner', version: 1, umschlag: {…tresor…}, paket: {…tresor…} }
   Das Paket ist an den Bezug „wpdb:<version>“ gebunden: Wer die Version im Kopf ändert, bekommt einen Fehler.
   Im Paket liegt { gespeichert: ISO-Zeit, daten }. Ältere Versionen laufen beim Öffnen durch MIGRATIONEN.

   Ordner (File System Access API): ordnerSpeichern schreibt zuerst wartungsplaner.wpdb.neu, liest sie zurück,
   legt den bisherigen Stand als sicherung/wartungsplaner-<Zeitstempel>.wpdb ab und ersetzt dann die Datei
   (move, sonst createWritable: Chrome schreibt in eine Tauschdatei und ersetzt erst beim Schließen).
   Es bleiben die letzten BEHALTEN Sicherungen. */
(function (wurzel, fabrik) {
  const api = fabrik(wurzel);
  if (typeof module === 'object' && module.exports) module.exports = api;
  (wurzel.WK = wurzel.WK || {}).datei = api;
})(typeof window !== 'undefined' ? window : globalThis, function (wurzel) {
  'use strict';
  const APP = 'wartungsplaner', VERSION = 1;
  const DATEINAME = 'wartungsplaner.wpdb', NEU = DATEINAME + '.neu', SICHERUNG = 'sicherung', BEHALTEN = 10;
  const SICHERUNG_MUSTER = /^wartungsplaner-\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}(_\d+)?\.wpdb$/;
  const bezug = v => `wpdb:${v}`;
  const tresor = () => wurzel.WK.tresor;

  /* Je Version eine Funktion, die Daten dieser Version in die nächste überführt: { 1: d => ({ …d, neu: [] }) }.
     Mit dem Eintrag VERSION hochzählen. */
  const MIGRATIONEN = {};

  function fehler(art, meldung) { const e = new Error(meldung); e.art = art; return e; }

  // Aufbau wie im Kern (src/kern/kern.js). Ältere Dateien ohne einzelne Listen ergänzt WP.form.vollstaendig beim Lesen.
  const leereDaten = () => ({ kunden: [], verfuegbarkeit: { abwesenheiten: [] }, vorlagen: [], varianten: [], serien: [], laeufe: [] });

  /** Text der Datei prüfen und zerlegen. Fehler: art 'format' (keine wpdb) oder 'neuer' (aus neuerer App). */
  function lesen(text) {
    let d;
    try { d = JSON.parse(text); } catch (e) { throw fehler('format', 'Keine Datei des Wartungsplaners.'); }
    if (!d || typeof d !== 'object' || d.app !== APP || !Number.isInteger(d.version) || d.version < 1
      || !d.umschlag || typeof d.umschlag !== 'object' || !d.paket || typeof d.paket !== 'object') {
      throw fehler('format', 'Keine Datei des Wartungsplaners.');
    }
    if (d.version > VERSION) throw fehler('neuer', `Die Datei hat Version ${d.version}, diese App kennt bis ${VERSION}.`);
    return d;
  }

  function migrieren(daten, von, migrationen = MIGRATIONEN, bis = VERSION) {
    for (let v = von; v < bis; v++) {
      if (typeof migrationen[v] !== 'function') throw fehler('format', `Keine Migration von Version ${v}.`);
      daten = migrationen[v](daten);
    }
    return daten;
  }

  /** { umschlag, schluessel } + Daten → Text der Datei (immer in der aktuellen Version). */
  async function verpacken({ umschlag, schluessel }, daten, jetzt = new Date()) {
    const paket = await tresor().verschluesseln(schluessel, { gespeichert: jetzt.toISOString(), daten }, bezug(VERSION));
    return JSON.stringify({ app: APP, version: VERSION, umschlag, paket }) + '\n';
  }

  /** Neue Datei: { umschlag, schluessel, text }. Schwaches Passwort → art 'schwach'. */
  async function anlegen(passwort, daten = leereDaten(), optionen) {
    const { umschlag, schluessel } = await tresor().anlegen(passwort, optionen);
    return { umschlag, schluessel, text: await verpacken({ umschlag, schluessel }, daten) };
  }

  /** Text + Passwort → { umschlag, schluessel, daten, gespeichert, migriert }.
      Fehler: art 'format' | 'neuer' | 'passwort' | 'beschaedigt' (verändert oder Umschlag vertauscht). */
  async function entsperren(text, passwort, migrationen = MIGRATIONEN) {
    const d = lesen(text);
    const runden = d.umschlag.runden;
    if (!Number.isInteger(runden) || runden < 1000 || runden > 10000000) throw fehler('beschaedigt', 'Der Umschlag der Datei ist beschädigt.');
    let schluessel;
    try { schluessel = await tresor().oeffnen(d.umschlag, passwort); } catch (e) {
      throw e.art ? e : fehler('beschaedigt', 'Der Umschlag der Datei ist beschädigt.');
    }
    let inhalt;
    try { inhalt = await tresor().entschluesseln(schluessel, d.paket, bezug(d.version)); } catch (e) {
      throw e.art === 'beschaedigt' ? fehler('beschaedigt', 'Die Datei ist beschädigt oder wurde verändert.') : e;
    }
    if (!inhalt || typeof inhalt !== 'object' || !inhalt.daten) throw fehler('beschaedigt', 'Die Datei enthält keine Daten.');
    return { umschlag: d.umschlag, schluessel, daten: migrieren(inhalt.daten, d.version, migrationen),
      gespeichert: inhalt.gespeichert || null, migriert: d.version < VERSION };
  }

  /* ------------------------------------------------------------ Ordner */

  const zwei = n => String(n).padStart(2, '0');
  /** Ortszeit, dateinamentauglich und sortierbar: 2026-10-20_14-03-07 */
  const zeitstempel = (t = new Date()) => `${t.getFullYear()}-${zwei(t.getMonth() + 1)}-${zwei(t.getDate())}_`
    + `${zwei(t.getHours())}-${zwei(t.getMinutes())}-${zwei(t.getSeconds())}`;

  const fehlt = e => e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError');

  async function textSchreiben(griff, text) {
    const w = await griff.createWritable();
    try { await w.write(text); await w.close(); } catch (e) { try { await w.abort(); } catch (x) { /* schon zu */ } throw e; }
  }
  async function dateiLesen(ordner, name) {
    try { return await (await (await ordner.getFileHandle(name)).getFile()).text(); } catch (e) { if (fehlt(e)) return null; throw e; }
  }

  /** Text von wartungsplaner.wpdb oder null, wenn sie fehlt. */
  const ordnerLesen = ordner => dateiLesen(ordner, DATEINAME);

  /** Namen der Sicherungen, älteste zuerst. */
  async function sicherungen(ordner) {
    let s;
    try { s = await ordner.getDirectoryHandle(SICHERUNG); } catch (e) { if (fehlt(e)) return []; throw e; }
    const namen = [];
    for await (const [name, griff] of s.entries()) if (griff.kind === 'file' && SICHERUNG_MUSTER.test(name)) namen.push(name);
    // Nummer hinter der Sekunde numerisch: _2 vor _10
    const reihe = n => n.replace(/(?:_(\d+))?\.wpdb$/, (m, nr) => '.' + String(nr || 1).padStart(6, '0'));
    return namen.sort((a, b) => (reihe(a) < reihe(b) ? -1 : reihe(a) > reihe(b) ? 1 : 0));
  }

  /** Text als neue Sicherung ablegen und auf die letzten `behalten` kürzen. Gibt den Namen zurück. */
  async function sicherungAblegen(ordner, text, { jetzt = new Date(), behalten = BEHALTEN } = {}) {
    const s = await ordner.getDirectoryHandle(SICHERUNG, { create: true });
    const vorhanden = new Set(await sicherungen(ordner));
    let name = `wartungsplaner-${zeitstempel(jetzt)}.wpdb`;
    for (let i = 2; vorhanden.has(name); i++) name = `wartungsplaner-${zeitstempel(jetzt)}_${i}.wpdb`;
    await textSchreiben(await s.getFileHandle(name, { create: true }), text);
    const alle = await sicherungen(ordner);
    for (const alt of alle.slice(0, Math.max(0, alle.length - behalten))) await s.removeEntry(alt);
    return name;
  }

  /** Atomar speichern, der bisherige Stand wandert in sicherung/. → { sicherung: Name oder null } */
  async function ordnerSpeichern(ordner, text, { jetzt = new Date(), behalten = BEHALTEN } = {}) {
    const neu = await ordner.getFileHandle(NEU, { create: true });
    await textSchreiben(neu, text);
    if (await (await neu.getFile()).text() !== text) throw fehler('schreiben', 'Die Datei ließ sich nicht vollständig schreiben.');
    const alt = await ordnerLesen(ordner);
    const sicherung = alt !== null && alt !== text ? await sicherungAblegen(ordner, alt, { jetzt, behalten }) : null;
    let ersetzt = false;
    if (typeof neu.move === 'function') {
      try { await neu.move(ordner, DATEINAME); ersetzt = true; } catch (e) { /* move über eine bestehende Datei geht nicht überall */ }
    }
    if (!ersetzt) {
      await textSchreiben(await ordner.getFileHandle(DATEINAME, { create: true }), text);
      try { await ordner.removeEntry(NEU); } catch (e) { /* bleibt liegen, wird beim nächsten Mal überschrieben */ }
    }
    return { sicherung };
  }

  return { APP, VERSION, DATEINAME, SICHERUNG, BEHALTEN, MIGRATIONEN, bezug, leereDaten, lesen, migrieren, verpacken,
    anlegen, entsperren, zeitstempel, ordnerLesen, ordnerSpeichern, sicherungAblegen, sicherungen };
});
</script>
<script>
/* Wartungsplaner · Sitzung: Datendatei wählen, anlegen, entsperren, speichern und wieder sperren.
   Braucht ui-bausteine (WK.ui), tresor (WK.tresor) und datei (WK.datei). Stellt WK.sitzung bereit:
     starten({ melden })   melden() wird nach jeder Änderung des Zustands gerufen (App zeichnet neu)
     info()                { offen, weg, ort, ungespeichert, speichert, speicherFehler, gespeichert, pin, pinBereit }
     sperrbild()           HTML des Sperrbildschirms (H1, eine Hauptaktion), solange nicht offen
     daten() / aendern(fn) Klartext lesen bzw. ändern (nur offen), aendern plant das Speichern
     uebung(d | null)      Übungsdaten der Einführung einsetzen bzw. verwerfen. Solange sie gesetzt sind, lesen und
                           ändern daten() und aendern() nur sie: nichts davon landet in der Datei, die echten Daten bleiben
                           unberührt. Sperren verwirft sie.
     speichern(), sicherungErstellen(), passwortAendern(alt, neu), sperren(grund)
     einstellungen() / einstellungenSetzen({ minuten, verborgen })
     pinFestlegen(passwort, pin), pinEntfernen(), pinPruefen(pin)

   Weg 1 (File System Access API): Ein Ordner wird gewählt, sein Griff liegt in IndexedDB (nie Inhalte).
   Änderungen speichert die Sitzung nach kurzer Pause selbst, atomar und mit Sicherungen (WK.datei).
   Weg 2 (Rückfall, API fehlt oder gesperrt): Öffnen über den Datei-Dialog, Speichern als Download mit Zeitstempel.
   Bis dahin steht „Ungespeicherte Änderungen“ in der App, und die Seite warnt beim Schließen.

   Sperren (Leerlauf, Knopf, auf Wunsch Fenster länger als 1 Minute verborgen) verwirft Schlüssel und Klartext. Ein
   verdecktes Fenster sperrt nicht sofort: Die Zeit zählt wie Leerlauf. Was noch nicht gespeichert ist, bleibt nur
   verschlüsselt im Speicher der Seite (vorrat). localStorage hält die Einstellungen und die PIN, diese nur
   verschlüsselt mit dem Datenschlüssel.

   PIN: Nach dem Entsperren mit Passwort packt die Sitzung den Datenschlüssel zusätzlich mit der PIN ein (pinUmschlag,
   WK.tresor.zweitUmschlag). Der liegt nur im Speicher der Seite, nie in der Datei oder im Browser. Gesperrt reicht
   dann die PIN. Nach dem Schließen der App, nach PIN_VERSUCHE falschen Versuchen oder beim Wechsel der Datei braucht es
   wieder das Passwort. */
(function () {
  'use strict';
  const { ui, datei: D, tresor: T } = WK;
  const esc = ui.esc;
  const EINSTELLUNG = 'wartungsplaner.sperre';
  const STANDARD = { minuten: 10, verborgen: false };
  const PIN_SCHLUESSEL = 'wartungsplaner.pin', PIN_BEZUG = 'wartungsplaner-pin', PIN_VERSUCHE = 5, VERBORGEN_MS = 60000;
  const MINUTEN = [1, 5, 10, 15, 30, 60];
  const IDB = { name: 'wartungsplaner', speicher: 'griffe', ordner: 'ordner' };
  const SCHREIBEN = { mode: 'readwrite' };
  const OHNE_FREIGABE = ' Ohne Freigabe geht es auch: „Ohne Ordner arbeiten“.';

  // Geheim: nur in diesen zwei Variablen, nie im Zustand der App oder im Speicher des Browsers.
  let schluessel = null, daten = null;
  // Nicht geheim: eingepackter Datenschlüssel und verschlüsselte Stände.
  let umschlag = null, vorrat = null;
  // Übungsdaten der Einführung (erfunden): nur im Speicher, nie in der Datei
  let uebung = null;
  let melden = () => {};
  let stand = 0, gespeicherterStand = 0, kette = Promise.resolve(), speicherUhr = null, letzteEingabe = Date.now(), verborgenSeit = null;
  // Datenschlüssel mit der PIN eingepackt: nur im Speicher, solange die App offen ist (siehe oben)
  // pinRunde: Jede Änderung zählt hoch, damit ein noch laufendes pinVorbereiten sie nicht überschreibt
  let pinUmschlag = null, pinFehler = 0, pinRunde = 0;
  const pinSetzen = (u) => { pinRunde++; pinUmschlag = u; };

  const s = {
    offen: false,
    weg: null,            // 'ordner' | 'einzeln'
    ordner: null,         // FileSystemDirectoryHandle
    dateiName: '',        // Weg 2: Name der geöffneten oder zuletzt heruntergeladenen Datei
    dateiText: null,      // Weg 2: verschlüsselter Text der gewählten Datei
    tuer: 'start',        // start | freigabe | entsperren | pin | anlegen
    meldung: null,        // { art: 'fehler' | 'hinweis', text }
    arbeitet: 'Datei wird gesucht …',
    richtlinie: false,    // Ordnerzugriff vorhanden, aber gesperrt
    ungespeichert: false, speichert: false, speicherFehler: '', gespeichert: null,
  };

  const ordnerMoeglich = () => typeof window.showDirectoryPicker === 'function' && !s.richtlinie;

  /* ------------------------------------------------------------ Einstellungen (einziges im localStorage) */

  function einstellungen() {
    let e = null;
    try { e = JSON.parse(localStorage.getItem(EINSTELLUNG) || 'null'); } catch (x) { /* gesperrt oder kaputt */ }
    const minuten = e && MINUTEN.includes(e.minuten) ? e.minuten : STANDARD.minuten;
    // Früheres „beimVerbergen“ (sofort sperren) gilt nicht mehr: verdeckte Fenster sperrten zu oft.
    return { minuten, verborgen: e && typeof e.verborgen === 'boolean' ? e.verborgen : STANDARD.verborgen };
  }
  function einstellungenSetzen(teil) {

    try { localStorage.setItem(EINSTELLUNG, JSON.stringify({ minuten: neu.minuten, verborgen: neu.verborgen })); } catch (x) { /* gilt bis zum Schließen nicht */ }
    melden();
  }

  const pinPaket = () => { try { return JSON.parse(localStorage.getItem(PIN_SCHLUESSEL) || 'null'); } catch (x) { return null; } };

  /** '' oder ein Hinweis, warum die PIN nicht geht: 4 bis 8 Ziffern, keine Wiederholung, keine Zahlenfolge. */
  function pinPruefen(pin) {
    const p = String(pin || '');
    if (!/^\d{4,8}$/.test(p)) return 'Die PIN hat 4 bis 8 Ziffern.';
    if (/^(\d)\1+$/.test(p)) return 'Bitte nicht nur eine Ziffer wiederholen.';
    if ('01234567890'.includes(p) || '09876543210'.includes(p)) return 'Bitte keine Zahlenfolge wie 1234.';
    return '';
  }

  /** Nach dem Entsperren mit Passwort: gemerkte PIN lesen und den Datenschlüssel für diese Sitzung damit einpacken. */
  async function pinVorbereiten(passwort) {
    const paket = pinPaket(), k = schluessel, u = umschlag;
    pinSetzen(null); pinFehler = 0;
    const runde = pinRunde;
    if (!paket || !k) return;
    try {
      const pin = await T.entschluesseln(k, paket, PIN_BEZUG);
      const neu = await T.zweitUmschlag(u, passwort, pin);
      if (runde === pinRunde) pinUmschlag = neu;                  // PIN inzwischen entfernt oder neu festgelegt: gilt nicht mehr
    } catch (e) { /* PIN einer anderen Datei: gilt hier nicht */ }
  }

  /** PIN festlegen oder ändern. Braucht das Passwort. Fehler: art 'passwort' oder 'pin' (Text in message). */
  async function pinFestlegen(passwort, pin) {
    if (!s.offen) throw new Error('Gesperrt');
    const hinweis = pinPruefen(pin);
    if (hinweis) throw Object.assign(new Error(hinweis), { art: 'pin' });
    const neu = await T.zweitUmschlag(umschlag, passwort, pin);
    const paket = await T.verschluesseln(schluessel, pin, PIN_BEZUG);
    try { localStorage.setItem(PIN_SCHLUESSEL, JSON.stringify(paket)); } catch (x) { /* gilt nur bis zum Schließen */ }
    pinSetzen(neu); pinFehler = 0;
    melden();
  }

  function pinEntfernen() {
    try { localStorage.removeItem(PIN_SCHLUESSEL); } catch (x) { /* nichts gemerkt */ }
    pinSetzen(null); pinFehler = 0;
    melden();
  }

  const weiter = () => (pinUmschlag ? 'Zum Weiterarbeiten die PIN eingeben.' : 'Zum Weiterarbeiten das Passwort eingeben.');

  /* ------------------------------------------------------------ IndexedDB: nur der Griff zum Ordner */

  function idb(modus, arbeit) {
    return new Promise((ja, nein) => {
      const anfrage = indexedDB.open(IDB.name, 1);
      anfrage.onupgradeneeded = () => anfrage.result.createObjectStore(IDB.speicher);
      anfrage.onerror = () => nein(anfrage.error);
      anfrage.onsuccess = () => {
        const db = anfrage.result, t = db.transaction(IDB.speicher, modus);
        const r = arbeit(t.objectStore(IDB.speicher));
        t.oncomplete = () => { db.close(); ja(r && r.result); };
        t.onerror = t.onabort = () => { db.close(); nein(t.error); };
      };
    });
  }
  const griffLesen = () => idb('readonly', sp => sp.get(IDB.ordner)).catch(() => null);
  const griffMerken = griff => idb('readwrite', sp => sp.put(griff, IDB.ordner)).catch(() => {});

  /* ------------------------------------------------------------ Meldungen: Ursache und Lösung */

  function ursache(e) {
    const art = e && (e.art || e.name);
    if (art === 'passwort') return 'Das Passwort passt nicht zu dieser Datei. Bitte noch einmal eingeben und auf Groß- und Kleinschreibung achten.';
    if (art === 'beschaedigt') {
      return s.weg === 'ordner'
        ? 'Die Datei ist beschädigt oder wurde verändert. Bitte im Ordner „sicherung“ die neueste Sicherung nach „wartungsplaner.wpdb“ kopieren und erneut öffnen.'
        : 'Die Datei ist beschädigt oder wurde verändert. Bitte eine ältere gespeicherte Datei öffnen.';
    }
    if (art === 'format') return 'Diese Datei stammt nicht vom Wartungsplaner. Bitte eine Datei mit der Endung .wpdb wählen.';
    if (art === 'neuer') return 'Diese Datei stammt aus einer neueren Version des Wartungsplaners. Bitte die neue Version der App öffnen.';
    if (art === 'schwach') return `Das Passwort ist zu schwach. ${e.message}`;
    if (art === 'browser') return 'Dieser Browser kann nicht verschlüsseln. Bitte die Datei in Google Chrome öffnen.';
    if (art === 'NotAllowedError' || art === 'SecurityError') {
      return 'Chrome hat den Zugriff auf den Ordner nicht erlaubt. Bitte „Ordner freigeben“ wählen und „Bearbeiten erlauben“ bestätigen.';
    }
    if (art === 'NotFoundError') return 'Der Ordner ist nicht mehr da, vielleicht verschoben oder umbenannt. Bitte „Ordner wählen“ und ihn neu auswählen.';
    if (art === 'QuotaExceededError') return 'Auf dem Laufwerk ist kein Platz mehr. Bitte Platz schaffen und dann „Speichern“ wählen.';
    if (art === 'NotReadableError') return 'Die Datei lässt sich nicht lesen, vielleicht ist sie in einem anderen Programm geöffnet. Bitte das Programm schließen und es noch einmal versuchen.';
    return `Unerwarteter Fehler (${e && e.name}: ${e && e.message}). Bitte die Seite neu laden. Die Datei auf der Platte bleibt dabei unverändert.`;
  }

  const ort = () => (s.weg === 'ordner' && s.ordner ? `Ordner „${s.ordner.name}“ · ${D.DATEINAME}`
    : s.weg === 'einzeln' ? (s.dateiName ? `Datei „${s.dateiName}“` : 'Neue Datei, noch nicht gespeichert') : '');

  function info() {
    return { offen: s.offen, uebung: !!uebung, weg: s.weg, ort: ort(), ungespeichert: s.ungespeichert, speichert: s.speichert,
      speicherFehler: s.speicherFehler, gespeichert: s.gespeichert, pin: !!pinPaket(), pinBereit: !!pinUmschlag };
  }

  /* ------------------------------------------------------------ Start und Tür (Sperrbildschirm) */

  function tuer(schritt, meldung = null) { s.tuer = schritt; s.meldung = meldung; s.arbeitet = ''; melden(); }

  async function starten(optionen) {
    melden = optionen.melden || melden;
    if (!T.moeglich()) return tuer('start', { art: 'fehler', text: ursache({ art: 'browser' }) });
    if (typeof window.showDirectoryPicker === 'function') {
      const griff = await griffLesen();
      if (griff && griff.kind === 'directory') {
        s.weg = 'ordner'; s.ordner = griff;
        let recht = 'prompt';
        try { recht = await griff.queryPermission(SCHREIBEN); } catch (e) { /* alter Griff */ }
        if (recht === 'granted') return ordnerPruefen();
        return tuer('freigabe');
      }
    }
    tuer('start');
  }

  async function ordnerPruefen() {
    try {
      const text = await D.ordnerLesen(s.ordner);
      tuer(text === null ? 'anlegen' : 'entsperren');
    } catch (e) {
      if (e.name === 'NotAllowedError') return tuer('freigabe', { art: 'fehler', text: ursache(e) });
      tuer('start', { art: 'fehler', text: ursache(e) });
    }
  }

  async function ordnerWaehlen() {
    let griff;
    try {
      griff = await window.showDirectoryPicker({ id: 'wartungsplaner', mode: 'readwrite', startIn: 'documents' });
    } catch (e) {
      if (e.name === 'AbortError') return;                       // Dialog abgebrochen
      if (e.name === 'SecurityError' || e.name === 'NotAllowedError') {
        s.richtlinie = true;
        return tuer('start', { art: 'hinweis', text: 'Chrome erlaubt hier keinen Zugriff auf Ordner, zum Beispiel wegen einer Richtlinie. Der Wartungsplaner arbeitet deshalb mit Datei-Dialog und Download.' });
      }
      return tuer('start', { art: 'fehler', text: ursache(e) });
    }
    s.weg = 'ordner'; s.ordner = griff; s.dateiText = null; vorrat = null; pinSetzen(null);
    await griffMerken(griff);
    if (await griff.queryPermission(SCHREIBEN) !== 'granted' && await griff.requestPermission(SCHREIBEN) !== 'granted') {
      return tuer('freigabe', { art: 'fehler', text: ursache({ name: 'NotAllowedError' }) + OHNE_FREIGABE });
    }
    await ordnerPruefen();
  }

  async function freigeben() {
    let recht = 'denied';
    try { recht = await s.ordner.requestPermission(SCHREIBEN); } catch (e) { /* zählt als abgelehnt */ }
    if (recht === 'granted') return ordnerPruefen();
    tuer('freigabe', { art: 'fehler', text: ursache({ name: 'NotAllowedError' }) + OHNE_FREIGABE });
  }

  async function dateiGewaehlt(datei) {
    if (!datei) return;
    let text;
    try { text = await datei.text(); D.lesen(text); } catch (e) {
      return tuer(s.tuer, { art: 'fehler', text: ursache(e.art ? e : { name: 'NotReadableError' }) });
    }
    s.weg = 'einzeln'; s.ordner = null; s.dateiName = datei.name; s.dateiText = text; vorrat = null; s.ungespeichert = false;
    pinSetzen(null);
    tuer('entsperren');
  }

  function formular(form) {
    const werte = Object.fromEntries(new FormData(form));
    form.reset();                                                  // Passwort nicht im Feld stehen lassen
    return werte;
  }

  async function entsperren(passwort) {
    s.arbeitet = 'Datei wird entschlüsselt …'; s.meldung = null; melden();
    try {
      const text = vorrat || (s.weg === 'ordner' ? await D.ordnerLesen(s.ordner) : s.dateiText);
      if (text === null) return ordnerPruefen();
      const r = await D.entsperren(text, passwort);
      schluessel = r.schluessel; umschlag = r.umschlag; daten = r.daten; vorrat = null;
      if (r.migriert) { stand++; s.ungespeichert = true; }
      oeffnen();
      if (s.ungespeichert) planen();
      pinVorbereiten(passwort);
    } catch (e) {
      tuer('entsperren', { art: 'fehler', text: ursache(e) });
    }
  }

  /** Gesperrt mit PIN: Datei (oder Vorrat) mit dem PIN-Umschlag statt dem eigenen öffnen. */
  async function entsperrenMitPin(pin) {
    if (!pinUmschlag) return tuer('entsperren');
